name: Publish exact SQL selection checkpoint

on:
  push:
    branches: [codex/sql-semantic-context-recovery]
    paths: [.github/workflows/sql-selection-checkpoint.yml]

permissions:
  contents: write

concurrency:
  group: sql-selection-checkpoint-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'hurtener/chartworks' && github.actor == 'hurtener' && github.ref == 'refs/heads/codex/sql-semantic-context-recovery'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verify and publish exact source checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 68a28b26b7dc0b8e58c14cc1d1f9c65bae826840
          python3 - <<'PY'
          from pathlib import Path
          import gzip, hashlib, io
          data = b''.join(Path(f'scripts/sql-selection-transfer/part-{i}.gz').read_bytes() for i in range(6))
          if len(data) != 23310:
              raise SystemExit('Checkpoint size mismatch')
          with gzip.GzipFile(fileobj=io.BytesIO(data)) as stream:
              patch = stream.read(1048577)
          if len(patch) != 95351 or hashlib.sha256(patch).hexdigest() != '89874f3ac76529c93405ce497ea1dccd9828f168dc927722a73730d974854d2f':
              raise SystemExit('Checkpoint digest mismatch')
          Path('/tmp/sql-selection-checkpoint.patch').write_bytes(patch)
          PY
          git apply --check --index /tmp/sql-selection-checkpoint.patch
          git apply --index /tmp/sql-selection-checkpoint.patch
          python3 - <<'PY'
          import subprocess
          rows = subprocess.check_output(['git', 'diff', '--cached', '--raw', '-z']).decode().split('\0')
          for i in range(0, len(rows)-1, 2):
              header, path = rows[i:i+2]
              fields = header.split()
              if len(fields) != 5 or fields[1] != '100644' or fields[4] not in ('A', 'M'):
                  raise SystemExit('Unexpected checkpoint file type')
              if not path.startswith(('internal/nlqexec/', 'internal/nlqroute/', 'internal/semantics/', 'docs/', 'test/acceptance/')) and path != '.github/workflows/sql-context-recovery.yml':
                  raise SystemExit('Unexpected checkpoint path')
              if path.endswith('.go') and subprocess.check_output(['gofmt', '-l', path]).strip():
                  raise SystemExit('Unformatted checkpoint source')
          PY
          git rm -- scripts/sql-selection-transfer/part-0.gz scripts/sql-selection-transfer/part-1.gz scripts/sql-selection-transfer/part-2.gz scripts/sql-selection-transfer/part-3.gz scripts/sql-selection-transfer/part-4.gz scripts/sql-selection-transfer/part-5.gz .github/workflows/sql-selection-checkpoint.yml
          test "$(git write-tree)" = fef3ca2c21af9a16624ef01887e414092efd17f1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(nlq): share selected semantic roots across context rules and clarification'
          git push origin HEAD:refs/heads/codex/sql-semantic-context-recovery

# One exact, hash-pinned authoring checkpoint. Removes itself and its fragments
# before committing source. No tests run on a modified tree, no main writes,
# no force push and no permission or source-policy changes.
