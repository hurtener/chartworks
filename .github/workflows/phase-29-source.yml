name: Phase 29 source transfer
on:
  push:
    branches: [feat/phase-29-reports-dashboards]
    paths: [.github/workflows/phase-29-source.yml]
permissions:
  contents: read
  actions: read
jobs:
  split:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: phase-29-offline
          run-id: 34644121455
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/cw-transfer
      - name: Split the exact archive without modifying source
        run: |
          tar -cf /tmp/offline.tar -C /tmp/cw-transfer .
          split -b 350M /tmp/offline.tar /tmp/offline.part-
          sha256sum /tmp/offline.tar /tmp/offline.part-*
      - uses: actions/upload-artifact@v4
        with:
          name: phase-29-offline-aa
          path: /tmp/offline.part-aa
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: phase-29-offline-ab
          path: /tmp/offline.part-ab
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: phase-29-offline-ac
          path: /tmp/offline.part-ac
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: phase-29-offline-ad
          path: /tmp/offline.part-ad
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: phase-29-offline-ae
          path: /tmp/offline.part-ae
          compression-level: 0
          retention-days: 1
