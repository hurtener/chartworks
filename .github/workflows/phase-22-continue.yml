name: Phase 22 reviewed boundary fixes
on:
  push:
    branches: [feat/phase-22-mcp-server]
    paths: [.github/workflows/phase-22-continue.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: false
      - name: Apply reviewed edits to the pinned existing source
        run: |
          test "$(git rev-parse HEAD^)" = 88aa077819289937b21f34b962ecd24869cce37f
          python3 - <<'PY'
          from pathlib import Path
          import json
          def edit(path, old, new):
              p = Path(path)
              text = p.read_text()
              assert text.count(old) == 1, path
              p.write_text(text.replace(old, new))
          edit('test/acceptance/phase22_test.go', '\t"github.com/hurtener/chartworks/internal/auth"\n', '')
          edit('internal/mcpserver/http.go', 'r.Header.Get("Content-Encoding") != ""', 'len(r.Header.Values("Content-Encoding")) > 0')
          edit('internal/mcpserver/http.go', 'func accepted(values []string) bool {', '''const maxAcceptBytes = 1024

          func accepted(values []string) bool {
              size := 0
              for _, value := range values {
                  size += len(value)
                  if size > maxAcceptBytes {
                      return false
                  }
              }''')
          edit('internal/mcpserver/http_registry.go', 'Min: 1, Max: 1024, Description: "Must accept', 'Min: 1, Max: maxAcceptBytes, Description: "Must accept')
          edit('internal/mcpserver/adversarial_test.go', '\t\t{"compression", readRPC,', '''        {"empty encoding", readRPC, func(r *http.Request) { r.Header.Set("Content-Encoding", "") }, 400},
                  {"duplicate encoding", readRPC, func(r *http.Request) { r.Header.Set("Content-Encoding", ""); r.Header.Add("Content-Encoding", "gzip") }, 400},
                  {"oversized accept", readRPC, func(r *http.Request) {
                      r.Header.Set("Accept", "application/json; x="+strings.Repeat("x", 1024)+", text/event-stream")
                  }, 400},
                  {"aggregate accept size", readRPC, func(r *http.Request) {
                      r.Header.Set("Accept", "application/json; x="+strings.Repeat("x", 600))
                      r.Header.Add("Accept", "text/event-stream; x="+strings.Repeat("x", 600))
                  }, 400},
                  {"compression", readRPC,''')
          edit('internal/sourceapi/registry.go', 'sole inventory for the seven existing source routes', 'sole inventory for the nine source and dataset routes')
          edit('internal/sourceapi/registry_test.go', '{{false, false, 2}, {false, true, 2}, {true, false, 6}, {true, true, 7}}', '{{false, false, 4}, {false, true, 4}, {true, false, 8}, {true, true, 9}}')
          edit('internal/sourceapi/registry_test.go', 'samples := map[string]string{', 'samples := map[string]string{\n\t\t"listDatasets": `{"source":"source1","context":"source1:v1","after":"","limit":32}`,\n\t\t"describeDataset": `{"source":"source1","context":"source1:v1","dataset":"sales"}`,')
          edit('internal/topicapi/http_test.go', 'len(r.Definitions()) != 31', 'len(r.Definitions()) != 32')
          p = Path('docs/contracts/chartworks-source-operations.json')
          rows = json.loads(p.read_text())
          rows[:0] = [{'method':'POST','path':'/v1/datasets/list','action':'sources.read','effect':'retained_metadata_read'}, {'method':'POST','path':'/v1/datasets/describe','action':'sources.read','effect':'retained_metadata_read'}]
          p.write_text(json.dumps(rows, indent=2)+'\n')
          p = Path('docs/contracts/chartworks-topic-draft-operations.json')
          rows = json.loads(p.read_text())
          rows.append({'method':'POST','path':'/v1/topics/list','action':'topics.read','effect':'retained_metadata_read'})
          p.write_text(json.dumps(rows, indent=2)+'\n')
          edit('docs/contracts/chartworks-nlq-execution-operations.json', 'nlq_preflight_metadata', 'nlq_routing_and_preflight_commit')
          PY
          gofmt -w internal/mcpserver/http.go internal/mcpserver/http_registry.go internal/mcpserver/adversarial_test.go internal/sourceapi/registry.go internal/sourceapi/registry_test.go internal/topicapi/http_test.go test/acceptance/phase22_test.go
          rm .github/workflows/phase-22-continue.yml
          git add --all
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(mcp): enforce header bounds and cumulative discovery contracts'
          git push origin HEAD:feat/phase-22-mcp-server
