name: SQL fence review source objects
on:
  push:
    branches: [codex/sql-semantic-context-recovery]
    paths: [.github/workflows/sql-fence-review-authoring.yml]
permissions:
  contents: write
jobs:
  source:
    if: github.repository == 'hurtener/chartworks'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Run pinned source preparation with exact formatting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import subprocess,textwrap
          pinned=subprocess.check_output(['git','show','2c922f23788f3baef842f839a5521b024f18be0e:.github/workflows/sql-fence-review-authoring.yml'],text=True)
          code=textwrap.dedent(pinned.split("          python - <<'PY'\n",1)[1].split('          PY\n',1)[0])
          old="assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()==baseline\n"
          assert code.count(old)==1
          code=code.replace(old,'',1)
          old='  "testing"\n  readexec '
          assert code.count(old)==1
          code=code.replace(old,'  "testing"\n\n  readexec ',1)
          exec(compile(code,'pinned-reviewed-preparation','exec'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sql-fence-review-source-objects
          path: /tmp/source-manifest.json
          retention-days: 7
