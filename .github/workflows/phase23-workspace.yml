name: Phase 23 source authoring
on:
  push:
    branches: [dev/phase-23-workspace]
    paths: [.github/workflows/phase23-workspace.yml]
permissions:
  contents: write
jobs:
  author:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-23-sdk-cli-parity
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: false
      - name: Apply authoring edits to committed source; no verification in this write job
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 5445eb69138072759e89885e65ff7ffc40985186
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          def edit(path, old, new):
              p = Path(path)
              text = p.read_text()
              assert text.count(old) == 1, (path, old, text.count(old))
              p.write_text(text.replace(old, new))
          edit('internal/clientcli/command_test.go', '\n\t"time"', '')
          edit('test/acceptance/phase23_fixture_test.go', '''case "feedbackNLQ":
          		return phase23Encode(ctx,options.Body,func(ctx context.Context,input cw.FeedbackRequest)(nlqapi.FeedbackResult,error){
          			accepted,err:=client.FeedbackNLQ(ctx,input);return nlqapi.FeedbackResult{Accepted:accepted},err
          		})''', '''case "feedbackNLQ":return phase23Encode(ctx,options.Body,client.FeedbackNLQ)''')
          paths = subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=AM', 'd6dbd31899449f6e042b4ab069c9c30c01fb844b'], text=True).splitlines()
          paths = [p for p in paths if p.endswith('.go')]
          subprocess.run(['gofmt', '-w', *paths], check=True)
          PY
          git diff --check
          git fetch origin feat/phase-23-sdk-cli-parity
          test "$(git rev-parse FETCH_HEAD)" = 5445eb69138072759e89885e65ff7ffc40985186
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sdk/chartworks internal/clientcli internal/foundation cmd/chartworks test/acceptance
          git commit -m 'test(clients): align typed feedback adapter and format acceptance fixtures'
          git push origin HEAD:refs/heads/feat/phase-23-sdk-cli-parity
          git rev-parse HEAD
