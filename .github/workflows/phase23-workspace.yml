name: Phase 23 development source
on:
  push:
    branches: [dev/phase-23-workspace]
    paths: [.github/workflows/phase23-workspace.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d6dbd31899449f6e042b4ab069c9c30c01fb844b
          fetch-depth: 0
          persist-credentials: false
      - run: |
          git bundle create /tmp/chartworks.bundle HEAD refs/remotes/origin/main
          git rev-parse HEAD > /tmp/source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: phase23-source
          path: |
            /tmp/chartworks.bundle
            /tmp/source-sha.txt
          retention-days: 3
