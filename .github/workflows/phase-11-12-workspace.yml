name: Phase 11–12 isolated development workspace
on:
  push:
    branches: [feat/phase-11-12-uploads-profiling]
    paths: [.github/workflows/phase-11-12-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - name: Package committed source and public development tools only
        run: |
          set -euo pipefail
          mkdir -p /tmp/workspace /tmp/pgroot/usr/lib /tmp/pgroot/usr/share
          git bundle create /tmp/workspace/source.bundle --all
          go mod download
          mkdir -p /tmp/parser-deps
          (cd /tmp/parser-deps && go mod init workspace.invalid/parser-deps && go get github.com/parquet-go/parquet-go@v0.32.0 && go mod download all)
          tar -czf /tmp/workspace/go.tar.gz -C "$(go env GOROOT)" .
          tar -czf /tmp/workspace/modules.tar.gz -C "$(go env GOPATH)/pkg" mod
          curl --fail --location --silent --show-error https://github.com/golangci/golangci-lint/releases/download/v2.12.2/golangci-lint-2.12.2-linux-amd64.tar.gz -o /tmp/workspace/lint.tar.gz
          docker pull pgvector/pgvector:0.8.2-pg17
          cid=$(docker create pgvector/pgvector:0.8.2-pg17)
          trap 'docker rm -f "$cid" >/dev/null' EXIT
          docker cp "$cid:/usr/lib/postgresql" /tmp/pgroot/usr/lib/
          docker cp "$cid:/usr/share/postgresql" /tmp/pgroot/usr/share/
          docker cp "$cid:/usr/lib/x86_64-linux-gnu" /tmp/pgroot/usr/lib/
          tar -czf /tmp/workspace/postgres.tar.gz -C /tmp/pgroot .
          (cd /tmp/workspace && sha256sum *.gz source.bundle > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: phase-11-12-workspace
          path: /tmp/workspace
          retention-days: 1
          if-no-files-found: error
