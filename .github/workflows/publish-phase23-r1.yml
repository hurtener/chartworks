name: Publish exact phase 23 source
on:
  push:
    branches: [dev/phase-23-workspace]
    paths: [.github/workflows/publish-phase23-r1.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode and verify isolated transfer
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          expected = [
            '7dcc349c4385cd8d40d59cf742eeab221a2fc3d2',
            'b13894b25976009b89c8e262998e0fd2b3b8e511',
            '729525dc6d95d85389cb684a20e0e72ba3663753',
            'df9ec85105b63ecc5914e3ab163cdb64ba03cd31',
            '162e505f0263da318432dac19b3834a4cac6a461',
            '184b10424e7b5fde1f838b4917373f272e5a0da3',
          ]
          parts = []
          failures = []
          for i, want in enumerate(expected):
              data = Path(f'.github/phase23-publish-{i:02d}.b64').read_bytes()
              Path(f'/tmp/transferred-{i}.b64').write_bytes(data)
              # Correct a known extra character in the text transfer only.
              # The complete chunk, decoded patch and staged tree are verified
              # against locally computed hashes before any source is committed.
              if i == 2:
                  data = data.replace(b'o9zVO89Lxs7', b'o9zVO89xs7')
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              print('chunk', i, actual, 'expected', want)
              if actual != want:
                  failures.append(i)
              parts.append(data)
          assert not failures, f'transfer differs in chunks {failures}; source was not changed'
          patch = gzip.decompress(base64.b64decode(b''.join(parts), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '6041843eafdded290d56d50bd9370f56ef8e02bc6f2daa2d8bd7d5afc92bf1da'
          Path('/tmp/phase23.patch').write_bytes(patch)
          PY
      - name: Commit exactly the verified source without helper files
        run: |
          git checkout --detach 51758889692a4983cfe50387667da8a2b4193dcd
          git apply --index /tmp/phase23.patch
          test "$(git write-tree)" = 67aab2e1a7514f757c969eb1747d461eab557701
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(clients): finish phase 23 with canonical mounts and adversarial parity'
          git push origin HEAD:refs/heads/dev/phase23-publication-r1
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - name: Retain transfer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase23-transfer-diagnostics
          path: /tmp/transferred-*.b64
          retention-days: 1
