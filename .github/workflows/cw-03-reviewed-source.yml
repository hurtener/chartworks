name: CW-03 reviewed source commit
on:
  push:
    branches: [feat/cw-03-reporting-output-policies]
    paths: [.github/workflows/cw-03-reviewed-source.yml]
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'hurtener/chartworks' && github.ref == 'refs/heads/feat/cw-03-reporting-output-policies'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact reviewed source and unchanged base
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 5c2c924473f991c41864772c02a58fb4624c569b
          git diff --exit-code be067c90a71057b926675400e5416f1da06e7299 HEAD -- internal sdk test web docs
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma
          parts = [Path(f'.cw03-reviewed/part{i}.txt').read_text().strip() for i in (1, 2)]
          assert [len(part) for part in parts] == [10424, 10424]
          patch = lzma.decompress(base64.b64decode(''.join(parts), validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'bb82550c60661e9d954bbbb96974ddf318ee24a16008ef96bf73b21054b2b065'
          Path('/tmp/cw03-reviewed.patch').write_bytes(patch)
          print('Verified reviewed source patch; no runtime-generated changes')
          PY
          git apply --check --index /tmp/cw03-reviewed.patch
      - name: Commit reviewed product changes on scoped branch
        run: |
          set -euo pipefail
          git apply --index /tmp/cw03-reviewed.patch
          git rm -r .cw03-reviewed
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(reporting): enforce narrative policies and preserve accepted viewer limits'
          git push origin HEAD:refs/heads/feat/cw-03-reporting-output-policies
          git rev-parse HEAD
      - name: Retain exact source for validation
        run: |
          mkdir -p /tmp/cw03-source
          git rev-parse HEAD > /tmp/cw03-source/COMMIT
          git archive --format=tar.gz --prefix=chartworks/ HEAD > /tmp/cw03-source/source.tar.gz
          cd /tmp/cw03-source
          sha256sum source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: cw-03-reviewed-source
          path: /tmp/cw03-source/
          retention-days: 1
          if-no-files-found: error
