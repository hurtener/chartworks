                  n, hit = int(statements), int(hits) > 0
                  if coordinates in result:
                      assert result[coordinates][0] == n
                      hit = hit or result[coordinates][1]
                  result[coordinates] = (n, hit)
              return result
          baseline, added = read(baseline_path), read(added_path)
          old = sum(n for n,hit in baseline.values() if hit)
          total = sum(n for n,hit in baseline.values())
          assert (old,total) == (4449,5412), (old,total)
          assert added.keys() == baseline.keys(), 'Coverage must address identical production source'
          merged = {}
          for key,(n,hit) in baseline.items():
              assert added[key][0] == n, key
              merged[key] = (n, hit or added[key][1])
          covered = sum(n for n,hit in merged.values() if hit)
          summary = {'baseline_covered':old,'covered':covered,'total':total,'newly_covered':covered-old,'percent':100*covered/total,'required_percent':84,'measurement':'unchanged-production CI baseline OR passing new race-instrumented regression profile; not a rerun of the entire CI matrix'}
          Path('/tmp/pr19-store-coverage-summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          Path('/tmp/pr19-combined-store-coverage.out').write_text('mode: atomic\n'+''.join(f'{key} {n} {int(hit)}\n' for key,(n,hit) in sorted(merged.items())))
          print(json.dumps(summary,indent=2))
          assert covered*100 >= 84*total, 'Existing 84% gate remains unmet; do not publish'
          PY
      - name: Repeat the new regressions before publication
        run: go test -race -count=2 -timeout=15m ./test/acceptance -run '^TestStoreCoverage'
      - name: Publish test-only changes with a guarded ordinary fast-forward
        run: |
          git fetch origin "$FEATURE_BRANCH"
          test "$(git rev-parse "refs/remotes/origin/$FEATURE_BRANCH")" = "$EXPECTED_SOURCE"
          git diff --exit-code HEAD -- internal cmd sdk scripts .github go.mod go.sum
          test "$(git diff --cached --name-only)" = test/acceptance/postgres_coverage_regressions_test.go
          git diff --check
          git config user.name chartworks-development-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(postgres): cover transactional rollback and in-process rejection boundaries'
          git push origin "HEAD:$FEATURE_BRANCH"
          echo "PUBLISHED_TEST_COMMIT=$(git rev-parse HEAD)" | tee /tmp/pr19-published-test-commit.txt
      - name: Preserve complete source and actual verification evidence
        if: always()
        run: |
          mkdir -p /tmp/pr19-store-evidence
          if test -d .git; then
            git rev-parse HEAD > /tmp/pr19-store-evidence/head.txt
            git diff --binary "$EXPECTED_SOURCE" -- test/acceptance/postgres_coverage_regressions_test.go > /tmp/pr19-store-evidence/coverage-tests.patch
            if test -f test/acceptance/postgres_coverage_regressions_test.go; then cp test/acceptance/postgres_coverage_regressions_test.go /tmp/pr19-store-evidence/; fi
          fi
          for file in /tmp/pr19-store-regressions.log /tmp/pr19-new-store-coverage.out /tmp/pr19-combined-store-coverage.out /tmp/pr19-store-coverage-summary.json /tmp/pr19-published-test-commit.txt; do
            if test -f "$file"; then cp "$file" /tmp/pr19-store-evidence/; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr19-postgres-coverage-regressions
          path: /tmp/pr19-store-evidence
          retention-days: 14
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.cache/go-build
          key: cw-phase-26-28-build-${{ github.run_id }}
