name: PR19 PostgreSQL coverage regressions
on:
  push:
    branches: [dev/phase-26-28-workspace]
    paths: [.github/workflows/pr19-postgres-coverage-regressions.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: pr19-postgres-coverage-regressions
  cancel-in-progress: false
jobs:
  regressions:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        ports: [5434:5432]
        env:
          POSTGRES_USER: chartworks
          POSTGRES_PASSWORD: chartworks
          POSTGRES_DB: chartworks
        options: >-
          --health-cmd "pg_isready -U chartworks -d chartworks"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      EXPECTED_SOURCE: e42ae65759091dfef6ce42e91eed6813316018dd
      FEATURE_BRANCH: dev/phase-26-28-runtime-completion
      CGO_ENABLED: '1'
      GOFLAGS: -mod=readonly -p=2
      GOMAXPROCS: '2'
      GOMEMLIMIT: 2GiB
      CHARTWORKS_TEST_STORE_URL: postgres://chartworks:chartworks@localhost:5434/chartworks?sslmode=disable
      CHARTWORKS_TEST_PIPELINE_TMPDIR: /mnt/chartworks-coverage-pipeline
      CHARTWORKS_TEST_PIPELINE_TLS_ROOT: /tmp/chartworks-coverage-tls/server.crt
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e42ae65759091dfef6ce42e91eed6813316018dd
          fetch-depth: 0
      - name: Guard the existing PR head
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test "$(git rev-parse "refs/remotes/origin/$FEATURE_BRANCH")" = "$EXPECTED_SOURCE"
          test -z "$(git status --porcelain)"
          test ! -e test/acceptance/postgres_coverage_regressions_test.go
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/go-build
          key: cw-phase-26-28-build-${{ github.run_id }}
          restore-keys: cw-phase-26-28-build-
      - uses: actions/download-artifact@v4
        with:
          name: phase-26-28-native
          run-id: 34441124485
          github-token: ${{ github.token }}
          path: /tmp/coverage-native-export
      - uses: actions/download-artifact@v4
        with:
          name: race-coverage
          run-id: 34555245117
          github-token: ${{ github.token }}
          path: /tmp/coverage-baseline
      - name: Restore pinned native dependencies
        run: |
          mkdir -p /tmp/coverage-native
          tar -xzf /tmp/coverage-native-export/native.tar.gz -C /tmp/coverage-native
          parser=$(find /tmp/coverage-native -type f -name libbruin_rustsqlparser.a -print -quit)
          runner=$(find /tmp/coverage-native -type f -name bruin -print -quit)
          test -s "$parser"
          test -x "$runner"
          echo "CGO_LDFLAGS=-L$(dirname "$parser")" >> "$GITHUB_ENV"
          echo "CHARTWORKS_TEST_BRUIN_PATH=$runner" >> "$GITHUB_ENV"
      - name: Prepare isolated native execution and PostgreSQL TLS
        run: |
          sudo install -d -m 0700 "$CHARTWORKS_TEST_PIPELINE_TMPDIR"
          sudo mount -t tmpfs -o size=2G,exec,nosuid,nodev tmpfs "$CHARTWORKS_TEST_PIPELINE_TMPDIR"
          sudo chown "$(id -u):$(id -g)" "$CHARTWORKS_TEST_PIPELINE_TMPDIR"
          install -d -m 0700 /tmp/chartworks-coverage-tls
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost' -keyout /tmp/chartworks-coverage-tls/server.key -out "$CHARTWORKS_TEST_PIPELINE_TLS_ROOT"
          chmod 0600 /tmp/chartworks-coverage-tls/server.key "$CHARTWORKS_TEST_PIPELINE_TLS_ROOT"
          pg_container=$(docker ps --filter ancestor=pgvector/pgvector:0.8.2-pg17 --format '{{.ID}}')
          test -n "$pg_container"
          docker cp /tmp/chartworks-coverage-tls/server.key "$pg_container":/tmp/chartworks-server.key
          docker cp "$CHARTWORKS_TEST_PIPELINE_TLS_ROOT" "$pg_container":/tmp/chartworks-server.crt
          docker exec -u root "$pg_container" chown postgres:postgres /tmp/chartworks-server.key /tmp/chartworks-server.crt
          docker exec -u root "$pg_container" chmod 0600 /tmp/chartworks-server.key /tmp/chartworks-server.crt
          psql "$CHARTWORKS_TEST_STORE_URL" -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET ssl='on'" -c "ALTER SYSTEM SET ssl_cert_file='/tmp/chartworks-server.crt'" -c "ALTER SYSTEM SET ssl_key_file='/tmp/chartworks-server.key'" -c 'SELECT pg_reload_conf()'
      - name: Add real-store regression tests only
        run: |
          cat > test/acceptance/postgres_coverage_regressions_test.go <<'GO'
          package acceptance

          import (
           "context"
           "errors"
           "fmt"
           "strings"
           "testing"
           "time"

           "github.com/hurtener/chartworks/internal/access"
           "github.com/hurtener/chartworks/internal/auth"
           "github.com/hurtener/chartworks/internal/config"
           "github.com/hurtener/chartworks/internal/engineering"
           "github.com/hurtener/chartworks/internal/identity"
           "github.com/hurtener/chartworks/internal/jobs"
           "github.com/hurtener/chartworks/internal/reporting"
           "github.com/hurtener/chartworks/internal/store"
           "github.com/hurtener/chartworks/internal/store/postgres"
           "github.com/hurtener/chartworks/test/support"
           "github.com/jackc/pgx/v5"
          )

          // The sequence survives rollback and proves that the selected real SQL
          // boundary fired. No immutable-history protection trigger is disabled.
          func coverageStoreFault(t *testing.T, raw *pgx.Conn, table, operation, condition string) func() {
           t.Helper()
           if operation!="INSERT" && operation!="UPDATE" && operation!="DELETE" { t.Fatal("invalid test fault operation") }
           ctx,cancel:=context.WithTimeout(context.Background(),10*time.Second);defer cancel()
           _,err:=raw.Exec(ctx,`CREATE SEQUENCE chartworks.test_coverage_fault_count;
          CREATE FUNCTION chartworks.test_coverage_fault() RETURNS trigger LANGUAGE plpgsql AS $$
          BEGIN
           PERFORM nextval('chartworks.test_coverage_fault_count');
           RAISE EXCEPTION 'synthetic failure: PRIVATE_FAULT_CANARY' USING ERRCODE='P0001';
          END; $$;`)
           if err!=nil {t.Fatal("install database fault",err)}
           when:="";if condition!="" {when=" WHEN ("+condition+")"}
           name:=pgx.Identifier{"chartworks",table}.Sanitize()
           // Identifiers are quoted; operation/condition are static test cases.
           _,err=raw.Exec(ctx,"CREATE TRIGGER test_coverage_fault BEFORE "+operation+" ON "+name+" FOR EACH ROW"+when+" EXECUTE FUNCTION chartworks.test_coverage_fault()")
           if err!=nil {t.Fatal("attach database fault",err)}
           removed:=false
           remove:=func(requireHit bool){
            t.Helper();if removed{return};removed=true
            cleanup,stop:=context.WithTimeout(context.Background(),10*time.Second);defer stop()
            if requireHit {
             var hit bool
             if err:=raw.QueryRow(cleanup,`SELECT is_called FROM chartworks.test_coverage_fault_count`).Scan(&hit);err!=nil||!hit {t.Errorf("fault not exercised at %s %s: hit=%v error=%v",operation,table,hit,err)}
            }
            if _,err:=raw.Exec(cleanup,"DROP TRIGGER test_coverage_fault ON "+name+`; DROP FUNCTION chartworks.test_coverage_fault(); DROP SEQUENCE chartworks.test_coverage_fault_count;`);err!=nil{t.Error("remove fault",err)}
           }
           t.Cleanup(func(){remove(false)})
           return func(){remove(true)}
          }

          // Compare complete rows, not only counts: pointers, quota reservations,
          // lifecycle state and evidence must roll back with a failed transaction.
          func coverageStoreSnapshot(t *testing.T,raw *pgx.Conn,tables ...string)string{
           t.Helper();ctx,stop:=context.WithTimeout(context.Background(),10*time.Second);defer stop()
           out:=make([]string,0,len(tables))
           for _,table:=range tables{
            var value string
            query:="SELECT COALESCE(jsonb_agg(to_jsonb(r) ORDER BY to_jsonb(r)::text),'[]'::jsonb)::text FROM "+pgx.Identifier{"chartworks",table}.Sanitize()+" r"
            if err:=raw.QueryRow(ctx,query).Scan(&value);err!=nil{t.Fatal("snapshot test table",table,err)}
            out=append(out,fmt.Sprintf("%s=%s",table,value))
           }
           return strings.Join(out,"\n")
          }

          type coverageReportingStore struct{
           f *phase17Fixture
           db *postgres.DB
           blocks *reporting.Service
           runs *reporting.Runs
           author,execute identity.Envelope
           definition reporting.Definition
           raw *pgx.Conn
          }
          func newCoverageReportingStore(t *testing.T)*coverageReportingStore{
           t.Helper();f:=newPhase18Fixture(t);query,topics:=newPhase18Service(t,f)
           blocks,err:=reporting.New(f.f.db,topics,f.f.s,f.f.validator,f.f.executor,reporting.CaptureFromQueries(query),config.DefaultReporting());if err!=nil{t.Fatal(err)}
           author:=phase27Actor(t,f,f.f.e.User(),phase27Scopes(f.f.e.Tenant()))
           d:=phase27Definition(t,f,author,"SELECT id, amount FROM analytics.sales ORDER BY id");d.Outputs=d.Outputs[:1]
           return &coverageReportingStore{f:f,db:f.f.db,blocks:blocks,runs:phase28RunService(t,f,blocks,f.f.db,nil,config.DefaultReportingExecution()),author:author,execute:phase27Actor(t,f,f.f.e.User(),phase28Scopes(f.f.e.Tenant())),definition:d,raw:support.Raw(t,f.f.dsn)}
          }
          func(f *coverageReportingStore)create(t *testing.T,id string,publish bool)reporting.View{
           t.Helper();out,err:=f.blocks.Create(context.Background(),f.author,reporting.CreateRequest{ID:id,Definition:f.definition});if err!=nil{t.Fatal(err)}
           if publish{phase27ValidatePublish(t,f.blocks,f.author,out)};return out
          }
          func(f *coverageReportingStore)admit(t *testing.T,s *reporting.Runs,block,key string,reuse int)reporting.RunView{
           t.Helper();out,err:=s.Admit(context.Background(),f.execute,block,reporting.RunRequest{Key:key,ReuseMaxAgeSeconds:reuse});if err!=nil{t.Fatal("admit test run",err)};return out
          }
          func(f *coverageReportingStore)blockSnapshot(t *testing.T)string{
           t.Helper();return coverageStoreSnapshot(t,f.raw,"block_heads","block_revisions","block_revision_references","block_topic_pins","block_source_pins","block_validations","block_publications","block_attestations","block_withdrawals","block_health","block_events")
          }
          func(f *coverageReportingStore)frozenSnapshot(t *testing.T)string{
           t.Helper();return coverageStoreSnapshot(t,f.raw,"frozen_runs","frozen_run_payloads","frozen_run_outputs","frozen_run_attempts")
          }

          func TestStoreCoverageBlockPublicationRollback(t *testing.T){
           f:=newCoverageReportingStore(t);ctx:=context.Background()
           for _,table:=range []string{"block_heads","block_revisions","block_revision_references","block_topic_pins","block_source_pins","block_events","audit_events"}{
            t.Run("create/"+table,func(t *testing.T){
             before:=f.blockSnapshot(t);remove:=coverageStoreFault(t,f.raw,table,"INSERT","")
             out,err:=f.blocks.Create(ctx,f.author,reporting.CreateRequest{ID:"coverage-create-rollback",Definition:f.definition});remove()
             if !errors.Is(err,store.ErrUnavailable)||out.State.ID!=""||f.blockSnapshot(t)!=before{t.Fatal("failed creation changed domain state",err)}
            })
           }
           created:=f.create(t,"coverage-lifecycle-rollback",false)
           for _,table:=range []string{"block_validations","block_health","block_events","audit_events"}{
            t.Run("validate/"+table,func(t *testing.T){
             before:=f.blockSnapshot(t);condition:="";if table=="audit_events"{condition="NEW.action='block.validated'"}
             remove:=coverageStoreFault(t,f.raw,table,"INSERT",condition)
             _,err:=f.blocks.Validate(ctx,f.author,created.State.ID,reporting.ValidateRequest{ExpectedVersion:created.State.Version});remove()
             if !errors.Is(err,store.ErrUnavailable)||f.blockSnapshot(t)!=before{t.Fatal("validation checkpoint partially committed",err)}
            })
           }
           validated,err:=f.blocks.Validate(ctx,f.author,created.State.ID,reporting.ValidateRequest{ExpectedVersion:created.State.Version});if err!=nil{t.Fatal(err)}
           for _,tc:=range []struct{table,operation string}{{"block_publications","INSERT"},{"block_heads","UPDATE"},{"block_events","INSERT"},{"audit_events","INSERT"}}{
            t.Run("publish/"+tc.table,func(t *testing.T){
             before:=f.blockSnapshot(t);remove:=coverageStoreFault(t,f.raw,tc.table,tc.operation,"")
             _,err:=f.blocks.Publish(ctx,f.author,created.State.ID,reporting.PublishRequest{ExpectedVersion:validated.State.Version,Evidence:validated.Evidence.ID});remove()
             if !errors.Is(err,store.ErrUnavailable)||f.blockSnapshot(t)!=before{t.Fatal("failed publication changed pointer or history",err)}
            })
           }
           state,err:=f.blocks.Publish(ctx,f.author,created.State.ID,reporting.PublishRequest{ExpectedVersion:validated.State.Version,Evidence:validated.Evidence.ID});if err!=nil{t.Fatal(err)}
           for _,table:=range []string{"block_attestations","block_events","audit_events"}{
            t.Run("certify/"+table,func(t *testing.T){
             before:=f.blockSnapshot(t);remove:=coverageStoreFault(t,f.raw,table,"INSERT","")
             _,err:=f.blocks.Certify(ctx,f.author,state.ID,reporting.CertifyRequest{ExpectedVersion:state.Version,Revision:state.PublishedRevision,Evidence:validated.Evidence.ID,Note:"Synthetic reviewed evidence"});remove()
             if !errors.Is(err,store.ErrUnavailable)||f.blockSnapshot(t)!=before{t.Fatal("failed certification changed approval",err)}
            })
           }
          }

          type coverageFrozenHooks struct{
           reporting.RunRepository
           seal func(context.Context,identity.Envelope,jobs.RequestTask,reporting.PreparedRun)(reporting.RunRecord,error)
           checkpoint func(context.Context,jobs.Invocation,reporting.PreparedRunWrite)(reporting.RunRecord,error)
           reuse func(context.Context,jobs.Invocation,string)(reporting.RunRecord,bool,error)
          }
          func(r *coverageFrozenHooks)SealFrozenRun(ctx context.Context,e identity.Envelope,task jobs.RequestTask,p reporting.PreparedRun)(reporting.RunRecord,error){
           if r.seal!=nil{return r.seal(ctx,e,task,p)};return r.RunRepository.SealFrozenRun(ctx,e,task,p)
          }
          func(r *coverageFrozenHooks)CheckpointFrozenRun(ctx context.Context,inv jobs.Invocation,p reporting.PreparedRunWrite)(reporting.RunRecord,error){
           if r.checkpoint!=nil{return r.checkpoint(ctx,inv,p)};return r.RunRepository.CheckpointFrozenRun(ctx,inv,p)
          }
          func(r *coverageFrozenHooks)ReuseFrozenRun(ctx context.Context,inv jobs.Invocation,id string)(reporting.RunRecord,bool,error){
           if r.reuse!=nil{return r.reuse(ctx,inv,id)};return r.RunRepository.ReuseFrozenRun(ctx,inv,id)
          }

          func TestStoreCoverageFrozenCheckpointRollback(t *testing.T){
           f:=newCoverageReportingStore(t);block:=f.create(t,"coverage-frozen-rollback",true);ctx:=context.Background()
           for _,table:=range []string{"frozen_runs","frozen_run_payloads","audit_events"}{
            t.Run("seal/"+table,func(t *testing.T){
             before:=f.frozenSnapshot(t);r:=&coverageFrozenHooks{RunRepository:f.db}
             r.seal=func(ctx context.Context,e identity.Envelope,task jobs.RequestTask,p reporting.PreparedRun)(reporting.RunRecord,error){
              remove:=coverageStoreFault(t,f.raw,table,"INSERT","");out,err:=f.db.SealFrozenRun(ctx,e,task,p);remove();return out,err
             }
             s:=phase28RunService(t,f.f,f.blocks,r,nil,config.DefaultReportingExecution())
             _,err:=s.Admit(ctx,f.execute,block.State.ID,reporting.RunRequest{Key:"coverage-seal-"+table})
             if !errors.Is(err,store.ErrUnavailable)||f.frozenSnapshot(t)!=before{t.Fatal("seal leaked manifest or quota",err)}
            })
           }
           for index,tc:=range []struct{kind,table,operation,condition string}{
            {"attempt","frozen_run_attempts","INSERT",""},
            {"result","frozen_runs","UPDATE",""},
            {"result","frozen_run_payloads","UPDATE",""},
            {"result","audit_events","INSERT","NEW.action='reporting.query_checkpoint'"},
            {"output","frozen_run_outputs","INSERT",""},
            {"output","audit_events","INSERT","NEW.action='reporting.output_checkpoint'"},
            {"complete","frozen_runs","UPDATE","NEW.state='succeeded'"},
            {"complete","operations","UPDATE","NEW.status='succeeded'"},
            {"complete","audit_events","INSERT","NEW.action='reporting.run_completed'"},
           }{
            t.Run(tc.kind+"/"+tc.table,func(t *testing.T){
             called:=false;r:=&coverageFrozenHooks{RunRepository:f.db}
             r.checkpoint=func(ctx context.Context,inv jobs.Invocation,p reporting.PreparedRunWrite)(reporting.RunRecord,error){
              w,err:=p.Checked(inv);if err!=nil{return reporting.RunRecord{},err}
              if called||w.Kind!=tc.kind{return f.db.CheckpointFrozenRun(ctx,inv,p)}
              called=true;before:=f.frozenSnapshot(t);remove:=coverageStoreFault(t,f.raw,tc.table,tc.operation,tc.condition)
              out,err:=f.db.CheckpointFrozenRun(ctx,inv,p);remove()
              if f.frozenSnapshot(t)!=before{t.Error("failed checkpoint changed values, usage or completion")};return out,err
             }
             s:=phase28RunService(t,f.f,f.blocks,r,nil,config.DefaultReportingExecution())
             v:=f.admit(t,s,block.State.ID,fmt.Sprintf("coverage-checkpoint-%d",index),0)
             out,err:=s.Run(ctx,f.execute,v.ID,false)
             if !called||!errors.Is(err,store.ErrUnavailable)||out.State=="succeeded"{t.Fatal("checkpoint fault not exercised or falsely completed",called,out.State,err)}
             if tc.kind=="output"||tc.kind=="complete"{
              resumed,err:=f.runs.Run(ctx,f.execute,v.ID,true)
              if err!=nil||resumed.State!="succeeded"||len(resumed.QueryAttempts)!=1{t.Fatal("resume repeated or lost retained source query",resumed.State,err)}
             }
            })
           }
          }

          func TestStoreCoverageFrozenReuseRollback(t *testing.T){
           f:=newCoverageReportingStore(t);block:=f.create(t,"coverage-reuse-rollback",true);ctx:=context.Background()
           v:=f.admit(t,f.runs,block.State.ID,"coverage-reuse-original",0);if _,err:=f.runs.Run(ctx,f.execute,v.ID,false);err!=nil{t.Fatal(err)}
           for index,tc:=range []struct{table,operation,condition string}{
            {"frozen_runs","UPDATE","NEW.retained_bytes<>OLD.retained_bytes"},
            {"frozen_run_payloads","UPDATE",""},{"frozen_run_outputs","INSERT",""},
            {"frozen_runs","UPDATE","NEW.state='succeeded'"},
            {"operations","UPDATE","NEW.status='succeeded'"},
            {"audit_events","INSERT","NEW.action='reporting.run_reused'"},
           }{
            t.Run(fmt.Sprintf("%d-%s",index,tc.table),func(t *testing.T){
             called:=false;r:=&coverageFrozenHooks{RunRepository:f.db}
             r.reuse=func(ctx context.Context,inv jobs.Invocation,id string)(reporting.RunRecord,bool,error){
              called=true;before:=f.frozenSnapshot(t);remove:=coverageStoreFault(t,f.raw,tc.table,tc.operation,tc.condition)
              out,reused,err:=f.db.ReuseFrozenRun(ctx,inv,id);remove()
              if reused||f.frozenSnapshot(t)!=before{t.Error("failed reuse committed a partial clone")};return out,reused,err
             }
             s:=phase28RunService(t,f.f,f.blocks,r,nil,config.DefaultReportingExecution())
             v:=f.admit(t,s,block.State.ID,fmt.Sprintf("coverage-reuse-%d",index),3600)
             _,err:=s.Run(ctx,f.execute,v.ID,false)
             if !called||!errors.Is(err,store.ErrUnavailable){t.Fatal("reuse fault not observed",called,err)}
             resumed,err:=f.runs.Run(ctx,f.execute,v.ID,true)
             if err!=nil||resumed.State!="succeeded"||len(resumed.QueryAttempts)!=0||resumed.ReusedFrom==""{t.Fatal("reuse recovery executed a new query",resumed.State,err)}
            })
           }
          }

          func TestStoreCoverageFrozenRetentionRollback(t *testing.T){
           f:=newCoverageReportingStore(t);ctx:=context.Background();block:=f.create(t,"coverage-retention-rollback",true)
           run:=f.admit(t,f.runs,block.State.ID,"coverage-retention-key",0)
           if _,err:=f.runs.Run(ctx,f.execute,run.ID,false);err!=nil{t.Fatal(err)}
           // Move this disposable fixture's payload clock without changing the
           // immutable manifest or disabling the terminal-row protection trigger.
           if _,err:=f.raw.Exec(ctx,`UPDATE chartworks.frozen_runs SET payload_expires_at=created_at+interval '1 microsecond' WHERE tenant_id=$1 AND operation_id=$2`,f.execute.Tenant(),run.ID);err!=nil{t.Fatal(err)}
           for _,tc:=range []struct{table,operation string}{{"frozen_run_outputs","DELETE"},{"frozen_run_payloads","DELETE"},{"frozen_runs","UPDATE"},{"audit_events","INSERT"}}{
            t.Run(tc.table,func(t *testing.T){
             before:=f.frozenSnapshot(t);remove:=coverageStoreFault(t,f.raw,tc.table,tc.operation,"")
             count,err:=f.db.ExpireFrozenArtifacts(ctx,f.execute,100);remove()
             if !errors.Is(err,store.ErrUnavailable)||count!=0||f.frozenSnapshot(t)!=before{t.Fatal("retention partially erased an artifact",count,err)}
            })
           }
           count,err:=f.db.ExpireFrozenArtifacts(ctx,f.execute,100);if err!=nil||count!=1{t.Fatal("retention after rollback",count,err)}
           tombstone,err:=f.runs.Get(ctx,f.execute,run.ID)
           if err!=nil||tombstone.State!="expired"||tombstone.RetainedBytes!=0{t.Fatal("retention tombstone",tombstone.State,err)}
           before:=f.f.f.lookups.Load()
           if _,err=f.runs.Rows(ctx,f.execute,run.ID,0,1);!errors.Is(err,reporting.ErrExpired){t.Fatal("expired values remained readable",err)}
           replay:=f.admit(t,f.runs,block.State.ID,"coverage-retention-key",0)
           if replay.ID!=run.ID||replay.State!="expired"||f.f.f.lookups.Load()!=before{t.Fatal("retention replay silently issued another query")}
          }

          type coverageProposalHooks struct{
           engineering.AutopilotRepository
           save func(context.Context,identity.Envelope,engineering.PreparedProposal,int64,int)(engineering.AutopilotProposal,error)
           stage func(context.Context,identity.Envelope,engineering.PreparedProposalApply,string)(engineering.AutopilotProposal,error)
           run func(context.Context,identity.Envelope,engineering.PreparedProposalApply,engineering.PipelineRun)(engineering.AutopilotProposal,error)
           compensate func(context.Context,identity.Envelope,engineering.PreparedProposalApply,engineering.PipelineExecution)(engineering.AutopilotProposal,error)
          }
          func(r *coverageProposalHooks)SaveAutopilotProposal(ctx context.Context,e identity.Envelope,p engineering.PreparedProposal,v int64,max int)(engineering.AutopilotProposal,error){
           if r.save!=nil{return r.save(ctx,e,p,v,max)};return r.AutopilotRepository.SaveAutopilotProposal(ctx,e,p,v,max)
          }
          func(r *coverageProposalHooks)StageAutopilotPipeline(ctx context.Context,e identity.Envelope,p engineering.PreparedProposalApply,stage string)(engineering.AutopilotProposal,error){
           if r.stage!=nil{return r.stage(ctx,e,p,stage)};return r.AutopilotRepository.StageAutopilotPipeline(ctx,e,p,stage)
          }
          func(r *coverageProposalHooks)RecordAutopilotRun(ctx context.Context,e identity.Envelope,p engineering.PreparedProposalApply,run engineering.PipelineRun)(engineering.AutopilotProposal,error){
           if r.run!=nil{return r.run(ctx,e,p,run)};return r.AutopilotRepository.RecordAutopilotRun(ctx,e,p,run)
          }
          func(r *coverageProposalHooks)CompensateAutopilot(ctx context.Context,e identity.Envelope,p engineering.PreparedProposalApply,x engineering.PipelineExecution)(engineering.AutopilotProposal,error){
           if r.compensate!=nil{return r.compensate(ctx,e,p,x)};return r.AutopilotRepository.CompensateAutopilot(ctx,e,p,x)
          }
          func coverageAutopilot(t *testing.T,f *phase26Fixture,repo engineering.AutopilotRepository)*engineering.Autopilot{
