name: Gateway and jobs implementation checks
on:
  push:
    branches: [feat/phase-05-06-gateway-jobs]
permissions:
  contents: read
jobs:
  sdk-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - name: Inspect the actual pinned dependency, without calling providers
        run: |
          go mod download github.com/maximhq/bifrost/core@v1.6.2
          P="$(go env GOPATH)/pkg/mod/github.com/maximhq/bifrost/core@v1.6.2"
          python3 - "$P" <<'PY'
          import pathlib, sys
          root = pathlib.Path(sys.argv[1])
          wanted = ('type NetworkConfig struct', 'type ConcurrencyAndBufferSize struct', 'type ProviderConfig struct', 'type Logger interface', 'type BifrostConfig struct', 'type RerankParameters struct', 'type ChatParameters struct', 'type BifrostCost struct', 'func (config *ProviderConfig) CheckAndSetDefaults', 'func (bifrost *Bifrost) Shutdown', 'func (b *Bifrost) Shutdown')
          for p in list((root/'schemas').glob('*.go')) + list(root.glob('*.go')):
              if p.name.endswith('_test.go'): continue
              lines = p.read_text().splitlines()
              for i, line in enumerate(lines):
                  if any(v in line for v in wanted):
                      print('\nFILE', p.relative_to(root), i+1)
                      print('\n'.join(lines[i:i+100]))
          for p in [root/'schemas/account.go', root/'bifrost.go']:
              if p.exists():
                  for i,line in enumerate(p.read_text().splitlines()):
                      if 'MaxRetries' in line or 'CheckAndSetDefaults' in line or 'Shutdown(' in line:
                          print(p.name, i+1, line)
          PY
