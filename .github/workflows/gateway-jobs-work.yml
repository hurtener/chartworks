name: Gateway and jobs implementation checks
on:
  push:
    branches: [feat/phase-05-06-gateway-jobs]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CGO_ENABLED: 1
      CHARTWORKS_TEST_STORE_URL: postgres://chartworks:chartworks@localhost:5434/chartworks?sslmode=disable
    services:
      postgres:
        image: postgres:17
        ports: [5434:5432]
        env:
          POSTGRES_USER: chartworks
          POSTGRES_PASSWORD: chartworks
          POSTGRES_DB: chartworks
        options: >-
          --health-cmd "pg_isready -U chartworks -d chartworks"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - name: Materialize explicitly reviewed branch edits
        run: |
          for f in scripts/_gateway_jobs*.py; do
            [ -f "$f" ] || continue
            python3 "$f"
            git rm "$f"
          done
          go mod tidy
          find cmd internal sdk test -name '*.go' -print0 | xargs -0 gofmt -w
          git diff --exit-code -- .github
          git add go.mod go.sum cmd internal sdk test docs examples scripts AGENTS.md CLAUDE.md GETTING-STARTED.md README.md RFC-001-Chartworks.md RFC-002-Governed-Reporting.md
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix: complete gateway and durable jobs adversarial review'
            git push origin HEAD:feat/phase-05-06-gateway-jobs
          fi
          echo "TESTED_COMMIT=$(git rev-parse HEAD)"
      - name: Public lint binary for offline local checks
        run: |
          curl -fL https://github.com/golangci/golangci-lint/releases/download/v2.12.2/golangci-lint-2.12.2-linux-amd64.tar.gz -o /tmp/golangci-lint.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: public-lint-tool
          path: /tmp/golangci-lint.tar.gz
          retention-days: 1
      - name: Lint reviewed sources
        run: |
          tar xf /tmp/golangci-lint.tar.gz -C /tmp
          /tmp/golangci-lint-2.12.2-linux-amd64/golangci-lint run
      - run: CGO_ENABLED=0 go build ./...
      - run: go vet ./...
      - run: go test -race ./... -count=1 -timeout=5m
