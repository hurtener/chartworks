name: Gateway and jobs implementation checks
on:
  push:
    branches: [feat/phase-05-06-gateway-jobs]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CGO_ENABLED: 1
      CHARTWORKS_TEST_STORE_URL: postgres://chartworks:chartworks@localhost:5434/chartworks?sslmode=disable
    services:
      postgres:
        image: postgres:17
        ports: [5434:5432]
        env:
          POSTGRES_USER: chartworks
          POSTGRES_PASSWORD: chartworks
          POSTGRES_DB: chartworks
        options: >-
          --health-cmd "pg_isready -U chartworks -d chartworks"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - name: Normalize explicit implementation changes on this branch only
        run: |
          for f in scripts/_gateway_jobs*.py; do
            [ -f "$f" ] || continue
            python3 "$f"
            git rm "$f"
          done
          go mod tidy
          find cmd internal sdk test -name '*.go' -print0 | xargs -0 gofmt -w
          git add go.mod go.sum cmd internal sdk test docs examples scripts .github/workflows/gateway-jobs-work.yml
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: normalize gateway and jobs implementation'
            git push origin HEAD:feat/phase-05-06-gateway-jobs
          fi
          echo "TESTED_COMMIT=$(git rev-parse HEAD)"
      - name: Compile the production graph
        run: go build ./...
      - name: Vet all packages
        run: go vet ./...
      - name: Present gateway and queue tests
        run: go test -race ./internal/gateway/... ./internal/jobs/... ./test/acceptance -run 'TestPhase0[56]|TestGateway|TestQueue|TestJobs|TestDispatch' -count=1
