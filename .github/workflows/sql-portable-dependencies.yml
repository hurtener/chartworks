name: SQL portable dependency snapshot

on:
  push:
    branches: [codex/sql-semantic-context-recovery]
    paths: [.github/workflows/sql-portable-dependencies.yml]

permissions:
  contents: read
  actions: read

jobs:
  snapshot:
    if: github.repository == 'hurtener/chartworks' && github.actor == 'hurtener'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 35934105012
          name: sql-portable-dependencies
          path: ${{ runner.temp }}/portable
      - name: Verify and split exact pinned modules
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/portable"
          sha256sum -c SHA256SUMS
          split -b 384m modules.tar.gz modules.part.
          sha256sum modules.part.* > PARTSUMS
          rm modules.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: sql-portable-metadata-native
          path: |
            ${{ runner.temp }}/portable/*.txt
            ${{ runner.temp }}/portable/go.mod
            ${{ runner.temp }}/portable/go.sum
            ${{ runner.temp }}/portable/SHA256SUMS
            ${{ runner.temp }}/portable/PARTSUMS
            ${{ runner.temp }}/portable/native.tar.gz
          retention-days: 2
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: sql-portable-modules-aa
          path: ${{ runner.temp }}/portable/modules.part.aa
          retention-days: 2
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: sql-portable-modules-ab
          path: ${{ runner.temp }}/portable/modules.part.ab
          retention-days: 2
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: sql-portable-modules-ac
          path: ${{ runner.temp }}/portable/modules.part.ac
          retention-days: 2
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: sql-portable-modules-ad
          path: ${{ runner.temp }}/portable/modules.part.ad
          retention-days: 2
          compression-level: 0
