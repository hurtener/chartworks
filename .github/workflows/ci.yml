name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: make check-mirror

  drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: make planning-check
      - run: make drift-audit

  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CGO_ENABLED: 0
      GOFLAGS: -p=2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - name: Record exact source and verify dependency lock
        run: |
          echo "TESTED_COMMIT=$(git rev-parse HEAD)" | tee /tmp/pr-fast-source.txt
          go mod verify
      - name: Focused deterministic unit and compile gate
        run: |
          go test -count=1 -timeout=5m \
            ./internal/config \
            ./internal/identity \
            ./internal/access \
            ./internal/calendars \
            ./internal/nlq \
            ./internal/api \
            ./internal/httpmount
          # The foundation package has mandatory real-PostgreSQL tests. Compile
          # it here; the manual final lane executes those tests with its fixture.
          go test -run '^$' ./internal/foundation
      - name: Retain exact-head fast-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-fast-source-${{ github.sha }}
          path: /tmp/pr-fast-source.txt
          retention-days: 7

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CGO_ENABLED: 0
      GOFLAGS: -p=2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Formatting and script syntax
        run: |
          test -z "$(git ls-files '*.go' | xargs gofmt -l)"
          node --check web/report-viewer/app.js
          node --check web/report-viewer/component.test.mjs
          python3 -B scripts/ci/test_renderer_source.py
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/python-cache" python3 -m compileall -q scripts
      - name: Focused static analysis
        run: >-
          go vet
          ./internal/config
          ./internal/identity
          ./internal/access
          ./internal/calendars
          ./internal/nlq
          ./internal/foundation
          ./internal/api
          ./internal/httpmount
      - name: Source remains unchanged
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

  report-app-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CGO_ENABLED: 0
      GOFLAGS: -p=2
      CHARTWORKS_CHROME_BIN: google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Verify pinned report app generated assets
        working-directory: web/report-app
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/
          npm run check
          npm run test:bundle
      - name: Record exact app source and browser
        run: |
          mkdir -p "$RUNNER_TEMP/report-app-proof"
          git rev-parse HEAD | tee "$RUNNER_TEMP/report-app-proof/source.txt"
          google-chrome --version | tee "$RUNNER_TEMP/report-app-proof/browser.txt"
      - name: Compile shared resources and run deterministic app contracts
        env:
          CHARTWORKS_REPORT_APP_HTML_OUT: ${{ runner.temp }}/report-app-proof/mcp.html
          CHARTWORKS_REPORT_APP_EMBEDDED_HTML_OUT: ${{ runner.temp }}/report-app-proof/embedded.html
        run: |
          set -o pipefail
          go test -count=1 -v ./web/report-app | tee "$RUNNER_TEMP/report-app-proof/contracts.log"
      - name: Actual Chromium MCP and registered embedded fixture journeys
        run: |
          set -o pipefail
          node web/report-app/browser.test.mjs "$RUNNER_TEMP/report-app-proof/mcp.html" "$RUNNER_TEMP/report-app-proof/mcp.png" mcp | tee "$RUNNER_TEMP/report-app-proof/mcp.log"
          node web/report-app/browser.test.mjs "$RUNNER_TEMP/report-app-proof/embedded.html" "$RUNNER_TEMP/report-app-proof/embedded.png" embedded | tee "$RUNNER_TEMP/report-app-proof/embedded.log"
      - name: Actual Chromium explicit publication in both adapters
        run: |
          set -o pipefail
          node web/report-app/publication.browser.mjs "$RUNNER_TEMP/report-app-proof/mcp.html" "$RUNNER_TEMP/report-app-proof/mcp.publication.png" mcp | tee "$RUNNER_TEMP/report-app-proof/mcp.publication.log"
          node web/report-app/publication.browser.mjs "$RUNNER_TEMP/report-app-proof/embedded.html" "$RUNNER_TEMP/report-app-proof/embedded.publication.png" embedded | tee "$RUNNER_TEMP/report-app-proof/embedded.publication.log"
      - name: Retain synthetic host proof and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-app-synthetic-browser-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/report-app-proof
          retention-days: 7
      - name: Source remains unchanged
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
