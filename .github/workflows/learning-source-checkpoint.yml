name: Learning source checkpoint
on:
  push:
    branches: [codex/sql-semantic-context-recovery]
    paths: ['.github/workflows/learning-source-checkpoint.yml', '.ci-learning-payload/**']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Verify exact patch and publish unreachable source objects only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          base='c655c8fc1c4f81b3e66f8501187b78538b49fbe5'
          expected='5654fbccf6356f2cc4524403a71a7a598e6ca559'
          raw=lzma.decompress(b''.join(pathlib.Path(f'.ci-learning-payload/part.{i}').read_bytes() for i in range(3)))
          assert len(raw)==94554
          assert hashlib.sha256(raw).hexdigest()=='4f75c57b4893d52a1292c0bfcb4fb285485394e53118161407384778a8c189dc'
          patch=pathlib.Path(os.environ['RUNNER_TEMP'])/'learning.patch'
          patch.write_bytes(raw)
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD^')==base
          subprocess.run(['git','reset','--hard',base],check=True)
          subprocess.run(['git','apply','--index','--check',str(patch)],check=True)
          subprocess.run(['git','apply','--index',str(patch)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          assert git('write-tree')==expected
          paths=git('diff','--cached','--name-only').splitlines()
          assert len(paths)==18 and not any(x.startswith('.ci-learning-payload/') for x in paths)
          gofiles=[x for x in paths if x.endswith('.go')]
          assert not subprocess.check_output(['gofmt','-l',*gofiles],text=True).strip()
          subprocess.run(['make','planning-check'],check=True)
          def post(path,data):
              req=urllib.request.Request('https://api.github.com/repos/hurtener/chartworks/'+path,data=json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
          entries=[]
          for path in paths:
              value=pathlib.Path(path).read_bytes()
              sha=post('git/blobs',{'encoding':'base64','content':base64.b64encode(value).decode()})['sha']
              assert sha==hashlib.sha1(b'blob '+str(len(value)).encode()+b'\0'+value).hexdigest()
              entries.append({'path':path,'mode':'100644','type':'blob','sha':sha})
          tree=post('git/trees',{'base_tree':'bf457f9a0d278c32d2a13aacea054bf9fd005d82','tree':entries})['sha']
          assert tree==expected
          pathlib.Path(os.environ['RUNNER_TEMP'],'learning-manifest.json').write_text(json.dumps({'base':base,'tree':tree,'entries':entries},indent=2))
          print('Prepared exact source objects; no commit/ref update performed. Tree: '+tree)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: learning-source-checkpoint-${{ github.sha }}
          path: ${{ runner.temp }}/learning-manifest.json
          if-no-files-found: error
          retention-days: 7
