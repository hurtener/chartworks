name: CW-03 final reviewed source commit
on:
  push:
    branches: [feat/cw-03-reporting-output-policies]
    paths: [.github/workflows/cw-03-final-source.yml]
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'hurtener/chartworks' && github.ref == 'refs/heads/feat/cw-03-reporting-output-policies'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact reviewed source and unchanged base
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 3774b5b1d4055ab84ef59f4e78abacc4dfb0fbf1
          git diff --exit-code 6933da6700da8cdfed3e2990b629294f46ec2731 HEAD -- internal sdk test web docs examples RFC-002-Governed-Reporting.md
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma
          parts = [Path(f'.cw03-final/part{i}.txt').read_text().strip() for i in (1, 2)]
          assert [len(part) for part in parts] == [18056, 18052]
          patch = lzma.decompress(base64.b64decode(''.join(parts), validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'ce31faeedaf689773e7b6f2d4b43b8162f908926a5cdc04a991d15ca29372c4a'
          Path('/tmp/cw03-final.patch').write_bytes(patch)
          print('Verified exact reviewed source patch')
          PY
          git apply --check --index /tmp/cw03-final.patch
      - name: Commit reviewed changes on scoped branch
        run: |
          set -euo pipefail
          git apply --index /tmp/cw03-final.patch
          git rm -r .cw03-final
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(reporting): close native export, deterministic evidence and retry policy gaps'
          git push origin HEAD:refs/heads/feat/cw-03-reporting-output-policies
          git rev-parse HEAD
      - name: Retain exact committed source
        run: |
          mkdir -p /tmp/cw03-source
          git rev-parse HEAD > /tmp/cw03-source/COMMIT
          git archive --format=tar.gz --prefix=chartworks/ HEAD > /tmp/cw03-source/source.tar.gz
          cd /tmp/cw03-source
          sha256sum source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: cw-03-final-source
          path: /tmp/cw03-source/
          retention-days: 1
          if-no-files-found: error
