name: Phase 20 source snapshot
on:
  push:
    branches: [feat/phase-20-21-chart-spec-http]
    paths: [.github/workflows/phase-20-source-snapshot.yml]
permissions:
  contents: read
jobs:
  toolkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CHARTWORKS_BRUIN_BUILD_DIR: /tmp/chartworks-bruin
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - name: Download and verify locked dependencies
        run: |
          go mod download
          go mod verify
          tar -czf /tmp/chartworks-modules.tar.gz -C "$(go env GOMODCACHE)" --exclude='cache/download/*/@v/*.zip' .
      - uses: actions/upload-artifact@v4
        with:
          name: phase-20-modules
          path: /tmp/chartworks-modules.tar.gz
          compression-level: 0
          retention-days: 2
      - name: Build pinned native parser
        run: bash scripts/build-bruin.sh
      - name: Archive native link inputs
        run: |
          cd /tmp/chartworks-bruin
          find source/pkg/sqlparser/rustffi/target/release -maxdepth 1 -type f \( -name '*.a' -o -name '*.so' \) -print > /tmp/native-inputs.txt
          test -s /tmp/native-inputs.txt
          printf 'bruin\n' >> /tmp/native-inputs.txt
          tar -czf /tmp/chartworks-native.tar.gz -T /tmp/native-inputs.txt
      - uses: actions/upload-artifact@v4
        with:
          name: phase-20-native
          path: /tmp/chartworks-native.tar.gz
          compression-level: 0
          retention-days: 2
