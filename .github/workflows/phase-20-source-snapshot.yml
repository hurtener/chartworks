name: Publish reviewed phase 20 tree
on:
  push:
    branches: [feat/phase-20-21-chart-spec-http]
    paths: [.github/workflows/phase-20-source-snapshot.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify and apply exact reviewed source patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 7183b7252905c51fd6a48729548d965abaeda7e5
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, urllib.request
          parts = [
              '7d323324c7940b1ed36dde04d1f0631d7a3308b1',
              '10bb9838c05ba43bd646ff65d75c5968d165cf51',
              'b608d51a41c6bd90b71ea83a22bdcb266a30e352',
              'bb127e231c69df1e63367099b91b43c41d6a1e7c',
              'd70e488bfd8224916ff67feae4e322bf1db63872',
          ]
          payload = bytearray()
          for i, sha in enumerate(parts):
              request = urllib.request.Request(
                  'https://api.github.com/repos/hurtener/chartworks/git/blobs/' + sha,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  item = json.load(response)
              assert item['encoding'] == 'base64'
              raw = base64.b64decode(item['content'])
              assert len(raw) == (12000 if i < 4 else 6572)
              assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == sha
              payload.extend(raw)
          assert hashlib.sha256(payload).hexdigest() == 'f000be94a25986ee517937d398f3c60c4cfe000916679eb28f87b91e10156bdd'
          patch = lzma.decompress(payload)
          assert len(patch) == 694589
          pathlib.Path('/tmp/phase20.patch').write_bytes(patch)
          PY
          git apply --check --unidiff-zero /tmp/phase20.patch
          git apply --index --unidiff-zero /tmp/phase20.patch
          git rm .github/workflows/phase-20-source-snapshot.yml
          test "$(git write-tree)" = c6a05c287d8471ca5e83b793b8cb855c3c96c4a3
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(charts): implement phase 20 and cumulative phase 21 contracts'
          git push origin HEAD:refs/heads/feat/phase-20-21-chart-spec-http
