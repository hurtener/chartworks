name: Phase 20 source snapshot
on:
  push:
    branches: [feat/phase-20-21-chart-spec-http]
    paths: [.github/workflows/phase-20-source-snapshot.yml]
permissions:
  contents: read
jobs:
  toolkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - name: Download and verify locked dependencies
        run: |
          go mod download
          go mod verify
          tar -czf /tmp/chartworks-modules.tar.gz -C "$(go env GOMODCACHE)" --exclude='cache/download/*/@v/*.zip' .
          split -b 200M /tmp/chartworks-modules.tar.gz /tmp/chartworks-modules.part-
      - uses: actions/upload-artifact@v4
        with:
          name: phase-20-modules-a
          path: /tmp/chartworks-modules.part-aa
          compression-level: 0
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: phase-20-modules-b
          path: /tmp/chartworks-modules.part-ab
          compression-level: 0
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: phase-20-modules-c
          path: /tmp/chartworks-modules.part-ac
          compression-level: 0
          retention-days: 2
