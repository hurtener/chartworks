name: Prepare S8 qualification tracker objects
on:
  push:
    branches: [codex/sql-semantic-context-recovery]
    paths: [.github/workflows/sql-tracker-qualification.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 93539ccdf6cea974c50597fce568306d2d62f6c7
          persist-credentials: false
      - name: Verify tracker patch and prepare Git objects without changing refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,base64,gzip,hashlib,pathlib,subprocess,urllib.request
          base='https://api.github.com/repos/hurtener/chartworks/git/'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          def request(path,body=None):
            req=urllib.request.Request(base+path,data=json.dumps(body).encode() if body is not None else None,headers=headers,method='POST' if body is not None else 'GET')
            with urllib.request.urlopen(req,timeout=30) as response:return json.load(response)
          compressed=b''
          for sha in ['f2dda55890e0d9c6d568597a59f0b18cfda110f9','24c81810e891fbcf01b6ae990fcab1798c02d616']:
            raw=base64.b64decode(request('blobs/'+sha)['content'])
            assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha
            compressed+=raw
          patch=gzip.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest()=='62cee9ae26a9602cacd6b3e8de8b45d184fc07117ed38834bd9ed79208bed587'
          pathlib.Path('/tmp/trackers.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','--index','/tmp/trackers.patch'],check=True)
          subprocess.run(['git','apply','--index','/tmp/trackers.patch'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          expected='786ca3abd5673d1d480513c9eeedfafb41696d4a'
          assert subprocess.check_output(['git','write-tree'],text=True).strip()==expected
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert len(paths)==13 and all(p.startswith('docs/') for p in paths)
          subprocess.run(['make','planning-check'],check=True)
          entries=[]
          for path in paths:
            raw=pathlib.Path(path).read_bytes()
            sha=request('blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})['sha']
            assert sha==hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
            entries.append({'path':path,'mode':'100644','type':'blob','sha':sha})
          tree=request('trees',{'base_tree':'193cf00efa78ad3e15f2d137d61efb61f03babda','tree':entries})['sha']
          assert tree==expected
          print('VERIFIED_TREE='+tree)
          PY
