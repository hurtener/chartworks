name: Publish phase 27 reviewed snapshot
on:
  push:
    branches: [feat/phase-27-reporting-blocks]
permissions:
  contents: write
concurrency:
  group: phase27-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'hurtener/chartworks' && github.ref == 'refs/heads/feat/phase-27-reporting-blocks'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Publish exact hash-verified local snapshot to the same feature branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = aabc6979e9e80be271ee7b381d4e1fa7ccdefbaf
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, lzma, subprocess
          expected = ['.github/workflows/phase-27-dev.yml'] + [f'.phase27-transfer-{i}.part' for i in range(4)]
          changed = subprocess.check_output(['git', 'diff', '--name-only', 'HEAD^', 'HEAD'], text=True).splitlines()
          assert sorted(changed) == sorted(expected), changed
          raw = lzma.decompress(b''.join(Path(f'.phase27-transfer-{i}.part').read_bytes() for i in range(4)))
          assert len(raw) == 114392
          assert hashlib.sha256(raw).hexdigest() == 'f9497369aceea5c8cd7ef35d65445e27d3c68adaa3502d2b83cb3592e97c9b0a'
          Path('/tmp/phase27.patch').write_bytes(raw)
          PY
          git apply --check --index --unidiff-zero /tmp/phase27.patch
          git apply --index --unidiff-zero /tmp/phase27.patch
          git rm -- .phase27_api.py .phase27_apply.py .phase27_core.py .phase27_integrate.py internal/foundation/reporting.go .phase27-transfer-0.part .phase27-transfer-1.part .phase27-transfer-2.part .phase27-transfer-3.part
          python3 - <<'PY'
          import os, subprocess
          env = dict(os.environ, GIT_INDEX_FILE='/tmp/phase27-verify.index')
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          subprocess.run(['git', 'read-tree', tree], env=env, check=True)
          workflows = subprocess.check_output(['git', 'ls-files', '.github/workflows/'], env=env, text=True).splitlines()
          subprocess.run(['git', 'update-index', '--force-remove', '--', *workflows], env=env, check=True)
          actual = subprocess.check_output(['git', 'write-tree'], env=env, text=True).strip()
          assert actual == '44e57fcdb3a4930dbd8fa979ac47ec3608a631b6', actual
          print('Verified non-workflow source tree:', actual)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(reporting): complete phase 27 and adversarial acceptance'
          git push origin HEAD:refs/heads/feat/phase-27-reporting-blocks
