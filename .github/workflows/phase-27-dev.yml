name: Phase 27 development checkpoint
on:
  push:
    branches: [feat/phase-27-reporting-blocks]
    paths: [.github/workflows/phase-27-dev.yml]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/chartworks-bruin
          key: clients-bruin-ubuntu24-amd64-go1.26.4-rust1.98.1-5f562c2959496a04d57f5f199f5e3ad22159fa9f
          fail-on-cache-miss: true
      - name: Recover exact public development dependencies
        run: |
          test "$(git -C /tmp/chartworks-bruin/source rev-parse HEAD)" = 5f562c2959496a04d57f5f199f5e3ad22159fa9f
          tar -czf /tmp/phase27-native.tar.gz -C /tmp/chartworks-bruin bruin source/pkg/sqlparser/rustffi/target/release/libbruin_rustsqlparser.a
          id=$(docker create pgvector/pgvector:0.8.2-pg17)
          docker export "$id" | gzip -1 > /tmp/phase27-pg17.tar.gz
          docker rm "$id"
          git bundle create /tmp/phase27.git.bundle --all
      - uses: actions/upload-artifact@v4
        with:
          name: phase27-native-offline
          path: |
            /tmp/phase27-native.tar.gz
            /tmp/phase27-pg17.tar.gz
            /tmp/phase27.git.bundle
          compression-level: 0
          retention-days: 3
