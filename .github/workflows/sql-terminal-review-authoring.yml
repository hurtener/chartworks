name: SQL terminal review source objects
on:
  push:
    branches: [codex/sql-semantic-context-recovery]
    paths: [.github/workflows/sql-terminal-review-authoring.yml]
permissions:
  contents: write
jobs:
  source:
    if: github.repository == 'hurtener/chartworks'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Prepare pinned reviewed source; do not move refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import subprocess,textwrap
          prior=subprocess.check_output(['git','show','571ea39d5836c6ec7387b26108da73d749c77647:.github/workflows/sql-terminal-review-authoring.yml'],text=True)
          code=textwrap.dedent(prior.split("          python - <<'PY'\n",1)[1].split('          PY\n',1)[0])
          old="assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()==base\n"
          assert code.count(old)==1
          code=code.replace(old,'',1)
          anchor="subprocess.run(['git','rm',path],check=True)"
          assert code.count(anchor)==1
          extra='''extra=b''
          for sha in ['e2f9d6d2383aa91758336f38141bfd8b637ba47d','72d31416df2a424c1f9d14df70f543ff5b7fe03e','3dbbbdd1f9e5e0343c70d299c322fe552601e654','c16939c5bd41038208c6f782a314e5ab898a41cc']:
              raw=base64.b64decode(api('git/blobs/'+sha)['content'])
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\\0'+raw).hexdigest()==sha
              extra+=raw
          extra=gzip.decompress(extra)
          assert len(extra)==15930 and hashlib.sha256(extra).hexdigest()=='a77994104356a0bf668b805bbe4f5725588b94a6377900a5e2a049a194f1ec81'
          subprocess.run(['git','apply','--check','--index','-'],input=extra,check=True)
          subprocess.run(['git','apply','--index','-'],input=extra,check=True)
          '''
          extra=textwrap.dedent(extra)
          code=code.replace(anchor,extra+anchor,1)
          code=code.replace("tree=='4eab1d028b326d61b2a7f88b367e25d0b32ac24b'","tree=='87b93e15a03a15c194575ba2b6fbe2207033d1a2'",1)
          code=code.replace("'100755' if name=='scripts/check-sql-adversarial-baseline.py' else '100644'","'100644'",1)
          exec(compile(code,'reviewed-terminal-and-journal-patch','exec'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sql-terminal-review-source-objects
          path: /tmp/source-manifest.json
          retention-days: 7
