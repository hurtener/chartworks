name: Prepare pending-refinement objects
on:
  push:
    branches: [codex/sql-semantic-context-recovery]
    paths: [.github/workflows/pending-refinement-objects.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 799eeb1232296f32624e1040b83ea692d41c7a49
          persist-credentials: false
      - name: Verify and stage exact source changes without moving a branch
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD: 
        run: |
          python3 - <<'PY'
          import os,base64,gzip,hashlib,pathlib,json,subprocess,urllib.request
          patch=gzip.decompress(base64.b64decode(os.environ['PAYLOAD']))
          assert hashlib.sha256(patch).hexdigest()=='ff6f72e4404070b28d73f9c9e58d26a4a6075db746b1dece6963a6bd492f0ab0'
          pathlib.Path('/tmp/pending.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','--index','/tmp/pending.patch'],check=True)
          subprocess.run(['git','apply','--index','/tmp/pending.patch'],check=True)
          expected='56f8d6ad5cdffad092b1df86b85679b6ded12a77'
          assert subprocess.check_output(['git','write-tree'],text=True).strip()==expected
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert len(paths)==8 and all(p.startswith(('internal/nlqexec/','docs/contracts/','docs/reviews/','test/acceptance/')) or p=='.github/workflows/sql-context-recovery.yml' for p in paths)
          base='https://api.github.com/repos/hurtener/chartworks/git/'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          def post(path,body):
            request=urllib.request.Request(base+path,data=json.dumps(body).encode(),headers=headers,method='POST')
            with urllib.request.urlopen(request,timeout=30) as response:return json.load(response)
          entries=[]
          for path in paths:
            raw=pathlib.Path(path).read_bytes()
            sha=post('blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})['sha']
            assert sha==hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
            entries.append({'path':path,'mode':'100644','type':'blob','sha':sha})
          tree=post('trees',{'base_tree':'45a30609149ba34abaca2bdbed468d009902f193','tree':entries})['sha']
          assert tree==expected
          print('VERIFIED_SOURCE_TREE='+tree)
          PY
