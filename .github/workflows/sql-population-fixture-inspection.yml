name: SQL population fixture inspection
on:
  push:
    branches: [codex/sql-semantic-context-recovery]
    paths: [.github/workflows/sql-population-fixture-inspection.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    if: github.repository == 'hurtener/chartworks' && github.actor == 'hurtener'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 35952275625
          pattern: sql-context-evidence-1.26.4-*
          path: ${{ runner.temp }}/evidence
      - name: Inspect exact retained assertion events
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          for p in Path(os.environ['RUNNER_TEMP']).glob('evidence/**/*.log'):
              print('EVIDENCE',p.name)
              for line in p.read_text().splitlines():
                  try: e=json.loads(line)
                  except json.JSONDecodeError: continue
                  test=e.get('Test','')
                  if test.startswith('TestSQLRecoveryQueryPopulationAcceptance') and e.get('Action')=='output':
                      print(e.get('Output','').strip())
          PY
# Temporary read-only inspection, no changed source or passing-result claim.
