name: SQL population fixture inspection
on:
  push:
    branches: [codex/sql-semantic-context-recovery]
    paths: [.github/workflows/sql-population-fixture-inspection.yml]
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'hurtener/chartworks' && github.actor == 'hurtener'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect public synthetic clarification provenance
        run: |
          git rev-parse HEAD
          python3 - <<'PY'
          from pathlib import Path
          markers=['policy_not_matched','func populationPrivateQuestion','func matchClarificationPattern','func prepareClarificationAnswers','func TestSQLRecoveryAnalyticalOwnedScalarRepair','func RedactClarificationText']
          for root in ['internal','test/acceptance']:
              for p in sorted(Path(root).rglob('*.go')):
                  lines=p.read_text().splitlines()
                  for i,line in enumerate(lines):
                      if any(m in line for m in markers):
                          print('SOURCE',str(p),i+1)
                          for j in range(max(0,i-2),min(len(lines),i+50)):
                              print(f'{j+1}: {lines[j]}')
          PY
          git diff --exit-code
# Temporary source inspection only; no test result or runtime capability claim.
