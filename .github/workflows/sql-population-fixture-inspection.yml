name: SQL population fixture inspection
on:
  push:
    branches: [codex/sql-semantic-context-recovery]
    paths: [.github/workflows/sql-population-fixture-inspection.yml]
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'hurtener/chartworks' && github.actor == 'hurtener'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect public synthetic provider fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in sorted(Path('test/acceptance').glob('*.go')):
              lines=p.read_text().splitlines()
              for i,line in enumerate(lines):
                  if 'func newGatewayFixture(' in line or ('chatSequence' in line and ('len(' in line or '[]string' in line and 'chatSequence ' in line)):
                      print('FIXTURE_SOURCE',str(p),i+1)
                      for j in range(max(0,i-8),min(len(lines),i+24)):
                          print(f'{j+1}: {lines[j]}')
          PY
          git diff --exit-code
# Temporary source inspection only; no test result or runtime capability claim.
