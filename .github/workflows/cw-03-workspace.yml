name: CW-03 isolated implementation transfer
on:
  push:
    branches: [feat/cw-03-reporting-output-policies]
    paths: [.github/workflows/cw-03-workspace.yml]
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'hurtener/chartworks' && github.ref == 'refs/heads/feat/cw-03-reporting-output-policies'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact base and implementation packet
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 60e88178cc7d24e6e8eafd8f426930f384970cdf HEAD -- . ':(exclude).cw03-transfer/**' ':(exclude).github/workflows/cw-03-workspace.yml'
          python3 - <<'PY'
          from pathlib import Path
          import base64, bz2, hashlib, re
          parts = [Path(f'.cw03-transfer/part{i}.txt').read_text().strip() for i in (1, 2, 3)]
          # Correct two repeated-character transport transcription errors only;
          # the complete original patch checksum remains the acceptance gate.
          parts[1] = re.sub(r'IyS+RES+RJJPHSTvLvJJJ1ed5JJJJEk65', 'Iy'+'S'*10+'RE'+'S'*7+'RJJPHSTvLvJJJ1ed5JJJJEk65', parts[1])
          parts[1] = re.sub(r'MhCFJ+PtTib3', 'MhCF'+'J'*11+'PtTib3', parts[1])
          assert [len(p) for p in parts] == [18000, 18000, 17868]
          patch = bz2.decompress(base64.b64decode(''.join(parts), validate=True))
          expected = 'd45b1fd3b7340803000550aeb78c0ea07f93c15dda6f702703aeec6cd8a815a7'
          assert hashlib.sha256(patch).hexdigest() == expected, 'implementation packet mismatch'
          Path('/tmp/cw03.patch').write_bytes(patch)
          print('Verified original implementation SHA256:', expected)
          PY
          git apply --check --index /tmp/cw03.patch
      - name: Commit implementation and remove temporary transfer files
        shell: bash
        run: |
          set -euo pipefail
          git apply --index /tmp/cw03.patch
          git rm -r .cw03-transfer .github/workflows/cw-03-workspace.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(reporting): version output intent and seal bounded narrative policies'
          git push origin HEAD:refs/heads/feat/cw-03-reporting-output-policies
      - name: Archive exact committed implementation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cw-03-snapshot
          git rev-parse HEAD > /tmp/cw-03-snapshot/COMMIT
          git archive --format=tar.gz --prefix=chartworks/ HEAD > /tmp/cw-03-snapshot/source.tar.gz
          cd /tmp/cw-03-snapshot
          sha256sum source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: cw-03-implementation-snapshot
          path: /tmp/cw-03-snapshot/
          retention-days: 1
          if-no-files-found: error
