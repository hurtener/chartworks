name: CW-03 branch workspace
on:
  push:
    branches: [feat/cw-03-reporting-intent-policies]
    paths: [.cw03/edit.py]
permissions:
  contents: write
concurrency:
  group: cw03-branch-workspace
  cancel-in-progress: false
jobs:
  edit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cw-03-reporting-intent-policies
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - name: Apply explicitly authored changes on the scoped branch
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = feat/cw-03-reporting-intent-policies
          python3 .cw03/edit.py
          git ls-files -z -- '*.go' | xargs -0 gofmt -w
          find internal -name '*.go' -print0 | xargs -0 gofmt -w
          git diff --check
          git add internal sdk test web docs examples RFC-002-Governed-Reporting.md
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(reporting): implement versioned output intent and bounded policies'
          git push origin HEAD:refs/heads/feat/cw-03-reporting-intent-policies
          echo "AUTHORED_COMMIT=$(git rev-parse HEAD)"
