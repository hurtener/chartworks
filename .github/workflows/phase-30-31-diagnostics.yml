name: Phase 30-31 focused verification diagnostics
on:
  push:
    branches: [feat/phase-30-31-reporting-delivery]
    paths: [.github/workflows/phase-30-31-diagnostics.yml]
permissions:
  actions: read
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = await github.rest.actions.downloadArtifact({owner: context.repo.owner, repo: context.repo.repo, artifact_id: 10364548963, archive_format: 'zip'});
            fs.writeFileSync('/tmp/reporting-diagnostics.zip', Buffer.from(result.data));
      - name: Read only failed subtests and actual fixture definitions
        run: |
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          with zipfile.ZipFile('/tmp/reporting-diagnostics.zip') as archive:
            for name in archive.namelist():
              if 'phase30' not in name and 'phase31' not in name: continue
              print('\nFILE:',name)
              for line in archive.read(name).decode().splitlines():
                try: record=json.loads(line)
                except ValueError: continue
                test=record.get('Test','')
                if record.get('Action')=='output' and ('ordinary-catalog-and-viewer-scheduled-provenance/report' in test or 'actual-component-boundaries' in test):
                  print(record.get('Output','')[:3500],end='')
          for p in Path('test/acceptance').glob('phase30*.go'):
            lines=p.read_text().splitlines()
            for i,line in enumerate(lines):
              if 'func (f *phase30Fixture) manager' in line:
                print('\nMANAGER:',p); print('\n'.join(lines[i:i+24]))
          PY
