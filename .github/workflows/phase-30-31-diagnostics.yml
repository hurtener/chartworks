name: Phase 30-31 final local diagnostics
on:
  push:
    branches: [feat/phase-30-31-reporting-delivery]
    paths: [.github/workflows/phase-30-31-diagnostics.yml]
permissions:
  actions: read
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = await github.rest.actions.downloadJobLogsForWorkflowRun({owner: context.repo.owner, repo: context.repo.repo, job_id: 104112038522});
            fs.writeFileSync('/tmp/reporting-coverage-job.log', Buffer.from(result.data));
      - name: Pinned upstream lint executable with release checksum
        run: |
          set -euo pipefail
          cd /tmp
          curl --fail --silent --show-error -L -o golangci-lint.tar.gz https://github.com/golangci/golangci-lint/releases/download/v2.12.2/golangci-lint-2.12.2-linux-amd64.tar.gz
          curl --fail --silent --show-error -L -o checksums.txt https://github.com/golangci/golangci-lint/releases/download/v2.12.2/golangci-lint-2.12.2-checksums.txt
          expected="$(awk '$2=="golangci-lint-2.12.2-linux-amd64.tar.gz" {print $1}' checksums.txt)"
          test -n "$expected"
          echo "$expected  golangci-lint.tar.gz" | sha256sum -c -
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-30-31-final-diagnostics
          path: |
            /tmp/reporting-coverage-job.log
            /tmp/golangci-lint.tar.gz
          retention-days: 2
