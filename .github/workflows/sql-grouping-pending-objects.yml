name: Prepare pending grouping review objects
on:
  push:
    branches: [codex/sql-semantic-context-recovery]
    paths: [.github/workflows/sql-grouping-pending-objects.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dfb0f72be9b58067fb6f9106f241c89db948c34f
          persist-credentials: false
      - name: Verify exact pending grouping patch and source tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,base64,gzip,hashlib,pathlib,subprocess,urllib.request
          base='https://api.github.com/repos/hurtener/chartworks/git/'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          def req(path,body=None):
            request=urllib.request.Request(base+path,data=json.dumps(body).encode() if body is not None else None,headers=headers,method='POST' if body is not None else 'GET')
            with urllib.request.urlopen(request,timeout=30) as response:return json.load(response)
          data=b''
          for sha in ['936c3269444136f10913786ee0cf5f37c24e6a93','bdabbb8f0f4af2d589e76a08a431b6e1b6b5fa68']:
            raw=base64.b64decode(req('blobs/'+sha)['content'])
            assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha
            data+=raw
          patch=gzip.decompress(data)
          assert hashlib.sha256(patch).hexdigest()=='84a8fcf8716355301303a2da28bcb282343bb10d46e9eff6f93bb3a12baa8596'
          pathlib.Path('/tmp/grouping-review.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','--index','/tmp/grouping-review.patch'],check=True)
          subprocess.run(['git','apply','--index','/tmp/grouping-review.patch'],check=True)
          expected='118a451448d9ed8b629582b0128c7f763dc7460f'
          assert subprocess.check_output(['git','write-tree'],text=True).strip()==expected
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert paths==['.github/workflows/sql-context-recovery.yml','docs/contracts/grouping-continuity-v1.md','internal/nlqexec/grouping_continuation.go','internal/nlqexec/grouping_continuation_test.go','test/acceptance/sql_grouping_continuation_test.go']
          entries=[]
          for path in paths:
            raw=pathlib.Path(path).read_bytes()
            sha=req('blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})['sha']
            assert sha==hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
            entries.append({'path':path,'mode':'100644','type':'blob','sha':sha})
          tree=req('trees',{'base_tree':'bddce7fc2a51c452674eb90c5250d551b3f300a9','tree':entries})['sha']
          assert tree==expected
          print('VERIFIED_TREE='+tree)
          PY
