name: CW-02 isolated workspace
on:
  push:
    branches: [ci/cw-02-workspace]
    paths: [.github/workflows/cw-02-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8db1c9d69a9b2ef48d6dd83e4f18e3a00e928b2e
          fetch-depth: 2
          persist-credentials: false
      - name: Archive exact tracked source and Git objects only
        run: |
          git archive --format=tar.gz --prefix=chartworks/ HEAD > "$RUNNER_TEMP/chartworks-source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/chartworks-source-sha.txt"
          sha256sum "$RUNNER_TEMP/chartworks-source.tar.gz" > "$RUNNER_TEMP/chartworks-workspace-sha256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: cw-02-current-source
          path: |
            ${{ runner.temp }}/chartworks-source.tar.gz
            ${{ runner.temp }}/chartworks-source-sha.txt
            ${{ runner.temp }}/chartworks-workspace-sha256.txt
          retention-days: 1
          if-no-files-found: error
