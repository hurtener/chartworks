name: Prepare reviewed concept-selection source
on:
  push:
    branches: [codex/sql-semantic-context-recovery]
    paths: [.github/workflows/concept-source-objects.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2dd7e9b9bfa91a84831843e4bf2413aaa6e5d02d
          persist-credentials: false
      - name: Reconstruct exact patch and create source objects without moving refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,base64,gzip,hashlib,pathlib,json,subprocess,urllib.request
          endpoint='https://api.github.com/repos/hurtener/chartworks/git/'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          def request(path,body=None):
              req=urllib.request.Request(endpoint+path,data=json.dumps(body).encode() if body is not None else None,headers=headers,method='POST' if body is not None else 'GET')
              with urllib.request.urlopen(req,timeout=45) as response:return json.load(response)
          chunks=['b8c4c102673e06975f7dcf347ccb68b9bb8afdd2','8cfefd1b2401bc341d18da859ccd550a0aaf99c6','bf30fbd75be2e99da7fec4ac9660fbfd5e557cdb','a7c4123b8ce71c74d2d4ddc0c8afeb1d8892dfea','bc380bb6b515f305b14a317b34433e7b218c4954','9d7887b3680ef2dc0a9107ed362d67d1fdd04fff','32f93a73868993a0bb6eff6ee409323eb3b9c912','9170261f7f98d82aa86d61e4725dc83ed9f17e30','8dfd1edc8fb7f6a0e62455a7e5e84c564ca89c81','6c900ddcdb5380d618b4548003edd16b3921c5e8','2bf79e90adc9cea146dd8ca7f8a1517a56106173','9a974c084a65b57cf5f08e25bc1e9a7e78f7e67d','bc4290e514a2f2d243d2f523dacfcf58671ba4f3','7ce0dec6f51b43b5de9b9160cc3a3c83e0edb383','09c6f41e69937cf6ffda851e8b5efc65e65214a3','f6080d4d3172f8353823135df35a95914ba94041','ac471ddb54537020784a107cc757e64b65e03ca3','c5661caffed44c66d89c5b9f31b4b5081bf96a52','ea90f979133c13e1b855ad7c00bdf61328033df7','d1b024c120e1884f04a4b3df109f4db66d55cb42','e0bdd1d6f1a1813171a9fe3cc29422bcea7d3987','ee0711c9672dc85260d1d9ff7f7d344b05ae669e','1437c53cfcad69f3cb36a96b5bc8c1bacd2b260e','a34adde8de0eb7f0bb7e99df2c539962d1b5eb24','6df11b01660cc22554850622b1d9294679d18dc5','bfa13c0a34f21f88658e8b38254cb1dab7d8f35d','28ef262773553edd6b7a940f39b11f7343b884c3','d573dced18252698a81889fd2f81136ff13921bf','fc657f65cfedf639e5365327865acc282b38e8ac','a7c7b222fab42530a4dfe40c8bc86f92c2eae30f','71c507d112eb4b83a8ecbe3f9d6bd7c2b903b88d','d8dae0f465f81f9bf256459ecf7e65d9b3efd05e']
          data=b''
          for sha in chunks:
              raw=base64.b64decode(request('blobs/'+sha)['content'])
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha
              data+=raw
          patch=gzip.decompress(data)
          assert hashlib.sha256(patch).hexdigest()=='ddacdbe69614873bce83a6206233ee86f01ba9449b51b2f258e8d18ba69c1308'
          path=pathlib.Path('/tmp/concepts.patch');path.write_bytes(patch)
          subprocess.run(['git','apply','--check','--index',str(path)],check=True)
          subprocess.run(['git','apply','--index',str(path)],check=True)
          expected='ebb7584e1b835788e3551b06e21379acf49a3cdd'
          assert subprocess.check_output(['git','write-tree'],text=True).strip()==expected
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert len(paths)==33 and all(p.startswith(('internal/nlq/','internal/nlqroute/','internal/nlqexec/','sdk/chartworks/','docs/','test/acceptance/')) or p=='.github/workflows/sql-context-recovery.yml' for p in paths)
          entries=[]
          for path in paths:
              raw=pathlib.Path(path).read_bytes()
              sha=request('blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})['sha']
              assert sha==hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              entries.append({'path':path,'mode':'100644','type':'blob','sha':sha})
          tree=request('trees',{'base_tree':'b323b8903ddef37a6bb3ad13696b7abb86db3275','tree':entries})['sha']
          assert tree==expected
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'concept-objects';out.mkdir()
          (out/'manifest.json').write_text(json.dumps({'baseline':'2dd7e9b9bfa91a84831843e4bf2413aaa6e5d02d','tree':tree,'entries':entries},indent=2))
          (out/'concepts.patch').write_bytes(patch)
          print('VERIFIED_SOURCE_TREE='+tree)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: concept-source-objects
          path: ${{ runner.temp }}/concept-objects/
          retention-days: 7
