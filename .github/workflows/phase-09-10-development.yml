name: Phase 09-10 development
on:
  push:
    branches: [feat/phase-09-10-read-execution]
    paths-ignore: [.github/workflows/read-execution-workspace.yml]
permissions:
  contents: write
concurrency:
  group: phase-09-10-development
  cancel-in-progress: false
jobs:
  develop:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CGO_ENABLED: 1
      CHARTWORKS_TEST_STORE_URL: postgres://chartworks:chartworks@localhost:5434/chartworks?sslmode=disable
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        ports: [5434:5432]
        env:
          POSTGRES_USER: chartworks
          POSTGRES_PASSWORD: chartworks
          POSTGRES_DB: chartworks
        options: >-
          --health-cmd "pg_isready -U chartworks -d chartworks"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-09-10-read-execution
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - name: Materialize bounded development edits
        run: |
          test "$GITHUB_REF" = refs/heads/feat/phase-09-10-read-execution
          for script in scripts/_phase_09_10*.py; do python3 "$script"; done
          find cmd internal sdk test -name '*.go' -print0 | xargs -0 gofmt -w
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet; then
            git add cmd internal sdk test docs scripts examples .github README.md GETTING-STARTED.md AGENTS.md CLAUDE.md RFC-001-Chartworks.md RFC-002-Governed-Reporting.md
            git commit -m 'build: materialize phase 09-10 incremental source edits'
            git push origin HEAD:feat/phase-09-10-read-execution
          fi
          echo "TESTED_COMMIT=$(git rev-parse HEAD)"
      - name: Build and vet
        run: |
          CGO_ENABLED=0 go build ./...
          go vet ./...
      - name: Read execution regression suite
        run: go test -race -count=1 -timeout=8m -v ./internal/exec ./internal/sources ./test/acceptance -run 'TestPhase(08|09|10)|TestRead|TestExecution|TestSQL'
      - name: Coverage inventory
        run: make coverage
