name: CW-01 superseded-check housekeeping

on:
  push:
    branches: [chore/cw-01-superseded-checks]
    paths: ['.github/workflows/cw-01-superseded-checks.yml']

permissions:
  contents: read
  actions: write

jobs:
  cancel-superseded:
    runs-on: macos-14
    timeout-minutes: 5
    steps:
      - name: Preserve final head and cancel only this review's superseded runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          REPOSITORY = "hurtener/chartworks"
          BRANCH = "feat/cw-01-conditional-typed-clarification"
          FINAL = "5cadf97a98db56390cb84372143e570195c5018c"
          OLD = {
              "e48ad9a2a2c5eba709a97f22a040aa889e8005b1",
              "70590c80412a8255141b36f6a51f5286b28685c0",
              "f6eb70e7e2db65daa90e3e67dd656e981dd795a0",
              "e47349aa80f84b15b94c3be33d8d4a9719550fce",
              "44ecb15f00888adf2dee29644c24b1d29e942862",
              "658409c99ba4dba4c6f1386175942686921ad633",
              "9163c1fb9e0b1d760eabf50ac0e8f1ab31f89dc1",
              "65c1d03446253986ae5fc77ffb3993d986c62377",
              "a804fc7712d572e6d3c767d8dd765d330b9abbe3",
          }
          WORKFLOWS = {
              308340675, 353702186, 354017655, 356147592,
              358125330, 359202213, 359241291, 359286900,
          }
          ACTIVE = {"queued", "in_progress", "pending", "requested", "waiting"}
          if os.environ.get("GITHUB_REPOSITORY") != REPOSITORY:
              raise SystemExit("wrong repository; no changes")
          if os.environ.get("GITHUB_REF") != "refs/heads/chore/cw-01-superseded-checks":
              raise SystemExit("wrong housekeeping branch; no changes")
          token = os.environ.get("GH_TOKEN")
          if not token or FINAL in OLD:
              raise SystemExit("missing scoped authority or invalid allowlist")

          def request(path, method="GET"):
              req = urllib.request.Request(
                  "https://api.github.com/repos/" + REPOSITORY + path,
                  data=b"" if method == "POST" else None,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": "Bearer " + token,
                      "X-GitHub-Api-Version": "2026-03-10",
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  body = response.read(4 << 20)
                  return json.loads(body) if body else {}

          def current_head():
              current = request("/git/ref/heads/" + BRANCH)
              if current.get("object", {}).get("sha") != FINAL:
                  raise SystemExit("implementation head changed; stop housekeeping")

          current_head()
          candidates = {}
          for page in range(1, 4):
              query = urllib.parse.urlencode({"branch": BRANCH, "per_page": 100, "page": page})
              runs = request("/actions/runs?" + query).get("workflow_runs", [])
              for run in runs:
                  if (run.get("head_branch") == BRANCH
                          and run.get("head_sha") in OLD
                          and run.get("workflow_id") in WORKFLOWS
                          and run.get("event") in {"push", "pull_request"}
                          and run.get("status") in ACTIVE):
                      candidates[int(run["id"])] = run["head_sha"]
              if len(runs) < 100:
                  break
          if len(candidates) > 100:
              raise SystemExit("unexpected run count; no cancellations")
          for run_id, expected_sha in sorted(candidates.items()):
              current_head()
              run = request("/actions/runs/" + str(run_id))
              if (run.get("head_branch") != BRANCH
                      or run.get("head_sha") != expected_sha
                      or run.get("head_sha") not in OLD
                      or run.get("workflow_id") not in WORKFLOWS
                      or run.get("event") not in {"push", "pull_request"}):
                  raise SystemExit("run identity changed; stop housekeeping")
              if run.get("status") not in ACTIVE:
                  continue
              try:
                  request("/actions/runs/" + str(run_id) + "/cancel", method="POST")
                  print("CANCEL_REQUESTED", run_id, expected_sha)
              except urllib.error.HTTPError as err:
                  if err.code != 409:
                      raise SystemExit("cancellation denied; status=" + str(err.code)) from None
                  print("RUN_ALREADY_FINISHED", run_id)
          current_head()
          print("FINAL_HEAD_PRESERVED", FINAL)
          print("No source, statuses, logs, artifacts, or other branches were modified")
          PY
