name: Authority pre-PR verification
on:
  push:
    branches: [feat/phase-03-04-authority]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CGO_ENABLED: 1
      CHARTWORKS_TEST_STORE_URL: postgres://chartworks:chartworks@localhost:5434/chartworks?sslmode=disable
    services:
      postgres:
        image: postgres:17
        ports: [5434:5432]
        env:
          POSTGRES_USER: chartworks
          POSTGRES_PASSWORD: chartworks
          POSTGRES_DB: chartworks
        options: >-
          --health-cmd "pg_isready -U chartworks -d chartworks"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - name: PostgreSQL recovery tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - name: Apply explicit source edits and normalize before review
        run: |
          for f in scripts/_authority_edits.py scripts/_authority_fixups.py scripts/_authority_followup.py; do
            [ -f "$f" ] || continue
            python3 "$f"
            git rm "$f"
          done
          go mod tidy
          find cmd internal sdk test -name '*.go' -print0 | xargs -0 gofmt -w
          git add go.mod go.sum cmd internal sdk test docs scripts examples
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: normalize explicit authority implementation and dependency lock'
            git push origin HEAD:feat/phase-03-04-authority
          fi
          echo "TESTED_COMMIT=$(git rev-parse HEAD)"
      - name: Compile and vet
        run: |
          make build
          make vet
      - name: Race, actual database integration, and package coverage
        run: make coverage
      - name: Exact phase criteria and cumulative checks
        run: |
          python3 scripts/run_phase_acceptance.py --phase 03
          python3 scripts/run_phase_acceptance.py --phase 04
          make planning-check
          make preflight-full
      - uses: golangci/golangci-lint-action@v8
        if: always()
        with:
          version: v2.12.2
