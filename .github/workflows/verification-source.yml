name: Temporary reviewed test cleanup
on:
  push:
    branches: [feat/phase-11-12-uploads-profiling]
    paths: [.github/workflows/verification-source.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - name: Apply inspected test-only cleanup and format
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p = Path('test/acceptance/engineering_native_reconciliation_test.go')
          text = p.read_text()
          assert text.count('waitProfileDeadline(t, ctx,') == 2
          assert text.count('func waitProfileDeadline(t *testing.T, ctx context.Context,') == 1
          text = text.replace('func waitProfileDeadline(t *testing.T, ctx context.Context,', 'func waitProfileDeadline(ctx context.Context, t *testing.T,')
          text = text.replace('waitProfileDeadline(t, ctx,', 'waitProfileDeadline(ctx, t,')
          p.write_text(text)
          p = Path('test/acceptance/engineering_store_boundaries_test.go')
          text = p.read_text()
          assert text.count('"github.com/hurtener/chartworks/internal/config"') == 1
          assert text.count('var _ = config.DefaultUploads') == 1
          text = text.replace('\t"github.com/hurtener/chartworks/internal/config"\n', '').replace('\nvar _ = config.DefaultUploads\n', '\n')
          for name, count in [('StartProfileRead',3),('StartProfileSummary',2),('PulseRequest',3),('FailRequest',3)]:
              before = 'r.DB.'+name+'('
              assert text.count(before) == count, name
              text = text.replace(before, 'r.'+name+'(')
          p.write_text(text)
          paths = ['test/acceptance/engineering_store_boundaries_test.go','test/acceptance/engineering_native_reconciliation_test.go']
          subprocess.run(['gofmt','-s','-w',*paths],check=True)
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','diff','--stat'],check=True)
          PY
      - name: Compile the actual acceptance test package
        run: go test ./test/acceptance -run '^$'
      - name: Store candidate source objects without updating branch or PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']
          assert repo == 'hurtener/chartworks'
          parent = os.environ['GITHUB_SHA']
          def api(route, value=None):
              request = urllib.request.Request('https://api.github.com/repos/'+repo+'/git/'+route, data=None if value is None else json.dumps(value).encode(), method='GET' if value is None else 'POST', headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request,timeout=30) as response:
                  return json.load(response)
          tree = api('commits/'+parent)['tree']['sha']
          paths = ['test/acceptance/engineering_store_boundaries_test.go','test/acceptance/engineering_native_reconciliation_test.go']
          entries = [{'path':p,'mode':'100644','type':'blob','content':Path(p).read_text()} for p in paths]
          tree = api('trees', {'base_tree':tree,'tree':entries})['sha']
          commit = api('commits', {'tree':tree,'parents':[parent],'message':'test(engineering): keep repository boundary tests lint-clean'})['sha']
          print('PREPARED_PARENT='+parent)
          print('PREPARED_TREE='+tree)
          print('PREPARED_COMMIT='+commit)
          print('No branch ref or PR state changed by the preparation job.')
          PY
