name: Temporary reviewed boundary verification
on:
  push:
    branches: [feat/phase-11-12-uploads-profiling]
    paths: [.github/workflows/verification-source.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CGO_ENABLED: 1
      CHARTWORKS_TEST_STORE_URL: postgres://chartworks:chartworks@localhost:5434/chartworks?sslmode=disable
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        ports: [5434:5432]
        env:
          POSTGRES_USER: chartworks
          POSTGRES_PASSWORD: chartworks
          POSTGRES_DB: chartworks
        options: >-
          --health-cmd "pg_isready -U chartworks -d chartworks"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 19f4dd046feacafe046a03b94ba79fd2aa8ccbb8
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - name: Apply reviewed test-fixture corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p = Path('test/acceptance/engineering_store_boundaries_test.go')
          text = p.read_text()
          def replace(before, after, count=1):
              global text
              assert text.count(before) == count, (before, text.count(before))
              text = text.replace(before, after)
          replace('run  func(context.Context, identity.Envelope) error', 'run  func(context.Context, *testing.T, identity.Envelope) error')
          replace('func(ctx context.Context, e identity.Envelope) error {', 'func(ctx context.Context, t *testing.T, e identity.Envelope) error {', 17)
          replace('call.run(scenario.ctx, scenario.e)', 'call.run(scenario.ctx, t, scenario.e)')
          replace('call.run(ctx, f.e)', 'call.run(ctx, t, f.e)')
          before = '''	limited := record
          	limited.Spec.ID, limited.Spec.Previous = "over-profile-cap", record.Spec.ID
          	limited.Settings.MaxVersions = 1
          	limited.SpecHash = limited.Digest()
          	if !limited.Valid() {
          		t.Fatal("profile version-cap fixture invalid")
          	}
          	if _, err = f.db.ReserveProfile(ctx, f.e, limited); !errors.Is(err, engineering.ErrLimit) {
          		t.Fatal("profile version limit not enforced before insertion", err)
          	}
          	stale := limited'''
          replace(before, '\tstale := record')
          replace('"github.com/hurtener/chartworks/internal/access"', '"github.com/hurtener/chartworks/internal/access"\n\t"github.com/hurtener/chartworks/internal/config"')
          text += '''

          // Exercise the valid minimum against real published versions. An invalid
          // configuration must not masquerade as evidence that a storage cap works.
          func TestProfileVersionCapCountsRealPublications(t *testing.T) {
          	f := newEngineeringFixture(t, func(v *config.Values) { v.Profiling.MaxVersions = 2 }, nil)
          	ctx := context.Background()
          	source := f.create(t, "version-cap-source")
          	first := f.profileSpec(t, source, "version-cap-first", []string{"id", "amount"}, "")
          	f.profile(t, first)
          	second := first
          	second.ID, second.Previous = "version-cap-second", first.ID
          	f.profile(t, second)
          	metadata := support.Raw(t, f.dsn)
          	before := count(t, metadata, `SELECT count(*) FROM chartworks.audit_events`)
          	third := second
          	third.ID, third.Previous = "version-cap-third", second.ID
          	if _, err := f.service.Build(ctx, f.e, third, "version-cap-third-build", false); !errors.Is(err, engineering.ErrLimit) {
          		t.Fatal("third version was not rejected at the valid two-version cap", err)
          	}
          	if count(t, metadata, `SELECT count(*) FROM chartworks.profile_versions`) != 2 || count(t, metadata, `SELECT count(*) FROM chartworks.read_attempts`) != 2 || count(t, metadata, `SELECT count(*) FROM chartworks.audit_events`) != before {
          		t.Fatal("rejected third version inserted metadata, sampled the source or emitted an audit")
          	}
          	evidence, err := f.service.Evidence(ctx, f.e, second.ID)
          	if err != nil || !evidence.Active {
          		t.Fatal("version cap changed the last published head", err)
          	}
          }
          '''
          p.write_text(text)
          subprocess.run(['gofmt','-s','-w',str(p)],check=True)
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','diff','--stat'],check=True)
          PY
      - name: Real PostgreSQL boundary and recovery regressions
        id: focused
        run: |
          go test -race -count=1 -timeout=4m ./test/acceptance -run '^(TestEngineeringRepositor|TestProfileVersionCap|TestProfileStoreBinds|TestUploadStoreBinds|TestMissingProfileRead|TestProfileReconciles)' > /tmp/boundary-tests.log 2>&1 || { cat /tmp/boundary-tests.log; exit 1; }
          cat /tmp/boundary-tests.log
      - name: Store reviewed source candidate without moving any ref
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FOCUSED_RESULT: ${{ steps.focused.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']
          assert repo == 'hurtener/chartworks'
          parent = os.environ['GITHUB_SHA']
          def api(route, value=None):
              request = urllib.request.Request('https://api.github.com/repos/'+repo+'/git/'+route, data=None if value is None else json.dumps(value).encode(), method='GET' if value is None else 'POST', headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request,timeout=30) as response:
                  return json.load(response)
          paths = ['test/acceptance/engineering_store_boundaries_test.go','test/acceptance/engineering_native_reconciliation_test.go']
          tree = api('commits/'+parent)['tree']['sha']
          entries = [{'path':p,'mode':'100644','type':'blob','content':Path(p).read_text()} for p in paths]
          tree = api('trees', {'base_tree':tree,'tree':entries})['sha']
          commit = api('commits', {'tree':tree,'parents':[parent],'message':'test(engineering): repair subtest ownership and verify real profile version limits'})['sha']
          log = Path('/tmp/boundary-tests.log')
          report = {'parent':parent,'tree':tree,'commit':commit,'focused_result':os.environ['FOCUSED_RESULT'],'output':log.read_text()[-24000:] if log.exists() else 'not executed'}
          blob = api('blobs', {'content':json.dumps(report,indent=2),'encoding':'utf-8'})['sha']
          print('PREPARED_COMMIT='+commit)
          print('PREPARED_TREE='+tree)
          print('REPORT_BLOB='+blob)
          print('FOCUSED_RESULT='+os.environ['FOCUSED_RESULT'])
          print('No ref or PR state was changed by this job.')
          PY
