name: Temporary reviewed recovery candidate
on:
  push:
    branches: [feat/phase-11-12-uploads-profiling]
    paths: [.github/workflows/verification-source.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6d3eacdc326778e1e89c2588ce2be6ad6819b3a1
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - name: Apply two inspected corrections and format candidate source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          def replace(path, before, after):
              p = Path(path)
              text = p.read_text()
              if text.count(before) != 1:
                  raise RuntimeError(f'{path}: reviewed anchor count {text.count(before)}')
              p.write_text(text.replace(before, after))
          replace('internal/sources/read.go', '\t\tfields := rows.FieldDescriptions()\n', '\t\tfields, fieldErr := readResultFields(rows)\n\t\tif fieldErr != nil {\n\t\t\treturn out, fieldErr\n\t\t}\n')
          replace('test/acceptance/engineering_audit_rollback_test.go', 'wantReads := 1', 'wantReads := int64(1)')
          paths = ['internal/sources/read.go', 'internal/sources/read_fields.go', 'internal/sources/read_fields_test.go', 'internal/engineering/parquet_value_boundaries_test.go', 'test/acceptance/engineering_audit_rollback_test.go']
          subprocess.run(['gofmt', '-s', '-w', *paths], check=True)
          subprocess.run(['git', 'diff', '--check'], check=True)
          PY
      - name: Verify focused source-error and decoding regressions
        env:
          CGO_ENABLED: 1
        run: |
          go test -race -count=1 -timeout=3m ./internal/sources ./internal/engineering
          go test ./test/acceptance -run '^$'
      - name: Store source-only candidate for connector review without moving refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']
          assert repo == 'hurtener/chartworks'
          parent = os.environ['GITHUB_SHA']
          def api(route, value=None):
              request = urllib.request.Request('https://api.github.com/repos/'+repo+'/git/'+route, data=None if value is None else json.dumps(value).encode(), method='GET' if value is None else 'POST', headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  print(error.code, error.read().decode())
                  raise
          base = api('commits/'+parent)['tree']['sha']
          paths = ['internal/sources/read.go', 'internal/sources/read_fields.go', 'internal/sources/read_fields_test.go', 'internal/engineering/parquet_value_boundaries_test.go', 'test/acceptance/engineering_audit_rollback_test.go']
          entries = [{'path':path,'mode':'100644','type':'blob','content':Path(path).read_text()} for path in paths]
          tree = api('trees', {'base_tree':base,'tree':entries})['sha']
          commit = api('commits', {'tree':tree,'parents':[parent],'message':'fix(sources): preserve deferred native failures before schema validation\n\nAdd exact Parquet-value and real PostgreSQL audit rollback/recovery regressions.'})['sha']
          print('PREPARED_PARENT='+parent)
          print('PREPARED_TREE='+tree)
          print('PREPARED_COMMIT='+commit)
          print('No branch or PR state was changed; workflow files are unchanged.')
          PY
