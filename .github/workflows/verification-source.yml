name: Temporary reviewed source candidate
on:
  push:
    branches: [feat/phase-11-12-uploads-profiling]
    paths: [.github/workflows/verification-source.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - name: Recover the exact reviewed replacements and preserve workflow files
        run: |
          python3 - <<'PY'
          import subprocess
          source = subprocess.check_output(['git','show','bc73a73dc737b4b660794cda5ee80a0e9a09aec0:.github/workflows/verification-source.yml'], text=True)
          start = source.index('          from pathlib import Path\n')
          end = source.index('          PY\n', start)
          program = '\n'.join(line[10:] if line.startswith('          ') else line for line in source[start:end].splitlines())
          # Workflow administration is performed by the authorized connector,
          # not by this job's contents-only token. Prepare only source edits.
          program = program[:program.index("p = '.github/workflows/ci.yml'")]
          exec(compile(program, '<reviewed-replacements-bc73a73>', 'exec'))
          files = subprocess.check_output(['git','ls-files','-z','*.go']).decode().split('\0')
          subprocess.run(['gofmt','-s','-w',*[p for p in files if p]], check=True)
          subprocess.run(['git','diff','--check'], check=True)
          subprocess.run(['git','diff','--stat'], check=True)
          PY
      - name: Store source-only candidate for review without moving any ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.request, urllib.error
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']
          assert repo == 'hurtener/chartworks'
          parent = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          tree = subprocess.check_output(['git','rev-parse','HEAD^{tree}'], text=True).strip()
          paths = subprocess.check_output(['git','diff','--name-only','-z']).decode().split('\0')
          entries = []
          for path in sorted(set(paths)-{''}):
              assert path.startswith(('internal/engineering/','internal/store/postgres/','test/acceptance/')), path
              entries.append({'path':path,'mode':'100644','type':'blob','content':Path(path).read_text()})
          def post(route, value):
              request = urllib.request.Request('https://api.github.com/repos/'+repo+'/git/'+route, data=json.dumps(value).encode(), method='POST', headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  print(error.code, error.read().decode())
                  raise
          candidate_tree = post('trees', {'base_tree':tree,'tree':entries})['sha']
          candidate = post('commits', {'message':'fix(engineering): resolve executed CI lint findings and privacy canary collision','tree':candidate_tree,'parents':[parent]})['sha']
          print('PREPARED_PARENT='+parent)
          print('PREPARED_TREE='+candidate_tree)
          print('PREPARED_COMMIT='+candidate)
          print('No branch or PR state was changed; workflow files are unchanged.')
          PY
