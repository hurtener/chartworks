name: Apply exact explanation checkpoint
on:
  push:
    branches: [codex/sql-semantic-context-recovery]
    paths: [.github/workflows/sql-explanation-authoring.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'hurtener/chartworks' && github.actor == 'hurtener'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fixed authored patch and remove transport
        env:
          PAYLOAD: >-
            
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 10c06b9c89a5fac960de8db7c342fe8193ccb4ce
          python3 - <<'PY'
          import base64,gzip,hashlib,os,pathlib
          patch=gzip.decompress(base64.b64decode(os.environ['PAYLOAD']))
          assert hashlib.sha256(patch).hexdigest() == '43acdeac6fc1f0882d5ddc4d939a7504d1c7a06ea6a47aedef8efdff8bba0af9'
          pathlib.Path('/tmp/explanations.patch').write_bytes(patch)
          PY
          git apply --check /tmp/explanations.patch
          git apply --index /tmp/explanations.patch
          git rm .github/workflows/sql-explanation-authoring.yml
          test "$(git write-tree)" = 22089b0152dbcf264292ccc9bc696774386257b6
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(nlq): retain accepted candidate explanations across query lifecycle'
          git push origin HEAD:refs/heads/codex/sql-semantic-context-recovery
          git rev-parse HEAD HEAD^{tree}
