name: CW01 focused readiness regressions

on:
  push:
    branches: [ci/cw01-readiness-diagnostics]
    paths: [.github/workflows/cw01-readiness-diagnostics.yml]

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CGO_ENABLED: 1
      GOFLAGS: -p=2
      CHARTWORKS_BRUIN_BUILD_DIR: /tmp/chartworks-native
      CHARTWORKS_TEST_STORE_URL: postgres://chartworks:chartworks@localhost:5434/chartworks?sslmode=disable
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        ports: [5434:5432]
        env:
          POSTGRES_USER: chartworks
          POSTGRES_PASSWORD: chartworks
          POSTGRES_DB: chartworks
        options: >-
          --health-cmd "pg_isready -U chartworks -d chartworks"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 3692a3a64c8423c1a16614734f1ff20f4c48fb7c
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - uses: actions/cache/restore@v4
        with:
          path: |
            /tmp/chartworks-native
            ~/.cargo/registry
            ~/.cargo/git
          key: cw01-native-linux-5f562c2959496a04d57f5f199f5e3ad22159fa9f-rust1981
      - name: Record exact committed source and prepare the pinned parser
        run: |
          test "$(git rev-parse HEAD)" = 3692a3a64c8423c1a16614734f1ff20f4c48fb7c
          go version
          bash scripts/build-bruin.sh
      - name: Focused native-calendar rejection and preservation regressions
        run: go test -race -count=1 -timeout=5m ./internal/exec -run '^TestBusiness(SQLServer|PostgresNativeTimestamp|MySQL)' -v
      - name: Actual PostgreSQL publication export and lifecycle regressions
        if: success() || failure()
        run: go test -race -count=1 -timeout=10m ./test/acceptance -run '^(TestTopicPublicationAPIAndAtomicLifecycle|TestPhase15)$' -v
      - name: Exact coverage-runner failure and timing contracts
        if: success() || failure()
        run: python3 -m unittest discover -s scripts -p test_coverage_gate.py -v
      - name: Source and lockfiles must remain unchanged
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
