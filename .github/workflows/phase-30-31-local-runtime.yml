name: Phase 30-31 local PostgreSQL runtime
on:
  push:
    branches: [feat/phase-30-31-reporting-delivery]
    paths: [.github/workflows/phase-30-31-local-runtime.yml]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        env:
          POSTGRES_PASSWORD: fixture-only
    steps:
      - name: Archive database binaries and their shared-library dependencies only
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/pg-runtime/usr/lib/postgresql /tmp/pg-runtime/usr/share/postgresql /tmp/pg-runtime/lib
          docker cp "$PG_CONTAINER:/usr/lib/postgresql/17" /tmp/pg-runtime/usr/lib/postgresql/
          docker cp "$PG_CONTAINER:/usr/share/postgresql/17" /tmp/pg-runtime/usr/share/postgresql/
          docker exec "$PG_CONTAINER" sh -c 'find /usr/lib/postgresql/17/bin /usr/lib/postgresql/17/lib -type f -exec ldd {} \; 2>/dev/null' | awk '/=> \/.* \(/{print $3}' | sort -u > /tmp/pg-libs.txt
          while IFS= read -r lib; do
            case "$(basename "$lib")" in
              libc.so.*|libm.so.*|libpthread.so.*|libdl.so.*|librt.so.*|libresolv.so.*|libanl.so.*|libnss_*|ld-linux*) continue ;;
            esac
            docker cp -L "$PG_CONTAINER:$lib" "/tmp/pg-runtime/lib/$(basename "$lib")"
          done < /tmp/pg-libs.txt
          printf '%s\n' 'PostgreSQL 17 / pgvector 0.8.2. Binaries and runtime libraries only; no database data or credentials.' > /tmp/pg-runtime/README.txt
          tar -czf /tmp/chartworks-postgres-runtime.tar.gz -C /tmp/pg-runtime .
      - uses: actions/upload-artifact@v4
        with:
          name: phase-30-31-postgres-runtime
          path: /tmp/chartworks-postgres-runtime.tar.gz
          retention-days: 1
