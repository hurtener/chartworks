name: CW-01 scoped authoring
on:
  push:
    branches: [feat/cw-01-typed-runtime]
    paths: ['.cw01/apply.py']
permissions:
  contents: write
concurrency:
  group: cw01-typed-runtime-author
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cw-01-typed-runtime
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - name: Apply the reviewed branch-local patch
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = feat/cw-01-typed-runtime
          python3 .cw01/apply.py
          git ls-files -z -- '*.go' | xargs -0 gofmt -w
          find internal test sdk -name '*.go' -print0 | xargs -0 gofmt -w
          git diff --check
          git add internal/nlqroute internal/nlqexec internal/nlqapi internal/nlq internal/semantics internal/store/postgres internal/topicapi internal/mcpserver sdk/chartworks test/acceptance docs/contracts docs/reviews docs/gap-analysis.md
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(cw-01): apply authored conditional clarification integration'
          git push origin HEAD:refs/heads/feat/cw-01-typed-runtime
          git rev-parse HEAD
