name: Phase 22 dependency workspace
on:
  push:
    branches: [feat/phase-22-mcp-server]
    paths: [.github/workflows/phase-22-dependencies.yml]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: false
      - name: Resolve supported public SDK and existing authority dependencies
        run: |
          go mod edit -require=github.com/modelcontextprotocol/go-sdk@v1.6.1
          go list -mod=mod -deps github.com/modelcontextprotocol/go-sdk/mcp ./internal/api ./internal/auth ./internal/config ./internal/chartservice > /tmp/phase-22-deps.txt
          tar -C "$(go env GOMODCACHE)" -czf /tmp/phase-22-modcache.tar.gz .
          cp go.mod /tmp/phase-22-go.mod
          cp go.sum /tmp/phase-22-go.sum
      - uses: actions/upload-artifact@v4
        with:
          name: phase-22-dependencies
          path: |
            /tmp/phase-22-modcache.tar.gz
            /tmp/phase-22-go.mod
            /tmp/phase-22-go.sum
            /tmp/phase-22-deps.txt
          retention-days: 3
