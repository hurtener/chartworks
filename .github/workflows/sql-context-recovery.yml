name: SQL context recovery

on:
  push:
    branches: [codex/sql-semantic-context-recovery]
  pull_request:
    paths:
      - internal/nlq/**
      - internal/nlqroute/**
      - internal/nlqexec/**
      - internal/semantics/**
      - internal/exec/**
      - internal/gateway/**
      - internal/config/**
      - internal/store/postgres/**
      - test/acceptance/**
      - .github/workflows/sql-context-recovery.yml

permissions:
  contents: read

concurrency:
  group: sql-context-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CGO_ENABLED: '1'
      GOFLAGS: '-p=2'
      CHARTWORKS_BRUIN_BUILD_DIR: /tmp/chartworks-native
      CHARTWORKS_TEST_STORE_URL: postgres://chartworks:chartworks@localhost:5434/chartworks?sslmode=disable
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        ports: [5434:5432]
        env:
          POSTGRES_USER: chartworks
          POSTGRES_PASSWORD: chartworks
          POSTGRES_DB: chartworks
        options: >-
          --health-cmd "pg_isready -U chartworks -d chartworks"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Capture exact committed source
        run: |
          mkdir -p "$RUNNER_TEMP/sql-context-source"
          git rev-parse HEAD > "$RUNNER_TEMP/sql-context-source/commit.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/sql-context-source/tree.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/sql-context-source/source.tar.gz"
          (cd "$RUNNER_TEMP/sql-context-source" && sha256sum commit.txt tree.txt source.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: sql-context-source-${{ github.sha }}
          path: ${{ runner.temp }}/sql-context-source/
          retention-days: 7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - name: Verify source, formatting and plan coherence
        run: |
          set -o pipefail
          go version
          go mod verify
          unformatted=$(git ls-files '*.go' | xargs gofmt -l)
          if [ -n "$unformatted" ]; then printf '%s\n' "$unformatted"; exit 1; fi
          make planning-check
          git diff --exit-code
      - name: Reserve disk for native and race builds
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h
      - uses: actions/cache/restore@v4
        id: native
        with:
          path: |
            /tmp/chartworks-native/bruin
            /tmp/chartworks-native/source/pkg/sqlparser/rustffi/target/release/libbruin_rustsqlparser.a
          key: sql-context-native-ubuntu24-go1264-rust1981-5f562c2959496a04d57f5f199f5e3ad22159fa9f-v1
      - name: Build pinned native dependencies
        if: steps.native.outputs.cache-hit != 'true'
        run: bash scripts/build-bruin.sh
      - uses: actions/cache/save@v4
        if: steps.native.outputs.cache-hit != 'true'
        with:
          path: |
            /tmp/chartworks-native/bruin
            /tmp/chartworks-native/source/pkg/sqlparser/rustffi/target/release/libbruin_rustsqlparser.a
          key: sql-context-native-ubuntu24-go1264-rust1981-5f562c2959496a04d57f5f199f5e3ad22159fa9f-v1
      - name: Bind the pinned native build
        run: |
          test -x /tmp/chartworks-native/bruin
          test -s /tmp/chartworks-native/source/pkg/sqlparser/rustffi/target/release/libbruin_rustsqlparser.a
          echo 'CGO_LDFLAGS=-L/tmp/chartworks-native/source/pkg/sqlparser/rustffi/target/release' >> "$GITHUB_ENV"
          echo 'CHARTWORKS_TEST_BRUIN_PATH=/tmp/chartworks-native/bruin' >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v4
        id: incremental
        with:
          path: /home/runner/.cache/go-build
          key: sql-context-race-ubuntu24-go1264-${{ github.sha }}
          restore-keys: |
            sql-context-race-ubuntu24-go1264-
      - name: Semantic, routing, context and generation regressions
        run: |
          set -o pipefail
          go test -race -count=1 -timeout=15m -json ./internal/semantics/... ./internal/nlq... ./internal/exec ./internal/store/postgres ./internal/config ./internal/gateway/... 2>&1 | tee "$RUNNER_TEMP/sql-context-units.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sql-context-units-${{ github.sha }}
          path: ${{ runner.temp }}/sql-context-units.log
          if-no-files-found: warn
          retention-days: 7
      - name: Existing integrated NLQ acceptance
        if: success() || failure()
        run: |
          set -o pipefail
          go test -race -count=1 -timeout=15m -json ./test/acceptance -run '^(TestPhase(05|16|17|18)|TestCW01|TestCW07|TestSQLRecoverySelectedIntentAcceptance|TestSQLRecoveryProviderEnvelope|TestSQLRecoveryCompleteProviderEnvelope|TestSQLRecoveryAnalyticalAcceptance|TestSQLRecoveryAnalyticalOwnedScalarRepair|TestSQLRecoveryAnalyticalGrainAcceptance|TestSQLRecoveryAnalyticalGrainPartitions|TestSQLRecoveryAnalyticalGrainOwnedScalar|TestGatewayAdversarialWire|TestGatewayLocalBounds|TestGatewayConcurrentReuse)$' 2>&1 | tee "$RUNNER_TEMP/sql-context-acceptance.log"
      - name: Validation must not modify source
        if: always()
        run: git diff --exit-code
      - uses: actions/cache/save@v4
        if: always() && steps.incremental.outcome == 'success' && steps.incremental.outputs.cache-hit != 'true'
        with:
          path: /home/runner/.cache/go-build
          key: sql-context-race-ubuntu24-go1264-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sql-context-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/sql-context-*.log
          retention-days: 7
