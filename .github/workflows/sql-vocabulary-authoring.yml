name: SQL vocabulary source checkpoint
on:
  push:
    branches: [codex/sql-semantic-context-recovery]
    paths: [.github/workflows/sql-vocabulary-authoring.yml, '.ci-sql-vocabulary/**']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'hurtener/chartworks'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source objects without committing or moving refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          base='2838b22dc681ce2cdddda911ab11660dc3f91eb6'
          expected='efe82aadcea52d131624da918a405824ae5d2f1d'
          raw=lzma.decompress(b''.join(pathlib.Path(f'.ci-sql-vocabulary/part.{i}').read_bytes() for i in range(4)))
          assert len(raw)==61396
          assert hashlib.sha256(raw).hexdigest()=='38af0ad4d30ed1410ba63430dfb0c884ef9966a5d0de2f5316eba50d863621dd'
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'sql-vocabulary-objects'
          target.mkdir()
          patch=target/'checkpoint.patch'
          patch.write_bytes(raw)
          env=dict(os.environ,GIT_INDEX_FILE=str(target/'verify.index'))
          def git(*args): return subprocess.check_output(['git',*args],env=env,text=True).strip()
          assert git('rev-parse','HEAD^')==base
          subprocess.run(['git','read-tree',base],env=env,check=True)
          subprocess.run(['git','apply','--cached','--check',str(patch)],env=env,check=True)
          subprocess.run(['git','apply','--cached',str(patch)],env=env,check=True)
          subprocess.run(['git','diff','--cached','--check',base],env=env,check=True)
          assert git('write-tree')==expected
          paths=git('diff','--cached','--name-only',base).splitlines()
          assert len(paths)==14 and not any(x.startswith('.ci-sql-vocabulary') or 'sql-vocabulary-authoring' in x for x in paths)
          entries=[]
          for path in paths:
              value=subprocess.check_output(['git','show',':'+path],env=env)
              sha=hashlib.sha1(b'blob '+str(len(value)).encode()+b'\0'+value).hexdigest()
              if path=='.github/workflows/sql-context-recovery.yml':
                  assert sha=='31f5078ae9228ed136e9e0997b4279af194a67df'
              else:
                  assert not path.startswith('.github/')
                  request=urllib.request.Request('https://api.github.com/repos/hurtener/chartworks/git/blobs',data=json.dumps({'encoding':'base64','content':base64.b64encode(value).decode()}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
                  with urllib.request.urlopen(request,timeout=30) as response: result=json.load(response)
                  assert result['sha']==sha
              entries.append({'path':path,'mode':'100644','type':'blob','sha':sha})
          (target/'manifest.json').write_text(json.dumps({'base':base,'tree':expected,'entries':entries},indent=2)+'\n')
          subprocess.run(['git','diff','--exit-code'],check=True)
          print('Verified source objects for tree '+expected+'; no commit or ref updated.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sql-vocabulary-source-objects
          path: ${{ runner.temp }}/sql-vocabulary-objects/manifest.json
          if-no-files-found: warn
          retention-days: 7
