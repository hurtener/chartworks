# Temporary diagnostic branch only; never part of the implementation PR.
name: Phase 29 failed-step diagnostics
on:
  push:
    branches: [dev/phase29-ci-log-diagnostics]
permissions:
  actions: read
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read bounded failed-step windows from existing CI jobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for job in 103592214249 103592219420; do
            gh api "repos/hurtener/chartworks/actions/jobs/$job" > "$RUNNER_TEMP/job-$job.json"
            gh api "repos/hurtener/chartworks/actions/jobs/$job/logs" > "$RUNNER_TEMP/job-$job.log"
          done
          python3 - <<'PY'
          import datetime
          import json
          import os
          import pathlib
          import re

          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          def instant(value):
              return datetime.datetime.fromisoformat(value.replace('Z', '+00:00'))
          for job in (103592214249, 103592219420):
              meta = json.loads((root / f'job-{job}.json').read_text())
              raw = (root / f'job-{job}.log').read_text(encoding='utf-8-sig', errors='replace')
              lines = raw.splitlines()
              for step in meta['steps']:
                  if step.get('conclusion') != 'failure':
                      continue
                  start = instant(step['started_at']) - datetime.timedelta(seconds=1)
                  end = instant(step['completed_at']) + datetime.timedelta(seconds=1)
                  selected = []
                  for line in lines:
                      try:
                          stamp = instant(line.split(' ', 1)[0])
                      except (ValueError, IndexError):
                          continue
                      if start <= stamp <= end:
                          selected.append(re.sub(r'\x1b\[[0-9;]*m', '', line)[:800])
                  # Escape workflow-command syntax in untrusted log text; never
                  # interpret log content as shell, Python, or Actions commands.
                  print(json.dumps({'job': job, 'step': step['name'],
                                    'total_lines': len(selected),
                                    'last_lines': selected[-90:]}, ensure_ascii=True))
          PY
