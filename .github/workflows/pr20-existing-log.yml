name: Existing PR20 failure diagnostics
on:
  push:
    branches: [chore/pr20-coverage-diagnostics]
permissions:
  contents: read
  actions: read
jobs:
  existing-log:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download already-completed job log
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --allow-escape-sequences repos/hurtener/chartworks/actions/jobs/103581067025/logs > /tmp/pr20-failed-job.log
      - name: Extract test and coverage failures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          raw = Path('/tmp/pr20-failed-job.log').read_text(encoding='utf-8-sig')
          lines = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', raw).splitlines()
          pattern = re.compile(r'--- FAIL:|FAIL: coverage|FAIL: internal/|panic: test timed out|WARNING: DATA RACE|FAIL\s+github.com/hurtener/chartworks|coverage unavailable|aggregate wall-clock')
          indices = set()
          for index, line in enumerate(lines):
              if pattern.search(line):
                  indices.update(range(max(0, index - 4), min(len(lines), index + 20)))
          summary = '\n'.join(lines[index] for index in sorted(indices))
          Path('/tmp/pr20-failure-summary.txt').write_text(summary + '\n')
          print(summary if summary else 'No matching failure diagnostic; retain full original log for inspection.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pr20-original-failure-log
          path: |
            /tmp/pr20-failed-job.log
            /tmp/pr20-failure-summary.txt
          retention-days: 3
