name: Phase 30-31 source workspace

on:
  push:
    branches: [feat/phase-30-31-reporting-delivery]
    paths: [.github/workflows/phase-30-31-workspace.yml]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Archive tracked source and history for final review
        run: |
          git rev-parse HEAD > /tmp/chartworks-source-sha.txt
          git rev-parse HEAD^{tree} > /tmp/chartworks-source-tree.txt
          git archive HEAD --format=tar.gz -o /tmp/chartworks-source.tar.gz
          git bundle create /tmp/chartworks-source.bundle HEAD refs/remotes/origin/main
      - uses: actions/upload-artifact@v4
        with:
          name: phase-30-31-source
          path: |
            /tmp/chartworks-source.tar.gz
            /tmp/chartworks-source-sha.txt
            /tmp/chartworks-source-tree.txt
            /tmp/chartworks-source.bundle
          retention-days: 2
