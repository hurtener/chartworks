name: SQL envelope source objects
on:
  push:
    branches: [codex/sql-semantic-context-recovery]
    paths:
      - scripts/sql-envelope/checkpoint.*
      - .github/workflows/sql-envelope-objects.yml
permissions:
  contents: write
jobs:
  objects:
    if: github.repository == 'hurtener/chartworks' && github.actor == 'hurtener' && github.ref == 'refs/heads/codex/sql-semantic-context-recovery'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate exact checkpoint and upload immutable source objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, io, json, os, pathlib, subprocess, urllib.request
          root = pathlib.Path('.')
          text = ''.join((root / ('scripts/sql-envelope/checkpoint.' + str(i))).read_text() for i in (1, 2))
          if len(text) > 1048576:
              raise SystemExit('oversized checkpoint')
          with gzip.GzipFile(fileobj=io.BytesIO(base64.b64decode(text, validate=True))) as stream:
              patch = stream.read(1048577)
          expected = '966205ceb95ae6aae5b7114449279f3f5ca478e9016dda685736f99bea9ea08b'
          if len(patch) != 54484 or hashlib.sha256(patch).hexdigest() != expected:
              raise SystemExit('checkpoint checksum mismatch')
          checkpoint = pathlib.Path(os.environ['RUNNER_TEMP']) / 'envelope.patch'
          checkpoint.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '--index', str(checkpoint)], check=True)
          subprocess.run(['git', 'apply', '--index', str(checkpoint)], check=True)
          fields = subprocess.check_output(['git', 'diff', '--cached', '--raw', '-z', '--no-renames']).decode().split('\0')
          entries = []
          for i in range(0, len(fields) - 1, 2):
              header, path = fields[i:i+2]
              parts = header.split()
              if len(parts) != 5 or parts[1] != '100644' or parts[4] not in ('A', 'M') or not path.startswith(('internal/nlq/', 'internal/nlqexec/', 'internal/gateway/', 'internal/config/', 'docs/')):
                  raise SystemExit('checkpoint path or mode rejected')
              if path.endswith('.go') and subprocess.check_output(['gofmt', '-l', path]).strip():
                  raise SystemExit('checkpoint must be formatted before publication')
              raw = pathlib.Path(path).read_bytes()
              raw.decode('utf-8')
              if len(raw) > 262144:
                  raise SystemExit('source file too large')
              sha = hashlib.sha1(('blob ' + str(len(raw)) + '\0').encode() + raw).hexdigest()
              payload = json.dumps({'content': base64.b64encode(raw).decode(), 'encoding': 'base64'}).encode()
              request = urllib.request.Request('https://api.github.com/repos/hurtener/chartworks/git/blobs', data=payload, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'}, method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  actual = json.load(response)['sha']
              if actual != sha:
                  raise SystemExit('source object hash mismatch')
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': sha})
          if len(entries) != 21:
              raise SystemExit('unexpected checkpoint file count')
          destination = pathlib.Path(os.environ['RUNNER_TEMP']) / 'sql-envelope-objects'
          destination.mkdir()
          (destination / 'manifest.json').write_text(json.dumps({'baseline': 'a56d36a963902d203f86614f95f13645a4aad66f', 'patch_sha256': expected, 'entries': entries}, indent=2) + '\n')
          print('Verified and uploaded', len(entries), 'immutable source objects; no refs changed.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sql-envelope-objects
          path: ${{ runner.temp }}/sql-envelope-objects/
          retention-days: 7
# Temporary authoring transport only. No branch updates or tests of a modified
# checkout. Remove this workflow and payloads in the atomic source commit;
# the separate read-only verification then tests that committed source.
