name: Parameter question boundary checkpoint
on:
  push:
    branches: [codex/sql-semantic-context-recovery]
    paths: [.github/workflows/parameter-question-author.yml]
permissions:
  contents: write
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and publish source objects without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          base='67a7a5e6181f7ab99fbef5676744f7036a240a56'
          wanted='5133b711ebaafaa0d5e37521c7cb493010012b06'
          allowed={'docs/contracts/refinement-parameters-v1.md','internal/nlqexec/refinement_parameters.go','internal/nlqexec/refinement_parameters_test.go','test/acceptance/sql_parameter_continuity_test.go'}
          def git(*args):return subprocess.check_output(['git',*args])
          def api(path,body=None):
              request=urllib.request.Request('https://api.github.com/repos/hurtener/chartworks/'+path,data=None if body is None else json.dumps(body).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(request,timeout=60) as response:return json.load(response)
          assert git('rev-parse','HEAD^').decode().strip()==base
          obj=api('git/blobs/7d3badaae420cd17f7ef589024fe36611642aa5c')
          patch=base64.b64decode(obj['content']).replace(b'\n diff --git ',b'\ndiff --git ')
          assert hashlib.sha256(patch).hexdigest()=='99828bd741cb560867b01cfadcc9d79761d0f876c063cf90c3af9e7949568233'
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'parameter-question'
          out.mkdir()
          target=out/'question-boundary.patch';target.write_bytes(patch)
          subprocess.run(['git','apply','--check','--index',str(target)],check=True)
          subprocess.run(['git','apply','--index',str(target)],check=True)
          subprocess.run(['git','rm','--','.github/workflows/parameter-question-author.yml'],check=True)
          assert git('write-tree').decode().strip()==wanted
          paths=set(git('diff','--cached','--name-only',base).decode().splitlines());assert paths==allowed
          entries=[]
          for path in sorted(paths):
              meta=git('ls-files','--stage','--',path).decode().split()
              raw=git('show',':'+path)
              blob=api('git/blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})
              assert blob['sha']==meta[1]
              entries.append({'path':path,'mode':meta[0],'type':'blob','sha':blob['sha']})
          tree=api('git/trees',{'base_tree':'f3ac38b7d77cf481aaee905cb8ab411d72cd3207','tree':entries})
          assert tree['sha']==wanted
          (out/'manifest.json').write_text(json.dumps({'base':base,'tree':wanted,'entries':entries},indent=2)+'\n')
          print('Verified exact question-boundary tree',wanted)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: parameter-question-source
          path: ${{ runner.temp }}/parameter-question/
          retention-days: 7
