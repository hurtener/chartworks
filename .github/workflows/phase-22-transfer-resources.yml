name: Phase 22 resource fix transfer
on:
  push:
    branches: [feat/phase-22-mcp-server]
    paths: [.github/workflows/phase-22-transfer-resources.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-22-mcp-server
          fetch-depth: 2
      - name: Apply the exact locally reviewed patch and remove this transfer
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = fb2b3998386a2120be0bb600754487256311b43d
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib
          encoded = ''''''
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'd395aa8f27cf9a75c769dc4ac67c5b521dfd3d7dcad713dc914f0dd863cba2ca'
          pathlib.Path('/tmp/phase22.patch').write_bytes(patch)
          PY
          git apply --check /tmp/phase22.patch
          git apply /tmp/phase22.patch
          rm .github/workflows/phase-22-transfer-resources.yml
          git diff --check
          git add docs/contracts/mcp-v1.md docs/reviews/phase-22-adversarial.md internal/mcpserver/resource_id_test.go internal/mcpserver/resources.go internal/sourceapi/mcp.go internal/topicapi/mcp.go test/acceptance/phase21_test.go test/acceptance/phase22_test.go .github/workflows/phase-22-transfer-resources.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(mcp): preserve canonical resource IDs through SDK templates'
          git push origin HEAD:refs/heads/feat/phase-22-mcp-server
