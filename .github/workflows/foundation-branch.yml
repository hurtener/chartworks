name: Foundation branch verification
on:
  push:
    branches: [feat/phase-01-02-foundation]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: chartworks
          POSTGRES_PASSWORD: chartworks
          POSTGRES_DB: chartworks
        ports: [5434:5432]
        options: >-
          --health-cmd "pg_isready -U chartworks -d chartworks"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CHARTWORKS_TEST_STORE_URL: postgres://chartworks:chartworks@localhost:5434/chartworks?sslmode=disable
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: true
      - name: PostgreSQL 17 client tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version
      - name: Normalize source and dependency lock before review
        run: |
          for f in scripts/_foundation_edits*.py; do
            [ -f "$f" ] || continue
            python3 "$f"
            git rm "$f"
          done
          go mod tidy
          find cmd internal test -name '*.go' -print0 | xargs -0 gofmt -w
          git add go.mod go.sum cmd internal test docs/plans
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: normalize reviewed foundation source and dependency lock'
            git push origin HEAD:feat/phase-01-02-foundation
          fi
          echo "TESTED_COMMIT=$(git rev-parse HEAD)"
      - name: Compile, vet and real database race tests
        run: |
          CGO_ENABLED=0 go build ./...
          go vet ./...
          go test -race -count=1 -timeout=10m -coverpkg=./internal/...,./cmd/... -coverprofile=/tmp/foundation-coverage.out ./...
          go tool cover -func=/tmp/foundation-coverage.out
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/run_phase_acceptance.py --phase 01
          python3 scripts/run_phase_acceptance.py --phase 02
      - name: Coverage diagnostics
        if: always()
        run: |
          if [ -f /tmp/foundation-coverage.out ]; then go tool cover -func=/tmp/foundation-coverage.out; fi
      - name: Benchmarks
        run: go test ./test/acceptance -run '^$' -bench 'Benchmark(ConfigurationStartup|IdleHealth)$' -benchmem -benchtime=100x
      - name: Lint
        if: always()
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
