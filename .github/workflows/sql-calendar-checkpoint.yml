name: SQL calendar checkpoint
on:
  push:
    branches: [codex/sql-semantic-context-recovery]
    paths: [.github/workflows/sql-calendar-checkpoint.yml]
permissions:
  contents: write
jobs:
  checkpoint:
    if: github.repository == 'hurtener/chartworks' && github.actor == 'hurtener' && github.ref == 'refs/heads/codex/sql-semantic-context-recovery'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: false
      - name: Commit current-authoring fixture corrections
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('test/acceptance/sql_analytical_grain_test.go')
          s=p.read_text()
          old='Version != readexec.AnalyticalGrainVersion'
          assert s.count(old)==1
          p.write_text(s.replace(old,'Version != readexec.AnalyticalCalendarVersion'))
          p=Path('test/acceptance/sql_analytical_calendar_test.go')
          s=p.read_text()
          assert s.count('result *readexec.Result')==1
          assert s.count('values(t, r.Execution.Result)')==2
          s=s.replace('result *readexec.Result','result nlqexec.RunResult').replace('range result.Rows','range result.Execution.Result.Rows').replace('values(t, r.Execution.Result)','values(t, r)')
          p.write_text(s)
          PY
          gofmt -w test/acceptance/sql_analytical_grain_test.go test/acceptance/sql_analytical_calendar_test.go
          git add test/acceptance/sql_analytical_grain_test.go test/acceptance/sql_analytical_calendar_test.go
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(nlq): preserve old proof fixtures and inspect canonical run results'
          git push origin HEAD:refs/heads/codex/sql-semantic-context-recovery
# Temporary authoring only; removed before the delivered committed-source gate.
