name: CW03 reporting contract validation

on:
  push:
    branches: [feat/cw-03-reporting-output-policy]
    paths: ['.github/workflows/cw03-validation.yml']
  pull_request:
    paths:
      - 'internal/reporting/**'
      - 'internal/exec/**'
      - 'internal/store/postgres/**'
      - 'test/acceptance/cw03*'
      - 'web/report-viewer/**'
      - '.github/workflows/cw03-validation.yml'

permissions:
  contents: read

jobs:
  reporting:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CGO_ENABLED: '1'
      GOFLAGS: '-p=2'
      CHARTWORKS_BRUIN_BUILD_DIR: /tmp/chartworks-bruin
      CHARTWORKS_BRUIN_BIN: /tmp/chartworks-bruin/bruin
      CHARTWORKS_TEST_BRUIN_PATH: /tmp/chartworks-bruin/bruin
      CGO_LDFLAGS: -L/tmp/chartworks-bruin/source/pkg/sqlparser/rustffi/target/release
      CHARTWORKS_TEST_STORE_URL: postgres://chartworks:chartworks@localhost:5434/chartworks?sslmode=disable
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        ports: [5434:5432]
        env:
          POSTGRES_USER: chartworks
          POSTGRES_PASSWORD: chartworks
          POSTGRES_DB: chartworks
        options: >-
          --health-cmd "pg_isready -U chartworks -d chartworks"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Exact committed source and planning
        run: |
          set -euo pipefail
          echo "TESTED_COMMIT=$(git rev-parse HEAD)"
          go version
          node --version
          go mod verify
          make planning-check check-mirror
      - uses: actions/cache/restore@v4
        id: native
        with:
          path: |
            /tmp/chartworks-bruin/bruin
            /tmp/chartworks-bruin/source/pkg/sqlparser/rustffi/target/release/libbruin_rustsqlparser.a
          key: chartworks-native-ubuntu24-go1264-rust1981-5f562c2959496a04d57f5f199f5e3ad22159fa9f
      - name: Build pinned native dependencies
        if: steps.native.outputs.cache-hit != 'true'
        run: bash scripts/build-bruin.sh
      - uses: actions/cache/restore@v4
        with:
          path: /home/runner/.cache/go-build
          key: cw03-output-policy-ubuntu24-go1264-${{ github.sha }}
          restore-keys: |
            cw03-output-policy-ubuntu24-go1264-
            cw03-ubuntu24-go1264-
            reporting-ubuntu24-go1264-
            phase30-31-ubuntu24-go1264-
      - name: Domain, persistence, API and client regression tests
        run: |
          set -o pipefail
          go test -count=1 -timeout=10m ./internal/exec ./internal/semantics/... ./internal/reporting ./internal/reportingapi ./internal/store/postgres ./sdk/chartworks ./web/report-viewer 2>&1 | tee /tmp/cw03-domain.log
      - name: Real reporting boundary acceptance
        if: always()
        run: |
          set -o pipefail
          go test -count=1 -v -timeout=12m ./test/acceptance -run '^(TestPhase(27|28|29|30|31)|TestCW03)$' 2>&1 | tee /tmp/cw03-acceptance.log
      - name: Verify no source mutation
        if: always()
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cw03-validation-${{ github.sha }}
          path: /tmp/cw03-*.log
          retention-days: 7
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: /home/runner/.cache/go-build
          key: cw03-output-policy-ubuntu24-go1264-${{ github.sha }}
