name: Apply reviewed dependency fence
on:
  push:
    branches: [feat/phase-30-31-reporting-delivery]
    paths: [.github/workflows/reporting-review-patch.yml]
permissions:
  contents: write
concurrency:
  group: reporting-review-patch
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'hurtener/chartworks' && github.ref == 'refs/heads/feat/phase-30-31-reporting-delivery'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: false
      - name: Apply exact semantic and source fencing changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          changes = [
            ('internal/store/postgres/compositions_admission.go',
             '\t// Locks protect archive eligibility until the manifest is sealed. Exact\n\t// revisions remain usable when a different revision is published meanwhile.',
             '\t// Locks protect current eligibility through admission or checkpoint\n\t// publication. Exact document revisions never float on retry.'),
            ('internal/store/postgres/compositions_admission.go',
             '\tfor _, group := range m.Groups {\n\t\tif group.Kind != "block" {\n\t\t\tcontinue\n\t\t}',
             '\t// Aggregate dependency pins across every group so the shared fence\n'
             '\t// acquires all sorted topic locks before any source locks. Dynamic\n'
             '\t// groups need the same current-source checks as frozen blocks.\n'
             '\tcurrent := reporting.Mutation{}\n'
             '\tfor _, group := range m.Groups {\n'
             '\t\tif group.Kind == "query" {\n'
             '\t\t\tif group.Origin == nil || len(group.Origin.Topics) == 0 || !group.Binding.Valid() ||\n'
             '\t\t\t\tgroup.Binding.Tenant != e.Tenant() || group.Origin.Source != group.Binding.Source || group.Origin.Context != group.Binding.Context {\n'
             '\t\t\t\treturn store.ErrInvalid\n\t\t\t}\n'
             '\t\t\tcurrent.Topics = append(current.Topics, group.Origin.Topics...)\n'
             '\t\t\tcurrent.Watch = append(current.Watch, reporting.Dependency{Source: group.Binding.Source, Context: group.Binding.Context, SourceRevision: group.Binding.Revision})\n'
             '\t\t\tcontinue\n\t\t}\n'
             '\t\tif group.Kind != "block" {\n\t\t\treturn store.ErrInvalid\n\t\t}'),
            ('internal/store/postgres/compositions_admission.go',
             '\t\tif err := reporting.CheckCompositionBlock(e, group, block); err != nil {\n\t\t\treturn err\n\t\t}\n\t}\n\treturn nil\n}',
             '\t\tif err := reporting.CheckCompositionBlock(e, group, block); err != nil {\n\t\t\treturn err\n\t\t}\n'
             '\t\tcurrent.Topics = append(current.Topics, block.Revision.Definition.Topics...)\n'
             '\t\tcurrent.Watch = append(current.Watch, block.Validation.Dependencies...)\n\t}\n'
             '\tif len(m.Groups) != 0 {\n\t\treturn blockCurrentFence(ctx, tx, e, current)\n\t}\n\treturn nil\n}'),
            ('test/acceptance/phase30_test.go',
             '\t\tt.Run("publication-current-eligibility", TestPhase30AdversarialPublicationBoundary)',
             '\t\tt.Run("publication-current-eligibility", TestPhase30AdversarialPublicationBoundary)\n'
             '\t\tt.Run("dynamic-current-dependencies", TestPhase30AdversarialDynamicDependencies)'),
            ('test/acceptance/phase30_adversarial_checkpoint_test.go',
             '[]string{"unchanged", "archive-report", "withdraw-child-certification"}',
             '[]string{"unchanged", "archive-report", "withdraw-child-certification", "archive-topic", "delete-source"}'),
            ('test/acceptance/phase30_adversarial_checkpoint_test.go',
             '\t\t\t\tswitch change {\n\t\t\t\tcase "archive-report":',
             '\t\t\t\tswitch change {\n\t\t\t\tcase "archive-topic", "delete-source":\n'
             '\t\t\t\t\tphase30WithdrawDependency(t, f, change)\n\t\t\t\tcase "archive-report":'),
          ]
          for name, old, new in changes:
            p=Path(name); text=p.read_text()
            if text.count(old)!=1: raise RuntimeError('Refuse unexpected source: '+name)
            p.write_text(text.replace(old,new))
          files=sorted({x[0] for x in changes}|{'test/acceptance/phase30_adversarial_dynamic_test.go'})
          subprocess.run(['gofmt','-w',*files],check=True)
          Path('.github/workflows/reporting-review-patch.yml').unlink()
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','diff','--stat'],check=True)
          subprocess.run(['git','diff','--','internal/store/postgres/compositions_admission.go'],check=True)
          PY
      - name: Publish exact branch delta and remove this one-use workflow
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),cp=require('child_process');
            const owner='hurtener',repo='chartworks',ref='heads/feat/phase-30-31-reporting-delivery';
            const base=cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
            const allowed=new Set(['internal/store/postgres/compositions_admission.go','test/acceptance/phase30_test.go','test/acceptance/phase30_adversarial_checkpoint_test.go','test/acceptance/phase30_adversarial_dynamic_test.go','.github/workflows/reporting-review-patch.yml']);
            const paths=cp.execFileSync('git',['diff','--name-only','-z'],{encoding:'utf8'}).split('\0').filter(Boolean);
            if(!paths.length||paths.some(p=>!allowed.has(p)))throw new Error('Unexpected patch paths');
            const current=await github.rest.git.getRef({owner,repo,ref});
            if(current.data.object.sha!==base)throw new Error('Concurrent branch move; refuse overwrite');
            const parent=await github.rest.git.getCommit({owner,repo,commit_sha:base});
            const tree=[];
            for(const path of paths){
              if(!fs.existsSync(path)){tree.push({path,mode:'100644',type:'blob',sha:null});continue;}
              const blob=await github.rest.git.createBlob({owner,repo,content:fs.readFileSync(path).toString('base64'),encoding:'base64'});
              tree.push({path,mode:'100644',type:'blob',sha:blob.data.sha});
            }
            const next=await github.rest.git.createTree({owner,repo,base_tree:parent.data.tree.sha,tree});
            const commit=await github.rest.git.createCommit({owner,repo,message:'fix(reporting): fence accepted semantic and source pins through composition publication',tree:next.data.sha,parents:[base]});
            await github.rest.git.updateRef({owner,repo,ref,sha:commit.data.sha,force:false});
            core.info('PATCHED_COMMIT='+commit.data.sha);
