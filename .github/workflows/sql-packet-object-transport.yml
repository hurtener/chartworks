name: SQL packet object transport
on:
  push:
    branches: [codex/sql-semantic-context-recovery]
    paths: [.github/workflows/sql-packet-object-transport.yml]
permissions:
  contents: write
jobs:
  objects:
    if: github.repository == 'hurtener/chartworks' && github.actor == 'hurtener' && github.ref == 'refs/heads/codex/sql-semantic-context-recovery'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify and store immutable source objects only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess, urllib.request
          def git(*args):
              return subprocess.check_output(['git', *args]).decode().strip()
          def api(path, data=None):
              request = urllib.request.Request('https://api.github.com/repos/hurtener/chartworks/git/'+path,
                  data=None if data is None else json.dumps(data).encode(),
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json', 'Content-Type':'application/json'},
                  method='GET' if data is None else 'POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          expected = {
            '.github/workflows/sql-context-recovery.yml':'b28e0e0456e4e3749c3b3cf4a5b4a7c6f150fc6c',
            'docs/plans/phase-17-nlq-routing-context.md':'5be1fe72f90946262b0a660d7306b8d23c62dcfa',
            'docs/plans/phase-18-nlq-generation-execution.md':'2d959044488f1ec6b517b2fc924b64eef4fe8bd9',
            'docs/reviews/sql-context-recovery.md':'f726c16933b3005a98220c8d4f5aecc05c1e600d',
            'internal/gateway/bifrost/engine.go':'9a2c44a57255d7ec5443f7fdc4d4da598fd58256',
            'internal/nlq/context.go':'b2b1f1090f413111084fabc3a9bb87a97e9969b1',
            'internal/nlq/generation_fit.go':'3544e874571e96b533a07025685deeba3d63981c',
            'internal/nlqexec/service.go':'923aa8b7ddbdafbc3709c8e926465f7efad180ea',
            'internal/nlqexec/types.go':'d42e1909f48982f3f9db9ad63824901bd7aa1362',
            'internal/nlqexec/validation_repair.go':'797c5e1c541b3831a6e8a74c1370a8d67a345278',
          }
          for path, sha in expected.items():
              assert git('hash-object',path) == sha, path
          permitted_new = {
            'internal/nlq/prompt_projection.go', 'internal/nlq/prompt_projection_test.go',
            'internal/nlqexec/generation_examples.go', 'internal/nlqexec/generation_examples_test.go',
            'internal/nlqroute/prompt_projection_test.go', 'test/acceptance/sql_generation_packet_test.go',
            'docs/contracts/generation-packet-v2.md',
          }
          tree = api('trees/9583b37e436f0131d4919362620016e993b4da5f?recursive=1')
          blobs = [v for v in tree['tree'] if v['type']=='blob']
          assert not tree['truncated'] and {v['path'] for v in blobs} == permitted_new
          for item in blobs:
              assert item['mode']=='100644' and item['size'] < 32768
              target = pathlib.Path(item['path'])
              assert not target.exists()
              blob = api('blobs/'+item['sha'])
              assert blob['encoding']=='base64'
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(base64.b64decode(blob['content']))
              assert git('hash-object',str(target))==item['sha']
          def edit(path, old, new, count=1):
              file=pathlib.Path(path); text=file.read_text()
              assert text.count(old)==count, (path,old,text.count(old))
              file.write_text(text.replace(old,new))
          edit('internal/nlq/context.go','renderRelations(input.Relations)','renderPromptRelations(input)',2)
          edit('internal/nlq/context.go','renderRelations(output.Relations)','renderPromptRelations(outputInput(output))')
          edit('internal/nlq/context.go','\t\tout.Constraints = state\n\t}\n\treturn out, nil','\t\tout.Constraints = state\n\t}\n\tif _, _, err := promptRelations(out); err != nil {\n\t\treturn ContextInput{}, err\n\t}\n\treturn out, nil')
          edit('internal/nlqexec/service.go','s.selectLearnedInstructions(ctx, e, admitted, question.Question, question.Rerank, call, budget)','s.selectGenerationExamples(ctx, e, admitted, question, call, budget)')
          old='\tcandidate, fixes, receipt, validated, err := s.generateAndValidate(ctx, e, admitted, generation, call, budget, "")'
          edit('internal/nlqexec/service.go',old,'\tselection.Usage = actualExampleUsage(selection, generation)\n'+old)
          old='\tSchemaVersion  int                `json:"schema_version,omitempty"`\n\tPolicyVersion'
          edit('internal/nlqexec/types.go',old,'\tUsage          *ExamplePromptUsage `json:"usage,omitempty"`\n'+old)
          old='\tfor i, parameter := range unbound.Parameters {'
          edit('internal/nlqexec/validation_repair.go',old,'\t// Demonstrations are optional strategy material, not instructions to copy\n\t// inside the repair edit packet. Required semantics stay in Context.\n\tif original.Strategy == nlq.GenerationExamples {\n\t\tpacket.Instructions = nil\n\t}\n'+old)
          old='\tmodel, system, configurationDigest := gateway.ApplyRuntimeConfig(ctx, name, r.Model, system)\n'
          edit('internal/gateway/bifrost/engine.go',old,old+'\t// The effective reviewed system instruction is part of the actual input.\n\t// Check again after applying it, before admission or provider reservation.\n\tif len(prompt)+len(system)+len(schema.Document()) > e.cfg.Limits.MaxInputBytes {\n\t\treturn out, gateway.ErrInput\n\t}\n')
          edit('.github/workflows/sql-context-recovery.yml','      - internal/exec/**','      - internal/exec/**\n      - internal/gateway/**')
          edit('.github/workflows/sql-context-recovery.yml','TestSQLRecoverySelectedIntentAcceptance)$','TestSQLRecoverySelectedIntentAcceptance|TestSQLRecoveryProviderEnvelope)$')
          edit('docs/reviews/sql-context-recovery.md','| AP-02 | Relevant typed prompt projection, examples and complete-request budget | Pending |','| AP-02 | Relevant typed prompt projection, examples and complete-request budget | Selected single-topic physical rendering, strategy-aware optional fitting, example usage and runtime byte recheck implemented; model-specific full-envelope fitting pending |')
          review='''

          ## AP-02 initial packet checkpoint (SQL-03/04/05)

          [Generation packet v2](../contracts/generation-packet-v2.md) specifies the scoped
          render-only selected projection, one example lane, precedence-aware fitting and
          actual usage metadata. Native authority still checks the full reviewed relations.
          Normal free-text route tests add twenty unrelated hundred-column relations while
          requiring the same prompt and exact selected dependency content. Missing/foreign
          column coordinates fail, and legacy/unselected shapes retain their rendering.

          New regressions cover ranked example order, edit/hint suppression, deduplication,
          whole optional-group pruning, mandatory preservation, oversized demonstration
          fallback, detached usage receipts, zero irrelevant learned-example selection and
          repair without nested suppressed demonstrations. A recorded Bifrost wire test
          checks runtime instructions/model/schema/output ceiling and rejection before any
          provider call when the effective system addition exceeds the byte ceiling.

          The added `fit`/`usage` evidence is optional on retained legacy JSON: absence is
          unknown, not zero. Final provider-window allocation, broader root coverage and
          live owner-cohort comparison are not completed by this slice. No frozen query,
          report refresh, semantic publication or signed authority policy changes.
          '''
          file=pathlib.Path('docs/reviews/sql-context-recovery.md'); file.write_text(file.read_text()+review)
          phase='''

          ## SQL recovery: strategy-aware generation packet

          The [generation packet v2](../contracts/generation-packet-v2.md) initial AP-02
          slice keeps complete reviewed relation scope for validation and persistence while
          rendering selected single-topic metric dependency columns for the model. Required
          semantics remain atomic. Edits/hints suppress typed examples and skip irrelevant
          learning work; included demonstrations preserve declared rank and have actual-use
          evidence. Optional context yields before required instructions. Runtime system
          additions are byte-checked again before dispatch. Full model-specific provider
          window fitting and live quality qualification remain pending; frozen refresh
          and native authority/SQL validation are unchanged.
          '''
          for name in ('phase-17-nlq-routing-context.md','phase-18-nlq-generation-execution.md'):
              file=pathlib.Path('docs/plans')/name; file.write_text(file.read_text()+phase)
          paths=sorted(set(expected)|permitted_new)
          for path in paths:
              if path.endswith('.go'):
                  subprocess.run(['gofmt','-w',path],check=True)
          subprocess.run(['git','add','--',*paths],check=True)
          transport='.github/workflows/sql-packet-object-transport.yml'
          subprocess.run(['git','rm','--cached',transport],check=True)
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'packet-objects'; out.mkdir()
          computed=git('write-tree')
          (out/'local-hashes.json').write_text(json.dumps({path:git('hash-object',path) for path in paths},indent=2))
          assert computed=='343c4228fc975e5dccb98da261571fd7cb38a827', computed
          entries=[]
          for path in paths:
              result=api('blobs',{'content':pathlib.Path(path).read_text(),'encoding':'utf-8'})
              assert result['sha']==git('hash-object',path)
              entries.append({'path':path,'mode':'100644','type':'blob','sha':result['sha']})
          entries.append({'path':transport,'mode':'100644','type':'blob','sha':None})
          (out/'manifest.json').write_text(json.dumps({'source_sha':os.environ['GITHUB_SHA'],'tree_sha':computed,'entries':entries},indent=2))
          print('Verified exact immutable source objects; no ref was modified.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packet-source-objects
          path: ${{ runner.temp }}/packet-objects/
          retention-days: 7
# Temporary authoring transport only. No validation runs on the changed worktree;
# the connector publishes the exact source and removes this file before tests.
