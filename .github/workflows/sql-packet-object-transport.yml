name: SQL packet object transport
on:
  push:
    branches: [codex/sql-semantic-context-recovery]
    paths: [.github/workflows/sql-packet-object-transport.yml]
permissions:
  contents: write
jobs:
  objects:
    if: github.repository == 'hurtener/chartworks' && github.actor == 'hurtener'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Validate exact patch and store immutable objects only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, io, json, os, pathlib, subprocess, urllib.request
          def git(*args):
              return subprocess.check_output(['git', *args]).decode().strip()
          assert git('rev-parse', 'HEAD^') == 'ffac65cfbab0daa3c99e08fc7687b53c5c463497'
          encoded = '''  '''
          encoded = ''.join(encoded.split())
          assert len(encoded) < 32768
          with gzip.GzipFile(fileobj=io.BytesIO(base64.b64decode(encoded, validate=True))) as f:
              patch = f.read(1048577)
          assert len(patch) < 1048576 and hashlib.sha256(patch).hexdigest() == 'c698b611f564e3484a083c817d398c480df34cd6502542a0cb90ae3dbe5c7d60'
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'packet.patch'
          target.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '--index', str(target)], check=True)
          subprocess.run(['git', 'apply', '--index', str(target)], check=True)
          paths = git('diff', '--cached', '--name-only').splitlines()
          assert len(paths) == 17
          for path in paths:
              assert path.startswith(('internal/nlq/', 'internal/nlqexec/', 'internal/nlqroute/', 'docs/')) or path in ('internal/gateway/bifrost/engine.go', 'test/acceptance/sql_generation_packet_test.go', '.github/workflows/sql-context-recovery.yml')
              assert git('ls-files', '-s', '--', path).startswith('100644 ')
          transport = '.github/workflows/sql-packet-object-transport.yml'
          subprocess.run(['git', 'rm', '--cached', transport], check=True)
          assert git('write-tree') == '343c4228fc975e5dccb98da261571fd7cb38a827'
          entries = []
          for path in paths:
              content = pathlib.Path(path).read_text()
              data = json.dumps({'content':content, 'encoding':'utf-8'}).encode()
              req = urllib.request.Request('https://api.github.com/repos/hurtener/chartworks/git/blobs', data=data, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json', 'Content-Type':'application/json'}, method='POST')
              with urllib.request.urlopen(req, timeout=30) as response:
                  result = json.load(response)
              assert result['sha'] == git('hash-object', path)
              entries.append({'path':path, 'mode':'100644', 'type':'blob', 'sha':result['sha']})
          entries.append({'path':transport,'mode':'100644','type':'blob','sha':None})
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'packet-objects'
          out.mkdir()
          (out/'manifest.json').write_text(json.dumps({'source_sha':os.environ['GITHUB_SHA'],'tree_sha':git('write-tree'),'entries':entries}, indent=2))
          print('Verified immutable source objects; no branch ref was modified.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: packet-source-objects
          path: ${{ runner.temp }}/packet-objects/manifest.json
          retention-days: 7
# Temporary transport only: no tests run against a patched worktree and no ref
# is written. The connector publishes the verified tree and removes this file.
