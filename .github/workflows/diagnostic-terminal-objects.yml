name: Prepare joined-terminal correction
on:
  push:
    branches: [codex/sql-semantic-context-recovery]
    paths: [.github/workflows/diagnostic-terminal-objects.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3ccf965d097776f39bb441698702a651e9eb3798
          persist-credentials: false
      - name: Check patch and prepare immutable source objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,json,os,pathlib,subprocess,urllib.request
          api='https://api.github.com/repos/hurtener/chartworks/git/'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          def request(path,body=None):
              r=urllib.request.Request(api+path,headers=headers,data=json.dumps(body).encode() if body is not None else None,method='POST' if body is not None else 'GET')
              with urllib.request.urlopen(r,timeout=30) as response:return json.load(response)
          sha='2dea835eb81b78068ff6473382530ebfa4b35ccf'
          data=base64.b64decode(request('blobs/'+sha)['content'])
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
          patch=gzip.decompress(data)
          assert hashlib.sha256(patch).hexdigest()=='c53679be13df8265339f4823078edfdeaac92918568827581ea9b4875a44637e'
          pathlib.Path('/tmp/correction.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','--index','/tmp/correction.patch'],check=True)
          subprocess.run(['git','apply','--index','/tmp/correction.patch'],check=True)
          expected='85563f945f6dc29f14e3111f72ce8bce812c09f8'
          assert subprocess.check_output(['git','write-tree'],text=True).strip()==expected
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert paths==['internal/exec/query_rejection.go','internal/exec/query_rejection_test.go','internal/nlqexec/query_diagnostics_test.go','internal/nlqexec/service.go','internal/nlqexec/validation_repair.go']
          entries=[]
          for path in paths:
              raw=pathlib.Path(path).read_bytes()
              sha=request('blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})['sha']
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha
              entries.append({'path':path,'mode':'100644','type':'blob','sha':sha})
          tree=request('trees',{'base_tree':'d43b89ef663f6b28162f988e81f8d33394f32d6c','tree':entries})['sha']
          assert tree==expected
          print('VERIFIED_SOURCE_TREE='+tree)
          PY
