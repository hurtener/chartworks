name: Phase 19 recovery
on:
  push:
    branches: [dev/phase19-sync]
    paths: [.github/workflows/phase19-recovery.yml]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c8c17906f851c770e9cd0d5fef50706f28fc8f97
          fetch-depth: 0
          persist-credentials: false
      - run: |
          test "$(git rev-parse HEAD)" = c8c17906f851c770e9cd0d5fef50706f28fc8f97
          git bundle create /tmp/chartworks-phase19.bundle HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: phase19-recovered-source
          path: /tmp/chartworks-phase19.bundle
          retention-days: 1
