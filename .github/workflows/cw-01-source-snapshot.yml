name: CW-01 source snapshot

on:
  push:
    branches: [feat/cw-01-conditional-typed-clarification]
    paths: ['.github/workflows/cw-01-source-snapshot.yml']

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: false
      - name: Archive only tracked source and pinned toolchain
        run: |
          mkdir -p /tmp/cw01-source /tmp/cw01-go /tmp/cw01-modules
          git rev-parse HEAD > /tmp/cw01-source/HEAD.txt
          git archive --format=tar.gz --output=/tmp/cw01-source/source.tar.gz HEAD
          tar -czf /tmp/cw01-go/go.tar.gz -C "$(go env GOROOT)" .
          sha256sum /tmp/cw01-source/source.tar.gz > /tmp/cw01-source/SHA256SUMS
          sha256sum /tmp/cw01-go/go.tar.gz > /tmp/cw01-go/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: cw01-source-${{ github.sha }}
          path: /tmp/cw01-source
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: cw01-go-1.26.4
          path: /tmp/cw01-go
          retention-days: 3
      - name: Download checksum-verified module inputs
        run: |
          go mod download
          git diff --exit-code
          tar -czf /tmp/cw01-modules/modules.tar.gz -C "$(go env GOPATH)/pkg/mod/cache" download
          sha256sum /tmp/cw01-modules/modules.tar.gz > /tmp/cw01-modules/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: cw01-module-inputs-${{ github.sha }}
          path: /tmp/cw01-modules
          retention-days: 3
