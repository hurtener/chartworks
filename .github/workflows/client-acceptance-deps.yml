name: Client acceptance dependencies
on:
  push:
    branches: [dev/phase-22-23-workspace]
    paths: [.github/workflows/client-acceptance-deps.yml]
permissions:
  contents: read
jobs:
  deps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: false
      - name: Retain only dependency delta beyond the existing client workspace
        run: |
          go list -deps ./sdk/chartworks ./internal/mcpserver ./internal/chartapi ./internal/config ./internal/api >/dev/null
          python3 - <<'PY'
          import json, pathlib, subprocess
          root = pathlib.Path(subprocess.check_output(['go', 'env', 'GOMODCACHE'], text=True).strip())
          pathlib.Path('/tmp/before.json').write_text(json.dumps([str(p.relative_to(root)) for p in root.rglob('*') if p.is_file()]))
          PY
          go list -deps -test ./test/acceptance ./... >/dev/null
          python3 - <<'PY'
          import json, pathlib, subprocess, tarfile
          root = pathlib.Path(subprocess.check_output(['go', 'env', 'GOMODCACHE'], text=True).strip())
          before = set(json.loads(pathlib.Path('/tmp/before.json').read_text()))
          with tarfile.open('/tmp/acceptance-deps.tar.gz', 'w:gz') as archive:
              for p in root.rglob('*'):
                  rel = str(p.relative_to(root))
                  if p.is_file() and rel not in before:
                      archive.add(p, arcname=rel, recursive=False)
          PY
      - name: Recover the existing pinned CI linter
        run: curl --fail --location --output /tmp/golangci-lint.tar.gz https://github.com/golangci/golangci-lint/releases/download/v2.12.2/golangci-lint-2.12.2-linux-amd64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: client-acceptance-deps
          path: |
            /tmp/acceptance-deps.tar.gz
            /tmp/golangci-lint.tar.gz
          retention-days: 3
