name: Prepare grouping review objects
on:
  push:
    branches: [codex/sql-semantic-context-recovery]
    paths: [.github/workflows/sql-grouping-review-objects.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4c3485d572eb92ef880b1ef97785fb530e99dc9e
          persist-credentials: false
      - name: Verify reviewed patch and source objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,base64,gzip,hashlib,pathlib,subprocess,urllib.request
          base='https://api.github.com/repos/hurtener/chartworks/git/'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          def req(path,body=None):
            request=urllib.request.Request(base+path,data=json.dumps(body).encode() if body is not None else None,headers=headers,method='POST' if body is not None else 'GET')
            with urllib.request.urlopen(request,timeout=30) as response:return json.load(response)
          chunks=['bcf9bb930f2272fb790081401eabeea3223b87eb','5cb343fe787dc31a061029ae0d91cba56ed3b089','649a210b02db7fb2e6f0f60cd85698e6bfdd2dce','d841c4dd5fe74e0b7a0a3fc05e535baebcf4e28d']
          data=b''
          for sha in chunks:
            raw=base64.b64decode(req('blobs/'+sha)['content'])
            assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha
            data+=raw
          patch=gzip.decompress(data)
          assert hashlib.sha256(patch).hexdigest()=='3bf4851efc930b48f87be199aca0a44763c34330b9db2fc763bee5e679148393'
          pathlib.Path('/tmp/grouping-review.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','--index','/tmp/grouping-review.patch'],check=True)
          subprocess.run(['git','apply','--index','/tmp/grouping-review.patch'],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree=='bddce7fc2a51c452674eb90c5250d551b3f300a9'
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert paths==['.github/workflows/sql-context-recovery.yml','docs/contracts/grouping-continuity-v1.md','internal/nlqexec/grouping_continuation.go','internal/nlqexec/grouping_continuation_test.go','test/acceptance/sql_grouping_continuation_test.go']
          entries=[]
          for path in paths:
            raw=pathlib.Path(path).read_bytes()
            sha=req('blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})['sha']
            assert sha==hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
            entries.append({'path':path,'mode':'100644','type':'blob','sha':sha})
          manifest={'base_commit':'4c3485d572eb92ef880b1ef97785fb530e99dc9e','base_tree':'65180eb6f7c7482655db9de54b8f12c7168ffb33','tree':tree,'entries':entries}
          pathlib.Path('/tmp/grouping-review-objects.json').write_text(json.dumps(manifest,indent=2))
          print(json.dumps(manifest))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: grouping-review-objects
          path: /tmp/grouping-review-objects.json
          retention-days: 7
