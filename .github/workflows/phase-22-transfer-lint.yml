name: Phase 22 lint fix transfer
on:
  push:
    branches: [feat/phase-22-mcp-server]
    paths: [.github/workflows/phase-22-transfer-lint.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-22-mcp-server
          fetch-depth: 2
      - name: Apply the reviewed source delta and remove the transfer
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 96c4bbafcb9b069c18980fd0fb6c2b315259e37d
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib
          encoded = ''''''
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '7808c8f04935c7de85518f6621e73ff8f7fa37b79a1e184e51716cfead509901'
          pathlib.Path('/tmp/phase22-lint.patch').write_bytes(patch)
          PY
          git apply --check /tmp/phase22-lint.patch
          git apply /tmp/phase22-lint.patch
          rm .github/workflows/phase-22-transfer-lint.yml
          git diff --check
          git add internal/mcpserver/server.go internal/mcpserver/adversarial_test.go .github/workflows/phase-22-transfer-lint.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(mcp): use discard handler and explicit absent-context fixtures'
          git push origin HEAD:refs/heads/feat/phase-22-mcp-server
