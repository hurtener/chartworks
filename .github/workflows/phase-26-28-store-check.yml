name: Phase 26-28 persistent-domain verification
on:
  push:
    branches: [dev/phase-26-28-workspace]
    paths: [.github/workflows/phase-26-28-store-check.yml]
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        env:
          POSTGRES_USER: chartworks
          POSTGRES_PASSWORD: chartworks
          POSTGRES_DB: chartworks_schema
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U chartworks"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      EXPECTED_SOURCE: 0a705286fde9b75a0b85f4f554f238af6edc105a
      FEATURE_BRANCH: feat/phase-26-28-engineering-artifacts
      CGO_ENABLED: '1'
      GOFLAGS: -p=2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-26-28-engineering-artifacts
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - uses: actions/download-artifact@v4
        with:
          name: phase-26-28-native
          run-id: 34441124485
          github-token: ${{ github.token }}
          path: /tmp/native-export
      - name: Restore pinned native parser
        run: |
          mkdir -p /tmp/native
          tar -xzf /tmp/native-export/native.tar.gz -C /tmp/native
          parser=$(find /tmp/native -name libbruin_rustsqlparser.a -print -quit)
          test -s "$parser"
          echo "CGO_LDFLAGS=-L$(dirname "$parser")" >> "$GITHUB_ENV"
      - name: Apply exact previously reviewed integration
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          python3 - <<'PY'
          import subprocess,textwrap
          original=subprocess.check_output(['git','show','b02a041745578c5963c755091a8e4d4942b8bc3f:.github/workflows/phase-26-28-store-check.yml'],text=True)
          script=textwrap.dedent(original.split('      - name: Apply reviewed persistent-domain integration\n        run: |\n',1)[1].split('      - name:',1)[0])
          subprocess.run(['bash','-e','-c',script],check=True)
          PY
      - name: Compile and race-test domain code
        run: |
          go test -race -count=1 ./internal/config ./internal/reporting ./internal/engineering
          go test -run '^$' ./internal/store/postgres
      - name: Apply all forward migrations to an isolated PostgreSQL database
        env:
          PGURL: postgres://chartworks:chartworks@localhost:5434/chartworks_schema?sslmode=disable
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA chartworks' -c 'CREATE EXTENSION IF NOT EXISTS vector'
          for migration in internal/store/postgres/migrations/*.sql; do
            echo "APPLY_MIGRATION=$migration"
            psql "$PGURL" -v ON_ERROR_STOP=1 --single-transaction -f "$migration"
          done
      - name: Publish verified source only with an ordinary fast-forward
        run: |
          git config user.name chartworks-development-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/config/config.go internal/config/autopilot.go internal/reporting internal/store/postgres/frozen_runs*.go internal/store/postgres/migrations/023_frozen_reporting_runs.sql
          git commit -m 'feat(reporting): integrate fenced artifact persistence, expiry and physical-attempt recovery'
          git push origin "HEAD:$FEATURE_BRANCH"
          echo "PUBLISHED_SOURCE=$(git rev-parse HEAD)"
      - name: Preserve diagnostics
        if: always()
        run: |
          mkdir -p /tmp/domain-check
          if test -d .git; then
            git diff > /tmp/domain-check/uncommitted.patch
            git rev-parse HEAD > /tmp/domain-check/head.txt
            git status --short
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-26-28-domain-check
          path: /tmp/domain-check
          retention-days: 3
