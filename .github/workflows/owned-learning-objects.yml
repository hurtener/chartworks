name: Prepare owned-learning source objects
on:
  push:
    branches: [codex/sql-semantic-context-recovery]
    paths: [.github/workflows/owned-learning-objects.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 94d738bcf7c617c85c19d29e485e008f23102e80
          persist-credentials: false
      - name: Apply the reviewed checksummed patch and create source objects only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,base64,hashlib,pathlib,json,subprocess,urllib.request
          endpoint='https://api.github.com/repos/hurtener/chartworks/git/'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          def request(path,body=None):
              req=urllib.request.Request(endpoint+path,data=json.dumps(body).encode() if body is not None else None,headers=headers,method='POST' if body is not None else 'GET')
              with urllib.request.urlopen(req,timeout=45) as response:return json.load(response)
          chunks=['134d49fe2cc2f1669443c13835b9cdcb07e5c422','aee5e5c26092a7b8098434489c8905063cacb04e','2ffaadfdf1d2fce1953bd661b666ac63c7e8a9c0','75d6eeff56d8a173ad3f1459da6981baf1ee5710']
          patch=b''
          for sha in chunks:
              raw=base64.b64decode(request('blobs/'+sha)['content'])
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha
              patch+=raw
          assert len(patch)==70983 and hashlib.sha256(patch).hexdigest()=='753aabb598f44f475cef8d00df778a990558794d9eb0f6c3b32ee1b6d555cf9d'
          path=pathlib.Path('/tmp/owned-learning.patch');path.write_bytes(patch)
          subprocess.run(['git','apply','--check','--index',str(path)],check=True)
          subprocess.run(['git','apply','--index',str(path)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          expected='57dca12a23d54f39aaf377a8fa3c986c2cc93ae3'
          assert subprocess.check_output(['git','write-tree'],text=True).strip()==expected
          allowed={'.github/workflows/sql-context-recovery.yml','docs/contracts/owned-example-learning-v1.md','docs/contracts/parameterized-examples-v1.md','docs/plans/phase-18-nlq-generation-execution.md','docs/reviews/sql-context-recovery.md','docs/reviews/sql-recovery-completion.md','internal/nlqexec/example_parameters.go','internal/nlqexec/owned_examples.go','internal/nlqexec/owned_examples_test.go','internal/nlqexec/service.go','internal/nlqexec/types.go','sdk/chartworks/nlq.go','sdk/chartworks/nlq_owned_examples_test.go','test/acceptance/sql_owned_examples_test.go','test/acceptance/sql_parameter_examples_test.go'}
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert set(paths)==allowed and len(paths)==15
          entries=[]
          for name in paths:
              path=pathlib.Path(name)
              assert path.is_file() and not path.is_symlink()
              mode=subprocess.check_output(['git','ls-files','-s','--',name],text=True).split()[0]
              assert mode=='100644'
              raw=path.read_bytes();raw.decode('utf-8')
              assert len(raw)<150000
              sha=request('blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})['sha']
              assert sha==hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              entries.append({'path':name,'mode':'100644','type':'blob','sha':sha})
          tree=request('trees',{'base_tree':'6cebbf60cbfb50f1ce5c8f2a0c92f86a32bc9ac2','tree':entries})['sha']
          assert tree==expected
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'owned-objects';out.mkdir()
          (out/'manifest.json').write_text(json.dumps({'base':'94d738bcf7c617c85c19d29e485e008f23102e80','tree':tree,'entries':entries},indent=2))
          print('VERIFIED_SOURCE_TREE='+tree)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: owned-learning-source-objects
          path: ${{ runner.temp }}/owned-objects/
          retention-days: 7
