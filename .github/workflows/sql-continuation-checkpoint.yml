name: Prepare S8 correction
on:
  push:
    branches: [codex/sql-semantic-context-recovery]
    paths: [.github/workflows/sql-continuation-checkpoint.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d4d64b469b984de306cf2caa5de9140b7e84e161
          persist-credentials: false
      - name: Transform only reviewed files and verify the complete source tree
        run: |
          python3 - <<'PY'
          from pathlib import Path
          r=Path('.')
          p=r/'internal/nlqexec/clarification.go';s=p.read_text();old='\tout.Answers, out.Choices = merged, choices\n\tout.AnswerContext = old.Route.AnswerContext\n';new='''	out.Answers, out.Choices = merged, choices
          	out.AnswerContext = ""
          	// Refine has already reauthorized and replayed the parent. Only carried
          	// answers/choices need the old form's pin. An inferred-only continuation
          	// can remove its last predicate, changing the optional binding component
          	// of the freshly computed context without changing source authority.
          	// Explicit caller pins are still checked above, and answered forms retain
          	// their exact original pin so policy/source changes cannot be bypassed.
          	if len(merged) > 0 || len(choices) > 0 {
          		out.AnswerContext = old.Route.AnswerContext
          	}
          ''';assert old in s;s=s.replace(old,new);p.write_text(s)
          p=r/'internal/nlqexec/interpretation_continuation_test.go';s=p.read_text().replace('"encoding/json"','"encoding/json"\n "errors"');s+='''
          func TestSQLRecoveryContinuationPinsOnlyCarriedAnswers(t *testing.T) {
           parent := QueryRecord{Route: nlqroute.RouteResult{AnswerContext: "parent-binding-context"}}
           before := exec.Hash(parent)
           for _,provided := range []string{"", parent.Route.AnswerContext} {
            out := QuestionRequest{AnswerContext: "unused-old-context", Locale:nlq.LanguageEnglish}
            if err:=mergeRefinementClarifications(parent,QuestionRequest{AnswerContext:provided},&out);err!=nil || out.AnswerContext!="" {t.Fatal("inferred-only continuation retained a stale form pin",err)}
           }
           out:=QuestionRequest{Locale:nlq.LanguageEnglish}
           err:=mergeRefinementClarifications(parent,QuestionRequest{AnswerContext:"foreign-context"},&out)
           var clarification *nlqroute.Clarification
           if !errors.As(err,&clarification) || clarification.Reason!="stale_answer" {t.Fatal("explicit foreign pin was ignored",err)}
           if exec.Hash(parent)!=before {t.Fatal("parent pin was mutated")}
           // A genuinely carried reviewed answer must retain its original pin.
           parent.Route.Request.Answers=[]semantics.ClarificationAnswer{{Topic:"topic",TopicVersion:"v1",RulesetVersion:"r1",Pattern:"metric",PatternVersion:"v1",Slot:"metric",Value:&semantics.ClarificationValue{OptionID:"revenue"}}}
           if err:=mergeRefinementClarifications(parent,QuestionRequest{},&out);err!=nil || out.AnswerContext!=parent.Route.AnswerContext || len(out.Answers)!=1 {t.Fatal("reviewed answer lost its context fence",err)}
           // Legacy choices are also answers, not inferred state.
           parent.Route.Request.Answers=nil
           if err:=mergeRefinementClarifications(parent,QuestionRequest{Choices:[]nlqroute.ChoiceSelection{{Pattern:"metric",Slot:"metric",Value:"revenue"}}},&out);err!=nil || out.AnswerContext!=parent.Route.AnswerContext || len(out.Choices)!=1 {t.Fatal("legacy choice lost its context fence",err)}
          }
          ''';p.write_text(s)
          p=r/'test/acceptance/sql_interpretation_continuation_test.go';s=p.read_text().replace('"encoding/json"','"encoding/json"\n "errors"').replace('t.Fatal("typed date/value removal", err)','t.Fatalf("typed date/value removal: %#v", err)')
          a='\trequireParameterIDs(t, out, "1", "2", "3", "4", "5", "6", "7")\n';b=a+'''	if len(removed.Route.Request.Answers)!=0 || len(removed.Route.Request.Choices)!=0 || removed.Route.Request.AnswerContext!="" || removed.Route.AnswerContext==child.Route.AnswerContext {t.Fatal("inferred-only removal failed to issue fresh unbound context")}
          	beforeReplay:=f.model.requests.Load()
          	metadata:=support.Raw(t,f.f.dsn)
          	attempts:=count(t,metadata,`SELECT count(*) FROM chartworks.read_attempts`)
          	query,_=newPhase18Service(t,f)
          	replayed,replayErr:=query.Run(ctx,f.e,nlqexec.RunRequest{QueryID:removed.QueryID,Operation:removed.QueryID+"-run"})
          	if replayErr!=nil || f.model.requests.Load()!=beforeReplay || count(t,metadata,`SELECT count(*) FROM chartworks.read_attempts`)!=attempts {t.Fatal("unbound continuation replay performed work or lost provenance",replayErr)}
          	requireParameterIDs(t,replayed,"1","2","3","4","5","6","7")
          	_,badPinErr:=query.Refine(ctx,f.e,nlqexec.RefineRequest{QueryID:removed.QueryID,QuestionRequest:nlqexec.QuestionRequest{AnswerContext:child.Route.AnswerContext}})
          	var stale *nlqroute.Clarification
          	if !errors.As(badPinErr,&stale) || stale.Reason!="stale_answer" || f.model.requests.Load()!=beforeReplay {t.Fatal("caller-supplied stale pin escaped provenance check",badPinErr)}
          ''';assert a in s;s=s.replace(a,b,1);p.write_text(s)
          p=r/'docs/contracts/interpretation-continuity-v1.md';s=p.read_text();s+='''
          ## Removing the last inferred predicate

          A same-session Refine with no carried reviewed answers or legacy choices does not
          reuse a form-specific `answer_context`. The parent is reauthorized and its business
          evidence replayed first. Route computes a fresh context when the final inferred
          predicate is removed, including the legitimate absence of a predicate binding.
          Explicit caller context mismatches still fail; a carried answer/choice still pins
          the original context. Direct pending-answer submissions, source revision checks
          and retained executable-query replay retain their existing provenance fences.
          ''';p.write_text(s)
          p=r/'docs/reviews/sql-recovery-completion.md';s=p.read_text();s+='''
          ## S8 removal correction — current qualification checkpoint

          Observed baseline `d4d64b4`: the existing suite passed units, but typed removal of
          all inferred predicates failed acceptance. Its unrelated, empty answer context
          was being carried as if it authenticated an answer. The correction clears that
          input pin only after parent authorization/replay when no reviewed answer or legacy
          choice remains. Explicit mismatched pins and answered forms stay fenced. The
          acceptance test additionally checks restarted terminal replay and stale-pin denial.
          This source checkpoint remains unqualified until the updated suite completes.
          ''';p.write_text(s)
          PY
          gofmt -w internal/nlqexec/clarification.go internal/nlqexec/interpretation_continuation_test.go test/acceptance/sql_interpretation_continuation_test.go
          git add .
          git diff --cached --check
          test "$(git write-tree)" = 1ce495f55deea9895a6c431894409a3d08827b4a
      - name: Upload exact source objects without changing refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,base64,hashlib,json,pathlib,subprocess,urllib.request
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert set(paths)=={'internal/nlqexec/clarification.go','internal/nlqexec/interpretation_continuation_test.go','test/acceptance/sql_interpretation_continuation_test.go','docs/contracts/interpretation-continuity-v1.md','docs/reviews/sql-recovery-completion.md'}
          def post(path,body):
            req=urllib.request.Request('https://api.github.com/repos/hurtener/chartworks/git/'+path,data=json.dumps(body).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'},method='POST')
            with urllib.request.urlopen(req,timeout=30) as response:return json.load(response)
          entries=[]
          for path in paths:
            data=pathlib.Path(path).read_bytes()
            sha=post('blobs',{'encoding':'base64','content':base64.b64encode(data).decode()})['sha']
            assert sha==hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
            entries.append({'path':path,'mode':'100644','type':'blob','sha':sha})
          actual=post('trees',{'base_tree':'a4a2ea05978a64c68afc798221ab88ff0eddb494','tree':entries})['sha']
          assert actual=='1ce495f55deea9895a6c431894409a3d08827b4a'
          print('VERIFIED_TREE='+actual)
          PY
