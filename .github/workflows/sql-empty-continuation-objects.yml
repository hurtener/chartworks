name: Prepare empty-state continuation objects
on:
  push:
    branches: [codex/sql-semantic-context-recovery]
    paths: [.github/workflows/sql-empty-continuation-objects.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fa983aab6bbf9cc6029eb2e5b0619828a1bde6b9
          persist-credentials: false
      - name: Verify immutable patch and complete source tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,base64,gzip,hashlib,pathlib,subprocess,urllib.request
          base='https://api.github.com/repos/hurtener/chartworks/git/'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          def request(path,body=None):
            req=urllib.request.Request(base+path,data=json.dumps(body).encode() if body is not None else None,headers=headers,method='POST' if body is not None else 'GET')
            with urllib.request.urlopen(req,timeout=30) as response:return json.load(response)
          shas=['221587cacd578b4234155a1731dd55013225ceaa','5fc704c7b136cc208cfa5b413c423f70e48dfeb7','ca57ae726f8525ccd3706a4b4e6d7ff16a3903af','69289c3640cffbe559d849f488e1dbc6795a1ca2']
          data=b''
          for sha in shas:
            blob=base64.b64decode(request('blobs/'+sha)['content'])
            assert hashlib.sha1(b'blob '+str(len(blob)).encode()+b'\0'+blob).hexdigest()==sha
            data+=blob
          patch=gzip.decompress(data)
          assert hashlib.sha256(patch).hexdigest()=='610e511c786502c67af33271f2f6c75c4e2c466ad88cc4744c8b576f60122789'
          pathlib.Path('/tmp/empty-state.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','--index','/tmp/empty-state.patch'],check=True)
          subprocess.run(['git','apply','--index','/tmp/empty-state.patch'],check=True)
          expected='193cf00efa78ad3e15f2d137d61efb61f03babda'
          assert subprocess.check_output(['git','write-tree'],text=True).strip()==expected
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert len(paths)==16 and all(p.startswith(('internal/nlqexec/','internal/nlqroute/','sdk/chartworks/','docs/contracts/','docs/reviews/','test/acceptance/')) or p=='.github/workflows/sql-context-recovery.yml' for p in paths)
          entries=[]
          for path in paths:
            raw=pathlib.Path(path).read_bytes()
            sha=request('blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})['sha']
            assert sha==hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
            entries.append({'path':path,'mode':'100644','type':'blob','sha':sha})
          tree=request('trees',{'base_tree':'1ce495f55deea9895a6c431894409a3d08827b4a','tree':entries})['sha']
          assert tree==expected
          print('VERIFIED_TREE='+tree)
          PY
