# Temporary branch-only development edits. Remove before final review.
# Hosted verification remains separate and tests only committed source.
name: Phase 29 development edits
on:
  push:
    branches: [feat/phase-29-reports-dashboards]
    paths: [.github/workflows/phase-29-edit.yml]
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: false
      - name: Apply reviewed compatibility and fixture corrections
        shell: python
        run: |
          from pathlib import Path
          def replace(path, before, after):
              p = Path(path)
              text = p.read_text()
              assert text.count(before) == 1, (path, before, text.count(before))
              p.write_text(text.replace(before, after))
          replace('test/acceptance/phase29_documents_test.go', '\t"os"\n', '')
          replace('test/acceptance/phase29_documents_test.go', 'os.Getenv("CHARTWORKS_TEST_STORE_URL")', 'f.f.dsn')
          replace('internal/reporting/compositions_proof.go', 'b.Digest != g.Definition', 'b.RevisionDigest != g.Definition')
          replace('internal/reporting/compositions_proof.go', 'output.State != "completed"', 'output.State != "succeeded"')
          replace('internal/reporting/compositions_execution.go', '\t"errors"\n', '')
          replace('internal/reporting/compositions_execution.go', '\t"github.com/hurtener/chartworks/internal/nlqexec"\n', '')
          replace('internal/reporting/compositions_execution.go', '\n// Suppress unused-import drift while keeping error identity explicit in tests.\nvar _ = errors.Is\nvar _ nlqexec.SavedPlan\n', '\n')
          p = Path('internal/reporting/compositions_service.go')
          text = p.read_text()
          start = text.index('\t// A session-bound result retains')
          stop = text.index('\tmemo :=', start)
          p.write_text(text[:start] + text[stop:])
          replace('internal/jobs/requests.go', '(r.Kind == "reporting.run" || r.Kind == "upload.load"', '(r.Kind == "report.run" || r.Kind == "dashboard.run" || r.Kind == "reporting.run" || r.Kind == "upload.load"')
          replace('internal/jobs/requests.go', '\tif r.Kind == "reporting.run" {\n', '\tif r.Kind == "report.run" || r.Kind == "dashboard.run" {\n\t\tkind := r.Kind[:len(r.Kind)-len(".run")]\n\t\treturn access.Require(e, "reporting.execute", access.Resource{Tenant: e.Tenant(), Kind: kind, Permission: "execute", ID: r.Target})\n\t}\n\tif r.Kind == "reporting.run" {\n')
      - name: Format and preserve the actual authored changes
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          find internal test -type f \( -name '*documents*.go' -o -name 'reporting_composition*.go' -o -name 'phase29*.go' -o -name 'compositions*.go' -o -name 'saved_question*.go' \) -print0 | xargs -0 gofmt -w
          gofmt -w internal/jobs/requests.go
          git diff --check
          git diff --stat
          git config user.name 'Chartworks development formatter'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal test
          git commit -m 'fix(reporting): align retained states and fixture isolation; register scoped report run requests'
          git push origin HEAD:refs/heads/feat/phase-29-reports-dashboards
          echo "EDITED_COMMIT=$(git rev-parse HEAD)"
