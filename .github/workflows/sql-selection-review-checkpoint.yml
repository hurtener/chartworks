name: Publish selected-intent review fixes

on:
  push:
    branches: [codex/sql-semantic-context-recovery]
    paths: [.github/workflows/sql-selection-review-checkpoint.yml]

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'hurtener/chartworks' && github.actor == 'hurtener' && github.ref == 'refs/heads/codex/sql-semantic-context-recovery'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Publish one exact source-only checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 6c9b10ac89d16b782c6aa1c0663b9a54afdfcb31
          python3 - <<'PY'
          from pathlib import Path
          import gzip, hashlib
          with gzip.open('scripts/sql-selection-review.patch.gz', 'rb') as stream:
              data = stream.read(1048577)
          if len(data) != 18587 or hashlib.sha256(data).hexdigest() != '6cdfaa6ba297c74848bc0076f871a809764b50834891039dd2c479cce8b4e218':
              raise SystemExit('Checkpoint digest mismatch')
          Path('/tmp/selection-review.patch').write_bytes(data)
          PY
          git apply --check --index /tmp/selection-review.patch
          git apply --index /tmp/selection-review.patch
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines()
          expected = {'internal/nlqroute/clarification.go','internal/nlqroute/semantic_selection_adversarial_test.go','internal/nlqroute/semantic_selection_test.go','test/acceptance/phase16_test.go','test/acceptance/phase17_test.go','test/acceptance/sql_selection_test.go'}
          if set(paths) != expected:
              raise SystemExit('Unexpected checkpoint paths')
          for path in paths:
              if subprocess.check_output(['gofmt','-l',path]).strip():
                  raise SystemExit('Unformatted source')
          PY
          git rm scripts/sql-selection-review.patch.gz
          cp .git/index /tmp/selection-core.index
          GIT_INDEX_FILE=/tmp/selection-core.index git update-index --force-remove .github/workflows/sql-selection-review-checkpoint.yml
          test "$(GIT_INDEX_FILE=/tmp/selection-core.index git write-tree)" = de4d289abc8a0683ff70db8aa4f7c4e3ed3c04e6
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(nlq): keep rule dependencies separate from user clarification choices'
          git push origin HEAD:refs/heads/codex/sql-semantic-context-recovery

# One bounded, hash-pinned source patch. No tests of a modified worktree, no
# main/force writes, no native-policy relaxation. This unchanged transport is
# removed afterward through the authorized connector; the bot changes code only.
