name: Finalize phases 07-08
on:
  push:
    branches: [feat/phase-07-08-vindex-sources]
permissions:
  contents: write
concurrency:
  group: phase-07-08-development
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CGO_ENABLED: 1
      CHARTWORKS_TEST_STORE_URL: postgres://chartworks:chartworks@localhost:5434/chartworks?sslmode=disable
      CHARTWORKS_COVERAGE_OUTPUT: /tmp/chartworks-final-evidence/coverage.out
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        ports: [5434:5432]
        env:
          POSTGRES_USER: chartworks
          POSTGRES_PASSWORD: chartworks
          POSTGRES_DB: chartworks
        options: >-
          --health-cmd "pg_isready -U chartworks -d chartworks"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-07-08-vindex-sources
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - name: PostgreSQL recovery client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - name: Finalize reviewed source and remove all temporary writers
        run: |
          test "$GITHUB_REF" = refs/heads/feat/phase-07-08-vindex-sources
          if test -f scripts/_phase_07_08_finalize.py; then python3 scripts/_phase_07_08_finalize.py; fi
          go mod tidy
          find cmd internal sdk test -name '*.go' -print0 | xargs -0 gofmt -w
          make planning-check drift-audit check-mirror
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet || test -n "$(git ls-files --others --exclude-standard)"; then
            git add -A
            git commit -m 'feat: finalize qualified vector source and validated-read contracts'
            git push origin HEAD:feat/phase-07-08-vindex-sources
          fi
          mkdir -p /tmp/chartworks-final-evidence
          git rev-parse HEAD | tee /tmp/chartworks-final-evidence/tested-commit.txt
          test ! -e .github/workflows/phase-07-08-development.yml
          test ! -e .github/workflows/phase-07-08-finalize.yml
          test -z "$(find scripts -name '_phase_07_08*' -print)"
      - name: Build and vet exact source
        run: |
          go mod verify
          make build 2>&1 | tee /tmp/chartworks-final-evidence/build.log
          make vet 2>&1 | tee /tmp/chartworks-final-evidence/vet.log
      - name: Full uncached race suite and unchanged package coverage gates
        run: make coverage 2>&1 | tee /tmp/chartworks-final-evidence/coverage.log
      - name: All 58 named criteria with no implemented-phase skips
        run: |
          for phase in 01 02 03 04 05 06 07 09 08; do
            python3 scripts/run_phase_acceptance.py --phase "$phase"
          done 2>&1 | tee /tmp/chartworks-final-evidence/acceptance.log
      - name: Full cumulative preflight and binary lifecycle
        run: |
          make foundation-smoke 2>&1 | tee /tmp/chartworks-final-evidence/lifecycle.log
          make preflight-full 2>&1 | tee /tmp/chartworks-final-evidence/preflight.log
      - name: Bounded authority and SQL fuzz campaigns
        run: |
          go test -race ./test/acceptance -run '^$' -fuzz '^FuzzAuthorityJSON$' -fuzztime=5s -parallel=2
          go test -race ./test/acceptance -run '^$' -fuzz '^FuzzActualVerifier$' -fuzztime=5s -parallel=2
          names=$(go test ./internal/exec -list '^Fuzz' | grep '^Fuzz')
          test -n "$names"
          for name in $names; do
            go test -race ./internal/exec -run '^$' -fuzz "^${name}$" -fuzztime=5s -parallel=2
          done
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
      - name: CGo-free reference cross-builds
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/chartworks-linux-amd64 ./cmd/chartworks
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o /tmp/chartworks-darwin-arm64 ./cmd/chartworks
      - name: Verify unchanged tested source
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Retain source and executed evidence even on failure
        if: always()
        run: |
          mkdir -p /tmp/chartworks-final-evidence
          git archive --format=tar.gz -o /tmp/chartworks-final-evidence/source.tar.gz HEAD
          git rev-parse HEAD > /tmp/chartworks-final-evidence/tested-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-07-08-final-evidence
          path: /tmp/chartworks-final-evidence
          retention-days: 14
