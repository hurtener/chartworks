name: CW-03 final review evidence
on:
  push:
    branches: [fix/cw-03-final-review]
    paths: [.github/workflows/cw-03-review-evidence.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retain exact committed source and original CI evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/cw03-review"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/COMMIT"
          git rev-parse HEAD^{tree} > "$out/TREE"
          git archive --format=tar.gz HEAD > "$out/source.tar.gz"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/35120624081/logs" > "$out/prior-ci.zip"
          OUT="$out" python3 - <<'PY'
          import os, pathlib, zipfile
          root = pathlib.Path(os.environ['OUT'])
          needles = ('WARNING: DATA RACE', '--- FAIL:', 'panic: test timed out', 'Error:', 'error:', 'coverage below', 'FAIL:')
          with zipfile.ZipFile(root / 'prior-ci.zip') as logs:
              excerpts = []
              for name in logs.namelist():
                  if name.endswith('/'):
                      continue
                  lines = logs.read(name).decode('utf-8', 'replace').splitlines()
                  indices = [i for i, line in enumerate(lines) if any(word in line for word in needles)]
                  if not indices:
                      continue
                  excerpts.append('\nFILE: ' + name)
                  seen = set()
                  for index in indices:
                      for i in range(max(0, index - 3), min(len(lines), index + 75)):
                          if i not in seen:
                              excerpts.append(lines[i]); seen.add(i)
              text = '\n'.join(excerpts)
              (root / 'failure-excerpts.txt').write_text(text)
              print(text[:60000])
          PY
          (cd "$out" && sha256sum source.tar.gz prior-ci.zip failure-excerpts.txt > SHA256SUMS)
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: cw03-final-review-source
          path: ${{ runner.temp }}/cw03-review
          retention-days: 7
