name: Prepare confirmed-join source objects
on:
  push:
    branches: [codex/sql-semantic-context-recovery]
    paths: [.github/workflows/confirmed-projection-objects.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 25aa59ad04d11d567fe632a924f14960a79d5461
          persist-credentials: false
      - name: Verify exact patch and stage source objects only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,hashlib,base64,gzip,pathlib,subprocess,urllib.request
          base='https://api.github.com/repos/hurtener/chartworks/git/'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          def request(path,body=None):
              req=urllib.request.Request(base+path,data=json.dumps(body).encode() if body is not None else None,headers=headers,method='POST' if body is not None else 'GET')
              with urllib.request.urlopen(req,timeout=30) as response:return json.load(response)
          chunks=['a426114edcc09fc6b04083377a12bb4f016b11c2','ba124db422d9743d46f28c4226230581636628dd','e4cdb6ec4d0b8b68d94c8c6ea934eedae3b38fa0','2ec5c3f6af9b58cb3358a39114803fa687e75866','a23b7631945602e6a44b39c42bf7bebb2a0aeef6','fdd81921dc11a97294157f8edc70c3cc36fbfe25']
          data=b''
          for sha in chunks:
              raw=base64.b64decode(request('blobs/'+sha)['content'])
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha
              data+=raw
          patch=gzip.decompress(data)
          assert len(patch)==53805 and hashlib.sha256(patch).hexdigest()=='990d6d98bfacae58efa11b922c87490d8d01632a7c4a614044b7ba1308359641'
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'confirmed-join.patch'
          path.write_bytes(patch)
          subprocess.run(['git','apply','--check','--index',str(path)],check=True)
          subprocess.run(['git','apply','--index',str(path)],check=True)
          expected='296e71f73abbfb3a9ec55244cc09d2d218beeef4'
          assert subprocess.check_output(['git','write-tree'],text=True).strip()==expected
          files=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          allowed={'.github/workflows/sql-context-recovery.yml','docs/contracts/confirmed-join-projection-v1.md','docs/plans/phase-17-nlq-routing-context.md','docs/reviews/sql-scoped-projection.md','internal/nlq/confirmed_join_projection.go','internal/nlq/confirmed_join_projection_test.go','internal/nlq/prompt_projection.go','internal/nlq/prompt_projection_scoped.go','internal/nlqroute/confirmed_join_projection.go','internal/nlqroute/confirmed_join_projection_test.go','internal/nlqroute/service.go','test/acceptance/sql_confirmed_projection_test.go'}
          assert set(files)==allowed
          entries=[]
          for name in files:
              raw=pathlib.Path(name).read_bytes()
              sha=request('blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})['sha']
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha
              entries.append({'path':name,'mode':'100644','type':'blob','sha':sha})
          tree=request('trees',{'base_tree':'b0e8f2186e8d5a8d0c3e2585251656d7ea556f1f','tree':entries})['sha']
          assert tree==expected
          print('VERIFIED_CONFIRMED_JOIN_TREE='+tree)
          print('SOURCE_ENTRIES='+json.dumps(entries,sort_keys=True))
          PY
