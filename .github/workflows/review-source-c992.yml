name: Exact c992 compiled smoke
on:
  push:
    branches: [dev/phase20-review-source-c992]
permissions:
  contents: read
  actions: read
jobs:
  compiled-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        ports: [5434:5432]
        env:
          POSTGRES_USER: chartworks
          POSTGRES_PASSWORD: chartworks
          POSTGRES_DB: chartworks
        options: >-
          --health-cmd "pg_isready -U chartworks -d chartworks"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c992a5d87862663b007d0ab2c2457bca1273413f
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: chartworks-linux-amd64
          run-id: 34300972712
          github-token: ${{ github.token }}
          path: bin
      - name: Verify source and run the existing compiled smoke unchanged
        env:
          CHARTWORKS_TEST_STORE_URL: postgres://chartworks:chartworks@localhost:5434/chartworks?sslmode=disable
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = c992a5d87862663b007d0ab2c2457bca1273413f
          test "$(git rev-parse HEAD^{tree})" = b53ca348e26866cd95ff3a7ebb8a1ba5bac1a790
          chmod +x bin/chartworks
          ./bin/chartworks version
          python3 -m unittest discover -s scripts -p 'test_smoke_foundation.py' -v
          python3 scripts/smoke_foundation.py
          git diff --exit-code
