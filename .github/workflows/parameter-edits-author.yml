name: Parameter edit source checkpoint
on:
  push:
    branches: [codex/sql-semantic-context-recovery]
    paths: [.github/workflows/parameter-edits-author.yml]
permissions:
  contents: write
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source patch and publish non-workflow objects only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          repo='hurtener/chartworks'
          base='41acc1cb19353100408f9496c9c6cc221f3e0e14'
          expected_tree='756cc608307a4ae68941a29d7180e7870d36d46d'
          workflow='.github/workflows/parameter-edits-author.yml'
          chunks=['6e154442ad2e139b8264e114cbcf37e3061f0759','913a4bbf37e7ff297b841ff55875e744d75a3153','460ed95e458d4ebf2116a971591430e3208dcf15','7059402d2672eae9cb6e771dd34d6f6f07fc0287']
          allowed={'.github/workflows/sql-context-recovery.yml','docs/contracts/conversational-continuity-v1.md','docs/contracts/refinement-parameter-edits-v1.md','docs/contracts/refinement-parameters-v1.md','docs/plans/phase-18-nlq-generation-execution.md','docs/reviews/sql-context-recovery.md','internal/nlqapi/parameter_edits_test.go','internal/nlqexec/refinement_parameter_edits.go','internal/nlqexec/refinement_parameter_edits_test.go','internal/nlqexec/refinement_parameters.go','internal/nlqexec/service.go','internal/nlqexec/types.go','test/acceptance/sql_parameter_edits_test.go'}
          def git(*args): return subprocess.check_output(['git',*args])
          def api(path,body=None):
              data=None if body is None else json.dumps(body).encode()
              request=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+path,data=data,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(request,timeout=60) as response: return json.load(response)
          assert git('rev-parse','HEAD^').decode().strip()==base
          archive=b''
          for sha in chunks:
              response=api('git/blobs/'+sha)
              assert response['encoding']=='base64'
              raw=base64.b64decode(response['content'])
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha
              archive+=raw
          patch=lzma.decompress(archive)
          assert hashlib.sha256(patch).hexdigest()=='9de9119fb6f665160a7a3cdc1df01bbf8a2e0e07fa6985c980facc0f5aff69e1'
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'parameter-edit-checkpoint'
          out.mkdir()
          target=out/'parameter-edits-incremental.patch';target.write_bytes(patch)
          subprocess.run(['git','apply','--check','--index',str(target)],check=True)
          subprocess.run(['git','apply','--index',str(target)],check=True)
          subprocess.run(['git','rm','--',workflow],check=True)
          assert git('write-tree').decode().strip()==expected_tree
          paths=set(git('diff','--cached','--name-only',base).decode().splitlines())
          assert paths==allowed
          entries=[]
          for path in sorted(paths):
              meta=git('ls-files','--stage','--',path).decode().split()
              mode,sha=meta[0],meta[1]
              assert mode in ('100644','100755')
              raw=git('show',':'+path)
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha
              if not path.startswith('.github/'):
                  made=api('git/blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})
                  assert made['sha']==sha
              entries.append({'path':path,'mode':mode,'type':'blob','sha':sha})
          (out/'manifest.json').write_text(json.dumps({'base':base,'tree':expected_tree,'patch_sha256':hashlib.sha256(patch).hexdigest(),'entries':entries},indent=2)+'\n')
          print('Verified exact implementation tree',expected_tree)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: parameter-edit-source-objects
          path: ${{ runner.temp }}/parameter-edit-checkpoint
          retention-days: 7
