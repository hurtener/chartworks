name: Reviewed continuation checkpoint
on:
  push:
    branches: [codex/sql-semantic-context-recovery]
    paths: [.github/workflows/cw-continuation-checkpoint.yml]
permissions:
  contents: write
jobs:
  source:
    if: github.repository == 'hurtener/chartworks' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact reviewed patch and upload its source objects
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 6273c80d677dfb6c396d3747422c5001b93ea2c0
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib,subprocess,urllib.request
          BASE='6273c80d677dfb6c396d3747422c5001b93ea2c0'
          BASE_TREE='9c4c21575bb9d82f1187d8db746043908c9f2d18'
          EXPECTED='2817bcdbcf91b19270ba0ff1cbf6cdce9443cdbd'
          DIGEST='086c2348cc672a1cac68892cc2040afeae6e0eb0838be33f3423c0d51aa428fd'
          PARTS=['89609115250eefa428c0b3aa270224447589f286','c31ff983b6652fcb82aaafe97c2ea5b7f5c8974f','78e4a2babe2b42a7b5a65336eb53d565c2de0152','cd8f6851585ed5cb6ee23dd0e9981209b3a9dd4e','23ae0f3aefff6f2bb06e5ecc01b62a9cd11eef87','a38fb1cfab1f6f3c9b6bd920c50aa4266bd60698','94c214891047450884789adeb9bbfbdd991c1af2','bf696cfe0d775e31eb24d3a513d852a91f3db86b','6e8d16d26979ff6fb6e1378ca1ed1cd1ea9238bd','f141ee95102e2a5476a8a91b7233a59a5d649a68']
          ALLOWED=['.github/workflows/sql-context-recovery.yml','docs/contracts/conversational-continuity-v1.md','docs/contracts/interpretation-continuity-v1.md','docs/plans/phase-17-nlq-routing-context.md','docs/plans/phase-18-nlq-generation-execution.md','docs/reviews/sql-context-recovery.md','docs/reviews/sql-recovery-completion.md','internal/nlqexec/clarification_origin.go','internal/nlqexec/interpretation_continuation.go','internal/nlqexec/interpretation_continuation_test.go','internal/nlqexec/saved_selections.go','internal/nlqexec/service.go','internal/nlqexec/types.go','internal/nlqroute/interpretation.go','internal/nlqroute/interpretation_continuation_test.go','internal/nlqroute/interpretation_selections.go','internal/nlqroute/service.go','sdk/chartworks/nlq.go','sdk/chartworks/nlq_interpretation_test.go','test/acceptance/sql_interpretation_continuation_test.go']
          api=os.environ['GITHUB_API_URL']+'/repos/'+os.environ['GITHUB_REPOSITORY']
          def request(path,body=None):
              data=None if body is None else json.dumps(body).encode()
              req=urllib.request.Request(api+path,data=data,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=60) as response: return json.load(response)
          pieces=[]
          for sha in PARTS:
              blob=request('/git/blobs/'+sha)
              assert blob['sha']==sha and blob['encoding']=='base64'
              raw=base64.b64decode(blob['content'])
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha
              pieces.append(raw)
          packed=base64.b64decode(b''.join(pieces),validate=True)
          assert len(packed)==20548
          patch=lzma.decompress(packed)
          assert len(patch)==94082 and hashlib.sha256(patch).hexdigest()==DIGEST
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          patchpath=root/'continuation-reviewed.patch';patchpath.write_bytes(patch)
          env=dict(os.environ,GIT_INDEX_FILE=str(root/'continuation-reviewed.index'))
          def git(*args): return subprocess.check_output(['git',*args],env=env)
          assert git('rev-parse',BASE+'^{tree}').decode().strip()==BASE_TREE
          git('read-tree',BASE)
          git('apply','--cached','--check',str(patchpath))
          git('apply','--cached',str(patchpath))
          git('diff','--cached','--check',BASE)
          assert git('write-tree').decode().strip()==EXPECTED
          changed=git('diff','--cached','--name-only',BASE).decode().splitlines()
          assert sorted(changed)==sorted(ALLOWED)
          assert request('/git/ref/heads/codex/sql-semantic-context-recovery')['object']['sha']==os.environ['GITHUB_SHA']
          entries=[]
          for path in changed:
              entry=git('ls-files','-s','--',path).decode().strip()
              mode,sha,stage=entry.split('\t')[0].split()
              assert mode in ['100644','100755'] and stage=='0'
              raw=git('cat-file','blob',sha)
              uploaded=request('/git/blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})
              assert uploaded['sha']==sha
              entries.append({'path':path,'mode':mode,'type':'blob','sha':sha})
          tree=request('/git/trees',{'base_tree':BASE_TREE,'tree':entries})
          assert tree['sha']==EXPECTED
          result={'baseline':BASE,'authoring_head':os.environ['GITHUB_SHA'],'tree':EXPECTED,'patch_sha256':DIGEST,'changed_paths':changed}
          (root/'continuation-source-objects.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result))
          # No commit/ref/push or test claim here. The connected application
          # publishes this verified tree with an explicit parent and normal FF.
          # The expected source tree intentionally excludes this temporary file.
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: continuation-source-${{ github.sha }}
          path: ${{ runner.temp }}/continuation-source-objects.json
          retention-days: 7
