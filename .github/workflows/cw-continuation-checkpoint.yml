name: Reviewed continuation fixes
on:
  push:
    branches: [codex/sql-semantic-context-recovery]
    paths: [.github/workflows/cw-continuation-checkpoint.yml]
permissions:
  contents: write
jobs:
  source:
    if: github.repository == 'hurtener/chartworks' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact patch and create only source blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 6129df3e77e057aad372dd6bae535ca566c6e4d8
          python3 - <<'PY'
          import base64,gzip,hashlib,json,os,pathlib,subprocess,urllib.request
          BASE='bb6cf5b56c17c2b7ae30baf68d87666522ee9c28'
          TREE='82a309eca47172709bb35aebfe977c14c19ba36e'
          DIGEST='12709825150eaec8eb434be6b6d7c000f781c8d0a4729545a2ebf66982ddd038'
          ALLOWED=['.github/workflows/sql-context-recovery.yml','docs/contracts/interpretation-continuity-v1.md','docs/reviews/sql-context-recovery.md','internal/nlqexec/clarification_origin.go','internal/nlqexec/interpretation_continuation_test.go','internal/nlqexec/saved_selections.go','internal/nlqroute/interpretation_continuation_test.go','internal/nlqroute/interpretation_selections.go','test/acceptance/sql_interpretation_continuation_test.go']
          api=os.environ['GITHUB_API_URL']+'/repos/'+os.environ['GITHUB_REPOSITORY']
          def request(path,body=None):
              req=urllib.request.Request(api+path,data=None if body is None else json.dumps(body).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=60) as response: return json.load(response)
          blob=request('/git/blobs/e68c93336768fd183a95f903185d871e260c04a3')
          encoded=''.join(blob['content'].split())
          for before,after in [('LkJjvM3kTV9kc','LkJjvM3kV9kc'),('5z3cd4f4IrHlz','5z3cd4IrHlz'),('Hw/T9PdKccfvs9cW','Hw/T9Kcffvs9cW'),('ROQOJp+ThJfDGK','ROQOJp+ThEfDGK')]:
              assert encoded.count(before)==1, before
              encoded=encoded.replace(before,after)
          assert encoded.endswith('/AdswdYEaZQA') and len(encoded)==9195
          encoded+='A'
          data=base64.b64decode(encoded,validate=True)
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()=='ce29efe76035b7f0a5d868faa7cf03db93d84eb1'
          patch=gzip.decompress(data)
          assert len(patch)==25882 and hashlib.sha256(patch).hexdigest()==DIGEST
          root=pathlib.Path(os.environ['RUNNER_TEMP']);pp=root/'continuation-review.patch';pp.write_bytes(patch)
          env=dict(os.environ,GIT_INDEX_FILE=str(root/'continuation-review.index'))
          def git(*args): return subprocess.check_output(['git',*args],env=env)
          git('read-tree',BASE);git('apply','--cached','--check',str(pp));git('apply','--cached',str(pp));git('diff','--cached','--check',BASE)
          assert git('write-tree').decode().strip()==TREE
          changed=git('diff','--cached','--name-only',BASE).decode().splitlines()
          assert sorted(changed)==sorted(ALLOWED)
          assert request('/git/ref/heads/codex/sql-semantic-context-recovery')['object']['sha']==os.environ['GITHUB_SHA']
          entries=[]
          for path in changed:
              mode,sha,stage=git('ls-files','-s','--',path).decode().split('\t')[0].split()
              raw=git('cat-file','blob',sha)
              assert request('/git/blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})['sha']==sha
              entries.append({'path':path,'mode':mode,'type':'blob','sha':sha})
          result={'baseline':BASE,'authoring_head':os.environ['GITHUB_SHA'],'tree':TREE,'patch_sha256':DIGEST,'entries':entries}
          (root/'continuation-review-objects.json').write_text(json.dumps(result,indent=2)+'\n');print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: continuation-review-${{ github.sha }}
          path: ${{ runner.temp }}/continuation-review-objects.json
          retention-days: 7
