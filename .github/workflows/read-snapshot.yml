name: Read-only source snapshot
on:
  push:
    branches: [feat/phase-09-10-read-execution]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive committed source without modifying it
        run: |
          git rev-parse HEAD > /tmp/snapshot-commit.txt
          git archive --format=tar.gz HEAD > /tmp/source-snapshot.tar.gz
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: read-only-source-snapshot
          path: |
            /tmp/source-snapshot.tar.gz
            /tmp/snapshot-commit.txt
          retention-days: 1
