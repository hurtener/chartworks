name: CW01 candidate preparation

on:
  push:
    branches: [ci/cw01-readiness-diagnostics]
    paths:
      - scripts/dev/cw01-readiness-candidate.py
      - .github/workflows/cw01-readiness-candidate.yml

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: tooling
          sparse-checkout: scripts/dev/cw01-readiness-candidate.py
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: f0fa46c6364751e33f6d79b1795ba21c13fbf04c
          path: candidate
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - name: Prepare exact replacements and inspect formatted diff
        working-directory: candidate
        run: python3 ../tooling/scripts/dev/cw01-readiness-candidate.py
      - name: Create candidate tree only, without committing or moving any ref
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          expected = {
              'internal/exec/business_model.go',
              'internal/exec/business_sqlserver_time_test.go',
              'test/acceptance/topic_publications_test.go',
              'scripts/coverage_gate.py',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if changed != expected:
              raise SystemExit('Unexpected candidate paths')
          base = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          payload = {'base_tree': base, 'tree': [
              {'path': path, 'mode': '100644', 'type': 'blob', 'content': Path(path).read_text()}
              for path in sorted(expected)
          ]}
          request = Path('/tmp/cw01-tree-request.json')
          request.write_text(json.dumps(payload))
          result = subprocess.run(['gh', 'api', '--method', 'POST', 'repos/hurtener/chartworks/git/trees', '--input', str(request)], capture_output=True, text=True, check=True)
          tree = json.loads(result.stdout)
          print('CANDIDATE_TREE=' + tree['sha'])
          print('CANDIDATE_PARENT=f0fa46c6364751e33f6d79b1795ba21c13fbf04c')
          for path in sorted(expected):
              blob = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              print(path + ' ' + blob)
          PY
