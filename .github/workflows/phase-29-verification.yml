name: Reports and dashboards verification

on:
  push:
    branches: [feat/phase-29-reports-dashboards]
  pull_request:
    paths:
      - 'internal/reporting/**'
      - 'internal/reportingapi/**'
      - 'internal/nlqexec/saved*'
      - 'internal/store/postgres/documents*'
      - 'internal/store/postgres/compositions*'
      - 'internal/store/postgres/migrations/029*'
      - 'internal/store/postgres/migrations/030*'
      - 'test/acceptance/phase29*'
      - '.github/workflows/phase-29-verification.yml'

permissions:
  contents: read

concurrency:
  group: phase-29-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reports:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CGO_ENABLED: 1
      GOFLAGS: -p=2
      CHARTWORKS_BRUIN_BUILD_DIR: /tmp/chartworks-bruin
      CHARTWORKS_TEST_BRUIN_PATH: /tmp/chartworks-bruin/bruin
      CHARTWORKS_TEST_STORE_URL: postgres://chartworks:chartworks@localhost:5434/chartworks?sslmode=disable
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        ports: [5434:5432]
        env:
          POSTGRES_USER: chartworks
          POSTGRES_PASSWORD: chartworks
          POSTGRES_DB: chartworks
        options: >-
          --health-cmd "pg_isready -U chartworks -d chartworks"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - name: Formatting diagnostics without modifying source
        run: |
          files=$(find internal test -name '*documents*.go' -o -name 'reporting_composition*.go' -o -name 'phase29*.go' -o -name 'compositions*.go' -o -name 'saved_question*.go')
          if test -n "$files"; then gofmt -d $files; fi
      - name: Reserve native build disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
      - uses: actions/cache/restore@v4
        id: rust-cache
        with:
          path: /tmp/chartworks-bruin/source/pkg/sqlparser/rustffi/target
          key: phase29-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-bruin.sh') }}
      - name: Build the pinned native parser and runner
        id: native
        run: bash scripts/build-bruin.sh
      - uses: actions/cache/save@v4
        if: always() && steps.native.outcome == 'success' && steps.rust-cache.outputs.cache-hit != 'true'
        with:
          path: /tmp/chartworks-bruin/source/pkg/sqlparser/rustffi/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Exact-source unit and PostgreSQL regression tests
        run: |
          echo "TESTED_COMMIT=$(git rev-parse HEAD)"
          go test -race -count=1 -timeout=15m ./internal/config ./internal/reporting ./internal/nlqexec ./test/acceptance -run 'TestDocument|TestReportingComposition|TestSavedQuestion'
      - name: All eight named phase criteria are required
        run: python3 scripts/run_phase_acceptance.py --phase 29
      - name: Formatting and source must remain unchanged
        if: always() && steps.checkout.outcome == 'success'
        run: |
          files=$(find internal test -name '*documents*.go' -o -name 'reporting_composition*.go' -o -name 'phase29*.go' -o -name 'compositions*.go' -o -name 'saved_question*.go')
          if test -n "$files"; then test -z "$(gofmt -l $files)"; fi
          test ! -f .github/workflows/phase-29-edit.yml
          test ! -f .github/workflows/phase-29-format.yml
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
