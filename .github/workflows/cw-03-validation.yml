name: CW-03 reporting validation
on:
  push:
    branches: [feat/cw-03-reporting-intent-policies]
permissions:
  contents: read
  actions: read
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cw03-offline-dependencies
          run-id: 35041474951
          github-token: ${{ github.token }}
          path: /tmp/cw03-offline
      - name: Verify and split dependency-only archives
        run: |
          set -euo pipefail
          cd /tmp/cw03-offline
          sha256sum -c SHA256SUMS
          split -b 400m -d modules.tar.gz modules.part-
          ls -lh
      - uses: actions/upload-artifact@v4
        with:
          name: cw03-offline-go-native
          path: |
            /tmp/cw03-offline/go.tar.gz
            /tmp/cw03-offline/native.tar.gz
            /tmp/cw03-offline/SHA256SUMS
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: cw03-modules-00
          path: /tmp/cw03-offline/modules.part-00
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: cw03-modules-01
          path: /tmp/cw03-offline/modules.part-01
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: cw03-modules-02
          path: /tmp/cw03-offline/modules.part-02
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: cw03-modules-03
          path: /tmp/cw03-offline/modules.part-03
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3
