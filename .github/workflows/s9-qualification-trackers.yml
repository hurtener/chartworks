name: Prepare qualified S9 tracker objects
on:
  push:
    branches: [codex/sql-semantic-context-recovery]
    paths: [.github/workflows/s9-qualification-trackers.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 996db063d214ae086f4fe4383028348abe9d7282
          persist-credentials: false
      - name: Verify documentation-only tree from observed qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,base64,hashlib,pathlib,subprocess,json,urllib.request
          base='https://api.github.com/repos/hurtener/chartworks/git/'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          def request(path,data=None):
            req=urllib.request.Request(base+path,data=json.dumps(data).encode() if data is not None else None,headers=headers,method='POST' if data is not None else 'GET')
            with urllib.request.urlopen(req,timeout=30) as response:return json.load(response)
          sha='298e76ef04b1d0ebbd91841d08791eafda48bc7d'
          script=base64.b64decode(request('blobs/'+sha)['content'])
          assert hashlib.sha1(b'blob '+str(len(script)).encode()+b'\0'+script).hexdigest()==sha
          exec(compile(script,'verified_tracker_transform','exec'))
          subprocess.run(['git','add','docs'],check=True)
          expected='f85ff382e3869e91e9636a814636c83643428f5a'
          assert subprocess.check_output(['git','write-tree'],text=True).strip()==expected
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert len(paths)==14 and all(p.startswith('docs/') for p in paths)
          entries=[]
          for path in paths:
            raw=pathlib.Path(path).read_bytes()
            sha=request('blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})['sha']
            assert sha==hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
            entries.append({'path':path,'mode':'100644','type':'blob','sha':sha})
          tree=request('trees',{'base_tree':'56f8d6ad5cdffad092b1df86b85679b6ded12a77','tree':entries})['sha']
          assert tree==expected
          print('VERIFIED_DOC_TREE='+tree)
          PY
