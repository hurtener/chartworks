name: Verify exact source transport
on:
  push:
    branches: [dev/phase19-sync]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: base64 -w0 .phase19-pack > /tmp/phase19-pack.b64
      - uses: actions/upload-artifact@v4
        with:
          name: phase19-pack
          path: /tmp/phase19-pack.b64
          retention-days: 1
