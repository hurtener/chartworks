# Local PostgreSQL/pgvector for development and real integration tests.
#
#   make pg-up    # start (docker compose up -d postgres)
#   make pg-down  # stop and remove disposable local data
#
# Match the qualified phase-07/08 reference used by CI. Host port 5434
# keeps this disposable metadata server separate from sibling services.
# The values below are synthetic local credentials, not deployment secrets.

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg17
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: chartworks
      POSTGRES_PASSWORD: chartworks
      POSTGRES_DB: chartworks
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chartworks -d chartworks"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - chartworks_pgdata:/var/lib/postgresql/data

volumes:
  chartworks_pgdata:
