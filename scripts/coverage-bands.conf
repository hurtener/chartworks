# Coverage band gate — CLAUDE.md §11 / §14.
#
# Format (whitespace-separated): <import-path-suffix> <min-percent>
#   e.g.
#   internal/store           85
#   internal/acl             85
#   internal/corpus          80
#
# <import-path-suffix> is matched against the tail of a package's full
# import path (github.com/hurtener/chartworks/<relative-path>), so either the
# exact relative path ("internal/store") or a shorter trailing segment
# ("store/postgres") both work.
#
# Empty until Chartworks' own phase plans land — packages land here as
# phases ship (docs/plans), same as the Soundings precedent this toolchain
# is ported from. Any internal/ or cmd/ package that appears with no
# configured band here is a mechanical FAIL (scripts/coverage.sh) —
# CLAUDE.md §11: "a new package with no configured threshold fails the
# build."
